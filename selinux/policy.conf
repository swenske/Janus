# --- user ---------------------------------------------------------
# Declared last, matching mdp's own working order - checkpolicy wants
# the roles a user statement references (system_r, object_r) already
# fully populated with their types by this point, not merely declared.
user system_u roles { system_r object_r };

# --- initial SID contexts -------------------------------------------
# The context every object gets before anything more specific
# (fs_use/genfscon/an explicit xattr) applies - most importantly `sid
# kernel`, which is what rootfs/init (already running as PID 1 long
# before this policy is loaded) retroactively becomes once it is. Also
# has to come after `user` above, same ordering reason.
sid kernel system_u:system_r:init_t
sid security system_u:object_r:security_t
sid unlabeled system_u:object_r:squashfs_t
sid file system_u:object_r:squashfs_t
sid init system_u:system_r:init_t
sid any_socket system_u:object_r:netlabel_t
sid port system_u:object_r:netlabel_t
sid netif system_u:object_r:netlabel_t
sid netmsg system_u:object_r:netlabel_t
sid node system_u:object_r:netlabel_t
sid devnull system_u:object_r:device_t

# --- filesystem labeling behavior -----------------------------------
fs_use_xattr squashfs system_u:object_r:squashfs_t;
fs_use_xattr ext4 system_u:object_r:state_t;
fs_use_task pipefs system_u:object_r:pipefs_t;
fs_use_task sockfs system_u:object_r:sockfs_t;
fs_use_trans devtmpfs system_u:object_r:device_t;
fs_use_trans tmpfs system_u:object_r:tmpfs_t;

genfscon proc / system_u:object_r:proc_t
genfscon sysfs / system_u:object_r:sysfs_t
genfscon selinuxfs / system_u:object_r:selinuxfs_t
genfscon vfat / system_u:object_r:vfat_t
genfscon iso9660 / system_u:object_r:release_t
