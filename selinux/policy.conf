# Janus's own SELinux policy: three real domains for the three real
# processes this rootfs ever runs (rootfs/init, janusd, haproxy),
# plain type enforcement (no MLS - see classes.conf's own header for why),
# hand-written from scratch rather than adapted from any distro's
# refpolicy - refpolicy assumes a systemd/udev-shaped, package-managed
# distro this project structurally isn't, and would need more stripping
# down than it would save. Concatenated after classes.conf (the generated
# class/common/access_vector/policycap header) and compiled together by
# `checkpolicy` - see ../Makefile's `selinux-policy` target.
#
# Labeling strategy: both real filesystems (the read-only squashfs
# rootfs, the writable ext4 STATE partition) are declared `fs_use_xattr`
# below, matching what scripts/selinux/mdp/mdp itself generates as the
# correct behavior for xattr-capable filesystems (as of Phase 4's kernel
# slice, both now carry CONFIG_SQUASHFS_XATTR/CONFIG_EXT4_FS_SECURITY).
# `fs_use_xattr`'s own fallback semantics (any inode with no
# security.selinux xattr gets the context given in the fs_use_xattr
# statement itself) mean only the files whose type actually matters -
# the three real executables - need an explicit xattr set at build time
# (see ../rootfs/assemble.sh's own labeling step); every other file on
# either filesystem just falls through to squashfs_t/state_t, no
# per-file labeling pass over the whole rootfs needed at all. FAT (the
# ESP) can't carry xattrs at all, so it's `genfscon`-labeled instead -
# a single fixed type for anything mounted from a vfat superblock, path
# matching not needed since nothing on the ESP needs a distinct type
# from anything else there.
#
# Confinement is deliberately uneven across the three domains, on
# purpose: init_t and janusd_t are both root, doing genuinely
# privileged system setup (mounting filesystems, loading the policy
# itself, managing PKI, rebooting) - over-confining either buys little,
# since compromising either already means the node is compromised.
# haproxy_t is the one domain that ever parses untrusted, internet-
# facing input, so it's the one actually worth narrowing: no
# self:capability wildcard, only the specific capabilities its own
# privilege-drop/chroot dance needs.
#
# This is a first, real, hand-authored policy - not "allow everything"
# - but the exact allow-rule set below was only ever going to be
# provable right by a real boot with the policy actually loaded and
# AVC denials actually read from dmesg, the same empirical standard
# every other piece of this project is held to (see
# ../hack/qemu-selinux-test.sh and ../docs/architecture.md for what
# that first real boot found and fixed). Permissive by default
# (kernel/configs/janus_defconfig's own SECURITY_SELINUX_DEVELOP=y)
# until a clean, zero-denial boot proves the rule set complete enough
# to flip to enforcing - not assumed complete from this file alone.

# --- process domains --------------------------------------------------
type init_t;
type janusd_t;
type haproxy_t;
# Optional extensions (internal/extensions, extensions/<name>/): declared
# here whether or not an image carries them - one policy for every
# schematic.
type node_exporter_t;
type qemu_ga_t;
type shutdown_t;    # /sbin/shutdown: may only signal PID 1
type keepalived_t;  # keepalived extension: VRRP
type bird_t;        # bird extension: BGP and the other routing protocols
role system_r;
role system_r types { init_t janusd_t haproxy_t node_exporter_t qemu_ga_t shutdown_t keepalived_t bird_t };

# --- executable (entrypoint) file types --------------------------------
type init_exec_t;
type janusd_exec_t;
type haproxy_exec_t;
type node_exporter_exec_t;
type qemu_ga_exec_t;
type shutdown_exec_t;
type qemu_ga_run_t;  # files qemu-ga creates in /run (pidfile, state)
type nft_exec_t;     # nftables extension: nft, run by janusd in its own domain
type keepalived_exec_t;
type keepalived_run_t;  # /run/janus/keepalived (config, pid files, HAProxy health) and its JSON dump
type bird_exec_t;
type bird_run_t;        # /run/janus/bird (config, control socket, pid file)

# --- object types -------------------------------------------------------
type squashfs_t;   # default type for anything on the read-only rootfs
                    # without its own xattr-set type (see the header above)
type state_t;       # default type for anything on the writable STATE
                    # ext4 partition, same reasoning
type vfat_t;        # anything mounted from the ESP (FAT can't carry
                    # xattrs at all, so this is genfscon'd wholesale below)
type release_t;     # Bare-metal Machine tranche: image/iso's embedded
                    # release bundle, mounted read-only from the ISO's
                    # own iso9660 partition (no xattr support either,
                    # same reasoning as vfat_t - genfscon'd below)
type device_t;      # devtmpfs nodes (console, virtio-blk device nodes)
type proc_t;
type sysfs_t;
type selinuxfs_t;
type security_t;    # the kernel's own "security" initial SID (policy
                    # load/reload, setenforce, ... - the `security` class)
type tmpfs_t;       # rootfs/init's mountEphemeral tmpfs layers (/run,
                    # /tmp, /etc's writable overmount)
type pipefs_t;
type sockfs_t;
type netlabel_t;    # the node/netif/port/netmsg/any_socket initial SIDs -
                    # one shared type for v1, since no portcon/nodecon/
                    # netifcon rules exist yet to tell any of them apart

role object_r;
role object_r types {
	init_exec_t janusd_exec_t haproxy_exec_t
	node_exporter_exec_t qemu_ga_exec_t shutdown_exec_t qemu_ga_run_t nft_exec_t
	keepalived_exec_t keepalived_run_t bird_exec_t bird_run_t
	squashfs_t state_t vfat_t release_t device_t proc_t sysfs_t selinuxfs_t
	security_t tmpfs_t pipefs_t sockfs_t netlabel_t
};

# --- filesystem self-association ------------------------------------
# Every object type used as a filesystem's own fs_use_xattr/fs_use_trans/
# fs_use_task default (or an exec_t reachable on one of them) has to be
# explicitly allowed to "associate" with that same type on its own
# filesystem, or even mounting it cleanly is denied - not implicit just
# because source and target happen to match, a real gap a real boot
# caught (tmpfs_t/tmpfs_t on the very first tmpfs mount, see
# ../hack/qemu-selinux-test.sh's own history). Has to come before any
# `allow` rule that depends on a filesystem actually mounting.
# Inbound packets with no netlabel/secmark classification of their own
# (this project configures neither) get the "unlabeled" initial SID's
# context - squashfs_t, in this policy's own mapping - as their packet
# source context, checked (policycap always_check_network) against the
# receiving netif/node's own type on every single packet, not just at
# socket bind/connect time - a real gap only a real network boot caught,
# not decision-time reasoning about the ruleset alone.
allow squashfs_t netlabel_t:netif { ingress egress };
allow squashfs_t netlabel_t:node { recvfrom sendto };
# With netfilter in the kernel (the nftables extension's support, in
# every image), SELinux also checks packets on its netfilter hooks: the
# kernel's own (init_t - its threads, and what it sends for itself: IPv6
# neighbour discovery, TCP ACKs and resets) are unlabeled packets too.
allow init_t squashfs_t:packet *;

allow squashfs_t squashfs_t:filesystem associate;
allow init_exec_t squashfs_t:filesystem associate;
allow janusd_exec_t squashfs_t:filesystem associate;
allow haproxy_exec_t squashfs_t:filesystem associate;
allow node_exporter_exec_t squashfs_t:filesystem associate;
allow qemu_ga_exec_t squashfs_t:filesystem associate;
allow shutdown_exec_t squashfs_t:filesystem associate;
allow nft_exec_t squashfs_t:filesystem associate;
allow state_t state_t:filesystem associate;
allow tmpfs_t tmpfs_t:filesystem associate;
allow qemu_ga_run_t tmpfs_t:filesystem associate;
allow keepalived_exec_t squashfs_t:filesystem associate;
allow keepalived_run_t tmpfs_t:filesystem associate;
allow bird_exec_t squashfs_t:filesystem associate;
allow bird_run_t tmpfs_t:filesystem associate;
allow device_t device_t:filesystem associate;
allow vfat_t vfat_t:filesystem associate;
allow release_t release_t:filesystem associate;
allow proc_t proc_t:filesystem associate;
allow sysfs_t sysfs_t:filesystem associate;
allow selinuxfs_t selinuxfs_t:filesystem associate;
allow pipefs_t pipefs_t:filesystem associate;
allow sockfs_t sockfs_t:filesystem associate;
allow security_t security_t:filesystem associate;

# --- init_t: PID 1, the Go supervisor -------------------------------
# Broadly privileged by necessity (see the header above) - mounts every
# real filesystem this project has, loads this very policy, drops to
# janusd, and is the last-resort revert path
# (rootfs/init/main.go's revertAndReboot) if a pending Upgrade never
# confirms healthy.
allow init_t self:capability *;
allow init_t self:capability2 *;
allow init_t self:process { fork sigchld sigkill sigstop signal signull setpgid getpgid getsession setsched getsched };
allow init_t self:fd use;
allow init_t self:fifo_file { read write open getattr ioctl };
# self:dir search: writeResolvConf's os.ReadFile("/proc/net/pnp") walks
# /proc/net (a symlink to /proc/self/net, which for PID 1 resolves to
# /proc/1/net) - the kernel labels a process's own /proc/<pid> entries
# with that process's own context, not proc_t, so the existing
# proc_t:dir grant above doesn't cover this path at all. Found by a real
# enforcing=1 boot denying the "1" and "net" path components outright,
# not anticipated - init_t had no self:dir rule of any kind before this.
allow init_t self:dir { search read getattr };

allow init_t security_t:security load_policy;

allow init_t proc_t:filesystem { mount unmount getattr };
allow init_t proc_t:dir { search read getattr };
allow init_t proc_t:file { read write open getattr };
allow init_t proc_t:lnk_file read;

allow init_t sysfs_t:filesystem { mount unmount getattr };
allow init_t sysfs_t:dir { search read getattr open };
allow init_t sysfs_t:file { read write open getattr };
# linkVirtioPorts: lists /sys/class/virtio-ports (symlinks to the ports'
# sysfs directories) and creates /dev/virtio-ports/<name> links, the job
# udev does elsewhere - found by a real boot with the guest agent's port.
allow init_t sysfs_t:lnk_file read;

allow init_t selinuxfs_t:filesystem { mount unmount getattr };
allow init_t selinuxfs_t:dir { search read getattr };
allow init_t selinuxfs_t:file { read write open getattr };

allow init_t device_t:filesystem { mount unmount getattr };
# open on device_t:dir and ioctl on device_t:blk_file: internal/nocloud's
# ScanBlockDevices/FindVolume - os.ReadDir("/dev") to enumerate candidate
# virtio-blk devices, then go-diskfs opening each one to check its
# filesystem label - a real enforcing=1 boot denied both outright, not
# anticipated (every earlier device_t access in this file was either a
# single already-known device, like STATE's own mountData, or a char
# device like the console - never "list /dev itself, then open whatever
# shows up" until this).
allow init_t device_t:dir { search read getattr add_name remove_name write mounton open create };
allow init_t device_t:lnk_file { create read getattr };
allow init_t device_t:chr_file { read write open getattr ioctl };
# create/setattr/unlink: the kernel's devtmpfs thread (kdevtmpfs, in
# init_t like every kernel thread) makes the nodes of partitions that
# appear after boot - a disk Install has just partitioned - and removes
# those that go.
allow init_t device_t:blk_file { read write open getattr ioctl create setattr unlink };

allow init_t tmpfs_t:filesystem { mount unmount getattr };
allow init_t squashfs_t:dir mounton;
allow init_t tmpfs_t:dir mounton;
allow init_t tmpfs_t:dir *;
allow init_t tmpfs_t:file *;
allow init_t tmpfs_t:lnk_file *;

allow init_t state_t:filesystem { mount unmount getattr relabelfrom relabelto };
allow init_t state_t:dir mounton;
allow init_t state_t:dir *;
allow init_t state_t:file *;
allow init_t state_t:lnk_file *;

allow init_t squashfs_t:dir { search read getattr };
allow init_t squashfs_t:file { read open getattr execute execute_no_trans map };
allow init_t squashfs_t:chr_file { read write open getattr ioctl };
allow init_t squashfs_t:lnk_file read;

allow init_t vfat_t:filesystem { mount unmount getattr };
allow init_t vfat_t:dir mounton;
allow init_t vfat_t:dir { search read getattr };
allow init_t vfat_t:file { read write open getattr create unlink };

# Bare-metal Machine tranche: mountReleaseBundle's read-only mount of
# the ISO's own embedded release bundle (image/iso/assemble.sh) - no
# write/create/unlink needed at all, unlike vfat_t, since this is
# genuinely read-only (iso9660) content the running node never writes
# to. mounton not needed either - the target dir lives under the
# already-tmpfs_t /etc (mountEphemeral), already covered above.
allow init_t release_t:filesystem { mount unmount getattr };
allow init_t release_t:dir { search read getattr };
allow init_t release_t:file { read open getattr };

allow init_t netlabel_t:tcp_socket *;
allow init_t netlabel_t:node *;
allow init_t netlabel_t:netif *;

# init -> janusd domain transition
allow init_t janusd_exec_t:file { read open getattr execute map };
allow init_t janusd_t:process { transition sigchld sigkill sigstop signal noatsecure rlimitinh siginh };
type_transition init_t janusd_exec_t:process janusd_t;
allow janusd_t janusd_exec_t:file entrypoint;
allow janusd_t init_t:process sigchld;
allow janusd_t init_t:fd use;
# janusd's stdout/stderr: rootfs/init's pipe, copied to the serial
# console and the screen (rootfs/init/console.go).
allow janusd_t init_t:fifo_file { write append getattr ioctl };

# --- janusd_t: the control-plane daemon --------------------------
allow janusd_t self:capability *;
allow janusd_t self:capability2 *;
allow janusd_t self:process { fork sigchld sigkill sigstop signal signull getsched setsched };
allow janusd_t self:fifo_file { read write open getattr ioctl };
allow janusd_t self:dir search;
allow janusd_t self:lnk_file read;
allow janusd_t self:tcp_socket *;
allow janusd_t self:unix_stream_socket *;
allow janusd_t self:fd use;
# Point 2 suite tranche 5: internal/selfregister.DetectAdvertiseAddress
# dials a connected UDP "socket" purely to consult the routing table
# (no packet is ever actually sent - net.Dial("udp", ...) just picks a
# local source address/interface for the given destination) - a real
# enforcing=1 boot denied its plain socket(2) create outright, the
# udp_socket class never having come up before this (every other
# network object class janusd_t touches is TCP or Unix-domain, both
# already covered above).
allow janusd_t self:udp_socket *;
# cmd/janusd/main.go's localNetworkIPs() (first-boot server-cert
# SAN detection) calls net.InterfaceAddrs(), which queries the kernel
# over an AF_NETLINK/NETLINK_ROUTE socket - a genuinely different
# object class from the tcp/unix sockets already covered above, found
# missing only by a real CI failure (qemu-selinux-test's permissive-
# mode boot denying create/bind/write/nlmsg/getattr/read on it), not
# anticipated ahead of time.
allow janusd_t self:netlink_route_socket { create bind write nlmsg getattr read };
# SystemService.PacketCapture (internal/api/pcap.go): an AF_PACKET raw
# socket, with its BPF filter, receive timeout and promiscuous
# membership all set via setsockopt.
allow janusd_t self:packet_socket { create bind setopt read getattr };
# The firewall (nftables extension): janusd runs nft in its own domain -
# janusd_t is already the node's administrator, a separate domain for a
# tool it drives would confine nothing - over nf_tables' netlink.
allow janusd_t nft_exec_t:file { read open getattr execute execute_no_trans map };
allow janusd_t self:netlink_netfilter_socket { create bind setopt getopt read write getattr };
# The observability and "no shell" file RPCs (internal/api/
# system_proc.go, system_files.go, system_logs.go): janusd lists
# directories now (ReadDir needs dir open), reads every process's
# /proc/<pid> - labeled with that process's own domain, init_t for PID 1
# and every kernel thread (the kernel SID maps to init_t) - statfs()s
# every mounted filesystem, and reads /dev/kmsg (syslog_read, checked
# against the kernel SID).
allow janusd_t self:dir { search read open getattr };
allow janusd_t self:file { read open getattr };
allow janusd_t { init_t haproxy_t }:dir { search read open getattr };
allow janusd_t { init_t haproxy_t }:file { read open getattr };
allow janusd_t { init_t haproxy_t }:lnk_file { read getattr };
allow janusd_t init_t:system syslog_read;
allow janusd_t { proc_t sysfs_t squashfs_t device_t release_t vfat_t }:dir open;
allow janusd_t { proc_t sysfs_t squashfs_t device_t }:lnk_file { read getattr };
allow janusd_t selinuxfs_t:dir { search getattr };
# The exporter's janus_selinux_enforcing reads /sys/fs/selinux/enforce.
allow janusd_t selinuxfs_t:file { read open getattr };
allow janusd_t { squashfs_t state_t tmpfs_t proc_t sysfs_t device_t selinuxfs_t release_t }:filesystem getattr;

allow janusd_t proc_t:dir { search read getattr };
allow janusd_t proc_t:file { read open getattr };
allow janusd_t proc_t:lnk_file read;

allow janusd_t sysfs_t:dir { search read getattr };
allow janusd_t sysfs_t:file { read open getattr };

allow janusd_t squashfs_t:dir { search read getattr };
allow janusd_t squashfs_t:file { read open getattr execute execute_no_trans map };
allow janusd_t squashfs_t:chr_file { read write open getattr ioctl };
allow janusd_t squashfs_t:lnk_file read;
allow janusd_t janusd_exec_t:file { read open getattr execute execute_no_trans map };

allow janusd_t state_t:dir *;
allow janusd_t state_t:file *;
allow janusd_t state_t:lnk_file *;

allow janusd_t tmpfs_t:dir *;
allow janusd_t tmpfs_t:file *;
allow janusd_t tmpfs_t:sock_file *;
allow janusd_t tmpfs_t:lnk_file *;

allow janusd_t device_t:dir { search read getattr };
allow janusd_t device_t:chr_file { read write open getattr ioctl };
# ioctl: Bare-metal Machine tranche - LifecycleService.Install's
# go-diskfs backend queries an arbitrary attached block device's size
# (BLKGETSIZE64) before partitioning it - a real enforcing=1 denial
# found calling Install against a genuinely attached target disk from a
# running (not native, unlike hack/lifecycle-install-test.sh) janusd
# for the first time, see hack/qemu-iso-install-test.sh.
allow janusd_t device_t:blk_file { read write open getattr ioctl };

allow janusd_t vfat_t:filesystem { mount unmount getattr };
# write/add_name on the ESP's directories: Upgrade and Rollback rewrite
# \JANUS\UKI-<slot>.EFI and \EFI\BOOT\BOOT*.EFI with O_CREAT, which
# vfat checks against the directory - denied under enforcing by
# hack/qemu-extensions-test.sh, the first upgrade test to look for
# denials; the writes still went through, but the create/unlink file
# permissions below were always meant to come with it.
allow janusd_t vfat_t:dir { search read getattr write add_name remove_name };
allow janusd_t vfat_t:file { read write open getattr create unlink };

# Bare-metal Machine tranche: LifecycleService.Install reading a
# release bundle straight from the ISO's own bind-mounted release_t
# content (BUNDLE_DIR=/etc/janus/release) - read-only, same reasoning
# as init_t's own release_t rules above.
allow janusd_t release_t:dir { search read getattr };
allow janusd_t release_t:file { read open getattr };

allow janusd_t netlabel_t:tcp_socket *;
allow janusd_t netlabel_t:node *;
allow janusd_t netlabel_t:netif *;
allow janusd_t squashfs_t:peer recv;
allow janusd_t squashfs_t:packet *;

# janusd -> haproxy domain transition
allow janusd_t haproxy_exec_t:file { read open getattr execute map };
allow janusd_t haproxy_t:process { transition sigchld sigkill sigstop signal noatsecure rlimitinh siginh };
allow janusd_t haproxy_t:unix_stream_socket connectto;
type_transition janusd_t haproxy_exec_t:process haproxy_t;
allow haproxy_t haproxy_exec_t:file entrypoint;
allow haproxy_t janusd_t:process sigchld;
allow haproxy_t janusd_t:fd use;
# internal/haproxy.Manager.Validate's `haproxy -c` (CombinedOutput())
# pipes stdout/stderr through a fifo_file os/exec creates in the
# janusd_t domain, inherited by this transitioned haproxy_t child -
# a genuinely different object from the supervised process's own
# startOrReload, which inherits janusd_t's actual console
# (device_t:chr_file, already covered below) instead of a pipe. Without
# this, every validation error haproxy tries to print gets silently
# denied mid-write: the process still exits 1 (SELinux doesn't block
# the syscall from happening, just the write itself), so validation
# correctly still rejects the config, but with zero captured error
# text - found by a real ApplyConfig/ValidateConfig call against a
# genuinely invalid config returning an empty error list on a real
# boot, not by policy inspection.
allow haproxy_t janusd_t:fifo_file { read write };

# --- haproxy_t: the actual reverse-proxy worker ----------------------
# Narrowly confined on purpose - the one domain that parses untrusted,
# internet-facing input. Only the specific capabilities its own
# startup sequence needs (chroot() into /var/empty, drop from root to
# uid/gid 1000), never a blanket self:capability wildcard.
allow haproxy_t self:capability { net_bind_service setuid setgid sys_chroot dac_override dac_read_search chown fsetid };
# A seamless reload (-sf <old pid>, internal/haproxy.Manager): the new
# haproxy signals the one it replaces. Never actually exercised before
# 2026-09-30 - janusd never managed to pass -sf until then (HAProxy
# doesn't write its -p pid file in foreground mode), so every reload left
# the old process running.
allow haproxy_t self:capability kill;
allow haproxy_t self:process { fork sigchld sigkill sigstop signal signull setpgid getpgid getsched setsched setrlimit };
allow haproxy_t self:tcp_socket *;
allow haproxy_t self:unix_stream_socket *;
# udp_socket: HAProxy auto-detects /etc/resolv.conf at startup and opens
# a UDP socket to each nameserver it finds there for its own internal
# resolver, regardless of whether the running config's servers actually
# need DNS - found once rootfs/init's writeResolvConf started making
# /etc/resolv.conf exist for the first time in this project's history
# (previously this file was simply absent on every boot, so HAProxy's
# auto-detection found nothing and this path was never exercised).
allow haproxy_t self:udp_socket *;
allow haproxy_t self:fd use;
allow haproxy_t self:fifo_file { read write open getattr ioctl };
allow haproxy_t self:process getcap;
allow haproxy_t init_t:fd use;
allow haproxy_t init_t:dir search;
allow haproxy_t init_t:file { read open getattr };

allow haproxy_t proc_t:dir { search read getattr };
allow haproxy_t proc_t:file { read open getattr };

# open: HAProxy lists /sys/devices/system/node for the NUMA topology
# (kernel NUMA support, since the bare-metal tranche).
allow haproxy_t sysfs_t:dir { search read getattr open };
allow haproxy_t sysfs_t:file { read open getattr };

allow haproxy_t squashfs_t:dir { search read getattr };
allow haproxy_t squashfs_t:file { read open getattr map };
allow haproxy_t squashfs_t:chr_file { read write open getattr ioctl };
allow haproxy_t squashfs_t:lnk_file read;
allow haproxy_t haproxy_exec_t:file { read open getattr execute execute_no_trans map };

allow haproxy_t state_t:dir { search read getattr };
allow haproxy_t state_t:file { read open getattr };
allow haproxy_t state_t:lnk_file read;

allow haproxy_t tmpfs_t:dir *;
allow haproxy_t tmpfs_t:file *;
allow haproxy_t tmpfs_t:sock_file *;
allow haproxy_t tmpfs_t:lnk_file *;

allow haproxy_t device_t:dir { search read getattr };
allow haproxy_t device_t:chr_file { read write open getattr ioctl };

allow haproxy_t netlabel_t:tcp_socket *;
allow haproxy_t netlabel_t:node *;
allow haproxy_t netlabel_t:netif *;
allow haproxy_t squashfs_t:peer recv;
allow haproxy_t squashfs_t:packet *;

# --- optional extensions ------------------------------------------
# Services janusd runs for an image's extensions (internal/extensions),
# each in its own domain entered on exec, like haproxy_t. The rules
# below the transitions come from real denials under enforcing
# (hack/qemu-extensions-test.sh), not from reading the programs.

# node_exporter: reads /proc and /sys, serves :9100.
allow janusd_t node_exporter_exec_t:file { read open getattr execute map };
allow janusd_t node_exporter_t:process { transition sigchld sigkill sigstop signal noatsecure rlimitinh siginh };
type_transition janusd_t node_exporter_exec_t:process node_exporter_t;
allow node_exporter_t node_exporter_exec_t:file { entrypoint read open getattr execute map };
allow node_exporter_t janusd_t:process sigchld;
allow node_exporter_t janusd_t:fd use;
allow node_exporter_t janusd_t:fifo_file { read write getattr };
allow node_exporter_t init_t:fd use;
allow node_exporter_t device_t:chr_file { read write getattr ioctl };
allow node_exporter_t self:process { fork sigchld signal signull getsched setsched };
allow node_exporter_t self:fd use;
allow node_exporter_t self:tcp_socket *;
allow node_exporter_t self:fifo_file { read write open getattr ioctl };
allow node_exporter_t netlabel_t:tcp_socket *;
allow node_exporter_t netlabel_t:node *;
allow node_exporter_t netlabel_t:netif *;
allow node_exporter_t squashfs_t:peer recv;
allow node_exporter_t squashfs_t:packet *;

# Read-only access to what its collectors read: /proc (its own entry and
# /proc/1/mounts, whose owner - PID 1 - is init_t), /sys, os-release on
# the rootfs, netlink for interface statistics, statfs on the mounts.
allow node_exporter_t self:dir { getattr search };
allow node_exporter_t self:file { open read };
allow node_exporter_t self:lnk_file read;
allow node_exporter_t self:netlink_route_socket { bind create getattr getopt nlmsg read write };
allow node_exporter_t init_t:dir search;
allow node_exporter_t init_t:file { open read };
allow node_exporter_t proc_t:dir { search getattr };
allow node_exporter_t proc_t:file { getattr open read };
allow node_exporter_t proc_t:lnk_file read;
allow node_exporter_t sysfs_t:dir { search getattr open read };
allow node_exporter_t sysfs_t:file { getattr open read };
allow node_exporter_t sysfs_t:lnk_file read;
allow node_exporter_t squashfs_t:dir search;
allow node_exporter_t squashfs_t:file { open read };
allow node_exporter_t tmpfs_t:dir search;
allow node_exporter_t { proc_t state_t tmpfs_t }:filesystem getattr;

# qemu-ga: talks to the hypervisor over its virtio-serial port, reads
# the node's state, and runs /sbin/shutdown - in shutdown_t, the only
# domain allowed to signal PID 1 for a power action.
allow janusd_t qemu_ga_exec_t:file { read open getattr execute map };
allow janusd_t qemu_ga_t:process { transition sigchld sigkill sigstop signal noatsecure rlimitinh siginh };
type_transition janusd_t qemu_ga_exec_t:process qemu_ga_t;
allow qemu_ga_t qemu_ga_exec_t:file { entrypoint read open getattr execute map };
allow qemu_ga_t janusd_t:process sigchld;
allow qemu_ga_t janusd_t:fd use;
allow qemu_ga_t janusd_t:fifo_file { read write getattr };
allow qemu_ga_t init_t:fd use;
allow qemu_ga_t self:process { fork sigchld signal signull getsched setsched };
allow qemu_ga_t self:fd use;
allow qemu_ga_t self:fifo_file { read write open getattr ioctl };

allow qemu_ga_t shutdown_exec_t:file { read open getattr execute map };
allow qemu_ga_t shutdown_t:process { transition sigchld noatsecure rlimitinh siginh };
type_transition qemu_ga_t shutdown_exec_t:process shutdown_t;
allow shutdown_t shutdown_exec_t:file { entrypoint read open getattr execute map };
allow shutdown_t qemu_ga_t:process sigchld;
allow shutdown_t qemu_ga_t:fd use;
allow shutdown_t qemu_ga_t:fifo_file { read write getattr };
allow shutdown_t init_t:fd use;
allow shutdown_t init_t:process signal;
allow shutdown_t self:fd use;
# Its channel (/dev/virtio-ports/<name> -> /dev/vportNpM) and
# /dev/null; interface, filesystem and CPU information from /proc and
# /sys; an ioctl socket for interface addresses; syslog. fsfreeze opens
# the mounted filesystems' root directories for FIFREEZE/FITHAW.
allow qemu_ga_t device_t:dir search;
allow qemu_ga_t device_t:lnk_file read;
allow qemu_ga_t device_t:chr_file { read write open getattr };
allow qemu_ga_t self:dir search;
allow qemu_ga_t self:file { open read };
allow qemu_ga_t self:lnk_file read;
allow qemu_ga_t self:unix_dgram_socket { connect create write };
allow qemu_ga_t self:netlink_route_socket { create nlmsg read write };
allow qemu_ga_t self:tcp_socket { create ioctl };
allow qemu_ga_t proc_t:dir search;
allow qemu_ga_t proc_t:file { getattr open read };
allow qemu_ga_t proc_t:lnk_file read;
allow qemu_ga_t sysfs_t:dir { open read search };
allow qemu_ga_t sysfs_t:lnk_file read;
allow qemu_ga_t squashfs_t:dir { search ioctl open read };
allow qemu_ga_t squashfs_t:file { getattr open read };
allow qemu_ga_t state_t:dir { ioctl open read };
allow qemu_ga_t { squashfs_t state_t }:filesystem getattr;
# FIFREEZE/FITHAW (guest-fsfreeze-*, consistent hypervisor backups)
# require CAP_SYS_ADMIN - the kernel's check, not a policy choice. The
# domain's other rules still bound what it can do with it: no mount, no
# writes outside its own run files.
allow qemu_ga_t self:capability sys_admin;
# Its pidfile and state files in /run: created there with their own type
# (qemu_ga_run_t), so qemu-ga can't touch the other tmpfs files - /etc's
# included, a tmpfs on a running node.
allow qemu_ga_t tmpfs_t:dir { search write add_name remove_name };
type_transition qemu_ga_t tmpfs_t:file qemu_ga_run_t;
allow qemu_ga_t qemu_ga_run_t:file { create open read write rename unlink getattr };

allow shutdown_t device_t:chr_file { read write };
allow shutdown_t self:process { fork signal getsched };
allow shutdown_t self:dir search;
allow shutdown_t proc_t:dir search;
allow shutdown_t proc_t:lnk_file read;
allow shutdown_t squashfs_t:dir search;
allow shutdown_t sysfs_t:dir search;

# keepalived (VRRP extension). janusd writes its configuration into a
# directory of its own, /run/janus/keepalived (keepalived_run_t, by a
# named transition), which keepalived reads - it never reads STATE, which
# holds the node's keys. keepalived needs the network administration its
# job is: VRRP over raw IP sockets, gratuitous ARP over packet sockets,
# virtual IPs over netlink.
allow janusd_t keepalived_t:process { transition sigchld sigkill sigstop signal signull noatsecure rlimitinh siginh };
type_transition janusd_t keepalived_exec_t:process keepalived_t;
allow janusd_t keepalived_exec_t:file { read open getattr execute map };
type_transition janusd_t tmpfs_t:dir keepalived_run_t "keepalived";
allow janusd_t keepalived_run_t:dir { create search read write add_name remove_name getattr open setattr };
allow janusd_t keepalived_run_t:file { create read write open getattr setattr unlink rename };
allow janusd_t keepalived_t:dir { search read open getattr };
allow janusd_t keepalived_t:file { read open getattr };
allow janusd_t keepalived_t:lnk_file { read getattr };
allow keepalived_t keepalived_exec_t:file { entrypoint read open getattr execute map };
allow keepalived_t janusd_t:process sigchld;
allow keepalived_t janusd_t:fd use;
allow keepalived_t janusd_t:fifo_file { read write getattr ioctl };
allow keepalived_t init_t:fd use;
allow keepalived_t device_t:dir search;
allow keepalived_t device_t:chr_file { read write open getattr ioctl };
allow keepalived_t self:capability { net_admin net_raw net_broadcast sys_nice ipc_lock setuid setgid kill };
allow keepalived_t self:process { fork sigchld signal signull sigkill getsched setsched setrlimit getpgid setpgid };
allow keepalived_t self:fd use;
allow keepalived_t self:fifo_file { read write open getattr ioctl };
allow keepalived_t self:unix_dgram_socket *;
allow keepalived_t self:unix_stream_socket *;
allow keepalived_t self:rawip_socket *;
allow keepalived_t self:packet_socket *;
allow keepalived_t self:udp_socket *;
allow keepalived_t self:netlink_route_socket *;
allow keepalived_t netlabel_t:rawip_socket *;
allow keepalived_t netlabel_t:udp_socket *;
allow keepalived_t netlabel_t:node *;
allow keepalived_t netlabel_t:netif *;
allow keepalived_t squashfs_t:peer recv;
allow keepalived_t squashfs_t:packet *;
allow keepalived_t self:dir { search read open getattr };
allow keepalived_t self:file { open read getattr };
allow keepalived_t self:lnk_file read;
allow keepalived_t proc_t:dir { search read open getattr };
allow keepalived_t proc_t:file { open read write getattr };
allow keepalived_t proc_t:lnk_file read;
allow keepalived_t sysfs_t:dir { search read open getattr };
allow keepalived_t sysfs_t:file { open read getattr };
allow keepalived_t sysfs_t:lnk_file read;
allow keepalived_t squashfs_t:dir { search read open getattr };
allow keepalived_t squashfs_t:file { open read getattr };
allow keepalived_t tmpfs_t:dir { search getattr write add_name remove_name };
# /etc/resolv.conf (its resolver starting): no secret is tmpfs_t - the
# node's keys are on STATE.
allow keepalived_t tmpfs_t:file { open read getattr };
# track_file: keepalived follows the health file with inotify.
allow keepalived_t keepalived_run_t:dir { search read open getattr write add_name remove_name watch };
allow keepalived_t keepalived_run_t:file { create read write open getattr setattr ioctl unlink rename lock watch };
type_transition keepalived_t tmpfs_t:file keepalived_run_t;
allow keepalived_t { proc_t squashfs_t tmpfs_t }:filesystem getattr;

# BIRD (bird extension). Same arrangement as keepalived: janusd writes
# bird.conf into /run/janus/bird (bird_run_t, by a named transition),
