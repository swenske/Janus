allow bird_t netlabel_t:node *;
allow bird_t netlabel_t:netif *;
allow bird_t squashfs_t:peer recv;
allow bird_t squashfs_t:packet *;
allow bird_t self:dir { search read open getattr };
allow bird_t self:file { open read getattr };
allow bird_t self:lnk_file read;
allow bird_t proc_t:dir { search read open getattr };
allow bird_t proc_t:file { open read getattr };
allow bird_t proc_t:lnk_file read;
allow bird_t sysfs_t:dir { search read open getattr };
allow bird_t sysfs_t:file { open read getattr };
