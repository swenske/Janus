# hack/ui-preview's nodes: HTTP on :80 and HTTPS on :443 (HTTP/2 offered:
# setup.mjs puts its certificate in /etc/haproxy/files) to two backends,
# TCP on :5432 to a third - the application servers of hack/ui-preview/
# app.cfg; /admin is refused (403), /broken goes to a backend without a
# server (503): Metrics' breakdowns get every kind. (A frontend and a
# backend can't share a name since HAProxy 3.3.)
global
    log stdout format raw local0
    stats socket /run/janus/haproxy-admin.sock mode 660 level admin
    chroot /var/empty
    uid 1000
    gid 1000

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend web
    bind :80
    http-request return status 200 content-type text/plain string "ok\n" if { path /healthz }
    http-request deny if { path_beg /admin }
    use_backend broken if { path_beg /broken }
    use_backend api if { path_beg /api/ }
    default_backend app

frontend web-tls
    bind :443 ssl crt /etc/haproxy/files/preview.pem alpn h2,http/1.1
    http-request deny if { path_beg /admin }
    use_backend broken if { path_beg /broken }
    use_backend api if { path_beg /api/ }
    default_backend app

frontend postgres
    mode tcp
    option tcplog
    bind :5432
    default_backend db

backend app
    balance roundrobin
    option httpchk GET /healthz
    default-server check inter 2s fall 3 rise 2
    server app1 10.0.30.11:8080
    server app2 10.0.30.12:8080

backend api
    balance leastconn
    option httpchk GET /healthz
    default-server check inter 2s fall 3 rise 2
    server app1 10.0.30.11:8080
    server app2 10.0.30.12:8080

backend db
    mode tcp
    default-server check inter 2s fall 3 rise 2
    server db1 10.0.30.11:8082
    server db2 10.0.30.12:8082

backend broken
