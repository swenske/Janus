# hack/ui-preview's application servers - HAProxy answering: "ok" and a
# JSON list on :8080, a 12 KiB answer on :8082 (what the nodes' TCP
# frontend reaches; an http-request return answer must fit in a 16 KiB
# buffer), the Controller's releases on :8081.
global
    log stdout format raw local0
    chroot /
    uid 65534
    gid 65534
defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
frontend app
    bind :8080
    http-request return status 200 content-type application/json string "[{\"id\":1},{\"id\":2},{\"id\":3}]\n" if { path_beg /api/ }
    http-request return status 200 content-type text/plain string "ok\n"
frontend bulk
    bind :8082
    http-request return status 200 content-type application/octet-stream file /preview/payload
frontend releases
    bind :8081
    http-request return status 200 content-type application/json file /preview/releases.json if { path /releases }
    http-request return status 404
