# hack/ui-preview's edge-3: a load balancer with many sites, as a big
# one has - a backend each, their servers' names long, two of them down
# (nothing answers at their address), one backend holding a stick table
# only: HAProxy's Backends tab and the Traffic flow with many tiles.
global
    log stdout format raw local0
    stats socket /run/janus/haproxy-admin.sock mode 660 level admin
    chroot /var/empty
    uid 1000
    gid 1000

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    default-server check inter 3s fall 2 rise 2

frontend www
    bind :80
    http-request track-sc0 src table st_abuse
    http-request return status 200 content-type text/plain string "ok\n" if { path /healthz }
    use_backend api if { path_beg /api/ }
    use_backend be_landing if { hdr(host) -i landing.example.com }
    use_backend be_git if { hdr(host) -i git.example.com }
    use_backend be_nas if { hdr(host) -i nas.example.com }
    use_backend be_vault if { hdr(host) -i vault.example.com }
    use_backend be_notify if { hdr(host) -i notify.example.com }
    use_backend be_homeautomation if { hdr(host) -i homeautomation.example.com }
    use_backend be_radio if { hdr(host) -i radio.example.com }
    use_backend be_static if { hdr(host) -i static.example.com }
    use_backend be_packages if { hdr(host) -i packages.example.com }
    use_backend be_mirror if { hdr(host) -i mirror.example.com }
    use_backend be_remotedesk if { hdr(host) -i remotedesk.example.com }
    use_backend be_shortener if { hdr(host) -i shortener.example.com }
    use_backend be_site if { hdr(host) -i site.example.com }
    use_backend be_reader if { hdr(host) -i reader.example.com }
    use_backend be_status if { hdr(host) -i status.example.com }
    use_backend be_retro if { hdr(host) -i retro.example.com }
    use_backend be_retro-staging if { hdr(host) -i retro-staging.example.com }
    use_backend be_retro-wiki if { hdr(host) -i retro-wiki.example.com }
    use_backend be_tunnel if { hdr(host) -i tunnel.example.com }
    use_backend be_sync if { hdr(host) -i sync.example.com }
    use_backend be_media if { hdr(host) -i media.example.com }
    use_backend be_tls-passthrough if { hdr(host) -i tls-passthrough.example.com }
    use_backend be_tls-tunnel if { hdr(host) -i tls-tunnel.example.com }
    use_backend be_photos if { hdr(host) -i photos.example.com }
    default_backend be_landing

backend st_abuse
    stick-table type ip size 100k expire 10m store http_req_rate(10s)

backend api
    balance leastconn
    option httpchk GET /healthz
    server app1 10.0.30.11:8080
    server app2 10.0.30.12:8080

backend be_landing
    option httpchk GET /healthz
    server www-01 10.0.30.11:8080
    server www-02 10.0.30.12:8080

