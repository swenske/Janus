# Shared setup of every Janus image-build job, on a Janus self-hosted
# runner (.github/workflows/image-build.yml): Go, the QEMU and image
# tools. No Node.js: the tests build the Controller from its committed
# frontend (make dashboard-bin), and what needs Node - the docs, the
# browser checks - runs it in its own pinned image. Expects the
# repository checked out.
name: Janus runner setup
description: Go, QEMU and the image tools on a Janus self-hosted runner.
runs:
  using: composite
  steps:
    # The runner keeps Go's module and build caches on its own disk
    # between runs; setup-go's cache restored and saved them through
    # GitHub's cache service instead - about 2 minutes a run.
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false

    - name: Install QEMU + rootfs build tools
      shell: bash
      # Several jobs share a machine: installed once, and never two apt
      # runs at a time (dpkg's lock would fail the second one).
      run: |
        pkgs="make qemu-system-x86 qemu-utils squashfs-tools cryptsetup-bin e2fsprogs gdisk
          ovmf systemd-ukify mtools dosfstools sbsigntool python3-virt-firmware xorriso ipxe
          qemu-system-arm crossbuild-essential-arm64 qemu-efi-aarch64 unzip openssh-client"
        dpkg -s $pkgs >/dev/null 2>&1 || sudo flock /var/lock/janus-runner-setup.lock sh -c "
          apt-get update -qq && apt-get install -y -qq $(echo $pkgs)"
