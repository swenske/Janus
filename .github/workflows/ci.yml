# Continuous integration: lint, test, and build the Janus control
# plane (cmd/, internal/, gen/, dashboard/), the Terraform provider
# (terraform-provider-janus/), the Controller's frontend's lint and
# unit tests (dashboard/frontend/), the site's frontend (site/frontend/)
# and the docs site (site/docs/) on every push to main and every pull
# request (including from forks). Always runs on GitHub-hosted runners -
# free/unlimited on a public repo, and this is the one workflow that MUST
# accept untrusted fork PRs, so it never touches the self-hosted runner or
# any secret. It does NOT build the kernel/rootfs/image - see
# image-build.yml for that (self-hosted, manual only).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # No branch filter - PRs from any branch, including forks, run these
    # checks. Nothing here needs a secret or the self-hosted runner.

# The token only ever reads the repository: no job writes a check, a
# comment or a release here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A superseded push to a PR is cancelled; every push to main gets its
  # full result (run 39293735858 on main was cancelled by the next push).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # One cache per job (modules and build cache, keyed on go.sum, the
      # job's last one as a fallback): setup-go's single key was saved by
      # whichever job finished first - vulncheck, in 25 s - so it never
      # held the -race objects test needs nor build's. A PR reads main's
      # caches, never the other way round.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-

      # Pinned like every other tool here (the version the build box
      # lints with); bumped by hand.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      # gen/janus/v1alpha1 (generated from api/proto/**.proto via
      # `make proto`) must stay committed and in sync - this job's own `go
      # build`/`go test` never regenerates it. Catch anyone who edited a
      # .proto without regenerating/committing the Go output.
      # Pinned (@latest compiled a different buf every run, 52 s cold);
      # from the job's build cache, seconds. Bumped by hand with the
      # protobuf and grpc modules in go.mod.
      - name: Install buf and protoc-gen-go plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.74.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Check generated proto code is up to date
        run: |
          make proto
          git diff --exit-code -- gen

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # One cache per job (modules and build cache, keyed on go.sum, the
      # job's last one as a fallback): setup-go's single key was saved by
      # whichever job finished first - vulncheck, in 25 s - so it never
      # held the -race objects test needs nor build's. A PR reads main's
      # caches, never the other way round.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-

      - run: go test ./... -race -cover

  # Known vulnerabilities in the Go toolchain and dependencies that this
  # code actually reaches (govulncheck's default, call-graph-based mode -
  # a vulnerable module that's only required, never called, is reported
  # but doesn't fail the job). Needs no secret, safe for fork PRs.
  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # One cache per job (modules and build cache, keyed on go.sum, the
      # job's last one as a fallback): setup-go's single key was saved by
      # whichever job finished first - vulncheck, in 25 s - so it never
      # held the -race objects test needs nor build's. A PR reads main's
      # caches, never the other way round.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-

      # Pinned as a go.mod tool (Dependabot updates it), not @latest.
      - run: go tool govulncheck ./...

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # One cache per job (modules and build cache, keyed on go.sum, the
      # job's last one as a fallback): setup-go's single key was saved by
      # whichever job finished first - vulncheck, in 25 s - so it never
      # held the -race objects test needs nor build's. A PR reads main's
      # caches, never the other way round.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-

      - run: go build ./...

  # The Terraform provider (terraform-provider-janus/): its own Go module,
  # so the jobs above - on the root module's ./... - don't reach it.
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform-provider-janus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: terraform-provider-janus/go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ hashFiles('terraform-provider-janus/go.sum') }}
          restore-keys: go-${{ github.job }}-

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: terraform-provider-janus
          args: --config ../.golangci.yml

      - run: go test ./... -race -cover

      # The root module's govulncheck tool, run on this module.
      - run: go -C .. tool govulncheck -C terraform-provider-janus ./...

      - run: go build ./...

  # The Controller's frontend (dashboard/frontend/): its lint and its unit
  # tests (node --test - the console's terminal colors, src/ansi.js). Its
  # built output is committed (make dashboard-frontend-build), so the job
  # rebuilds it and fails when the commit doesn't carry what its sources
  # build - a Dependabot npm update, say, without the rebuild. Node from
  # its .nvmrc: 24, the active LTS, as the docs build.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/frontend/.nvmrc

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Check the committed build is up to date
        run: |
          npm run build
          out="../backend/static ../backend/internal/nodeproxy/static"
          if [ -n "$(git status --porcelain -- $out)" ]; then
            git status --short -- $out
            echo "::error::the committed frontend build doesn't match its sources - run make dashboard-frontend-build and commit the result"
            exit 1
          fi

  # The docs site (site/docs/, served at janus.sw-servers.net/docs/), built
  # the way site-deploy builds it - in Docker, no Node on the runner:
  # markdownlint; the Astro build, which a relative link to nothing or a
  # diagram without its accessible title fails; then check-dist on the
  # built site - every link and #fragment resolves, every page has its
  # title and description and is in its sidebar, the sitemap and the
  # search index are whole. Always: a relative link from a page to a
  # file of the repository is checked by the build, so a Go file renamed
  # can break it. Full history: git describe names the build. The built
  # site goes to docs-smoke as an artifact.
  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # Whether the change touches what the browser walk looks at.
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-

      - run: make docs-build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docsdist-${{ github.sha }}
          path: site/backend/docsdist
          retention-days: 1
          if-no-files-found: error

      # What the browser walk (docs-smoke) depends on: the pages and
      # their sources, the site that serves them, the walk itself. A
      # pull request that touches none of it skips the walk - it took 4
      # of the 5 minutes of the job it was in; a push to main always
      # walks. Checked on the checkout (git diff against the PR's base),
      # no third-party action, no permission. Never the required checks
      # (lint, test, build): a skipped required check blocks a merge.
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          if grep -qE '^(docs/|site/|examples/|brand/|api/proto/|hack/browser/|internal/rbac/|(.*/)?README\.md$|Makefile$|hack/docs-[^/]*\.sh$|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing the browser walk looks at changed: no walk"
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

  # janus-site serves the built docs, and the pinned browser (hack/browser)
  # walks every page: both themes, a phone, search, axe, no console
  # error, no CSP violation; then the Lighthouse budget. On its own
  # since 2026-10-20 (it was the critical path of every run, docs or
  # not), only when docs-build says the change concerns it.
  docs-smoke:
    needs: docs-build
    if: ${{ needs.docs-build.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docsdist-${{ github.sha }}
          path: site/backend/docsdist

      - run: make docs-smoke

  # The examples the docs show (examples/): OpenTofu validates the
  # Terraform ones against the provider built here, promtool the
  # Prometheus ones, docker compose the Controller's compose.yaml.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-

      - run: make examples-check

  # The site's frontend (site/frontend/): its lint, and its committed build
  # (site/backend/static) checked against its sources - which include the
  # Controller's shared components (dashboard/frontend/src/shared). Node
  # from its .nvmrc: 24, the active LTS.
  site-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/frontend/.nvmrc

      - run: npm ci

      - run: npm run lint

      - name: Check the committed build is up to date
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- ../backend/static)" ]; then
            git status --short -- ../backend/static
            echo "::error::the committed site build doesn't match its sources - run make site-frontend-build and commit the result"
            exit 1
          fi
