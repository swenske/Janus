# Full Janus image build and tests: kernel, pkgs/*, rootfs, every disk
# image, and the QEMU tests that boot them - on the self-hosted runners
# (which machines: docs/ci-runners.md), kept strictly
# separate from ci.yml (GitHub-hosted, safe for forks).
#
# workflow_dispatch only, on purpose - never triggered by push/pull_request.
#
# The test jobs run in parallel, each on its own runner instance (a
# machine runs several, each with its own JANUS_TEST_PORT_OFFSET in its
# .env, so tests on one machine never share a port); each job builds what
# its tests need itself - the Docker build cache makes that seconds - so
# nothing passes between jobs. The tests boot their guests with KVM when
# the runner has it (-accel kvm -accel tcg). publish needs every test job:
# a failing test still blocks every image, the Docker Hub push and the
# release, as when this was one job. docs-screenshots only reports.

name: Image Build

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Publish a real, permanent GitHub Release tagged with this version (e.g. v2026.09.29) once everything builds - leave empty to just build/test without publishing anything (the default, matches every dispatch before this input existed)'
        required: false
        type: string

concurrency:
  group: image-build
  cancel-in-progress: false

jobs:
  test-boot:
    name: "Tests: Boot, dm-verity, SELinux, UEFI, ISO, PXE, arm64"
    runs-on: [self-hosted, docker, janus]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A release's version and notes are checked again by publish, which
      # uses them - here so a typo fails in seconds, not after the tests.
      - name: Check the release version and its notes
        if: ${{ inputs.release_version != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$ ]] \
            || { echo "::error::release_version must look like vYYYY.MM.DD or vYYYY.MM.DD-N, got: $RELEASE_VERSION"; exit 1; }
          [ -s ".github/release-notes/$RELEASE_VERSION.md" ] \
            || { echo "::error::no release notes at .github/release-notes/$RELEASE_VERSION.md - write them (see .github/release-notes/README.md) and commit them first"; exit 1; }

      - uses: ./.github/actions/runner-setup

      # Phase 1: builds bzImage (kernel/Dockerfile's fetch -> config ->
      # build -> export stages) + the init-only initramfs (rootfs/init,
      # hack/build-initramfs.sh - no musl toolchain needed, a
      # CGO_ENABLED=0 Go binary has no libc to link against),
      # boots them under QEMU, checks for rootfs/init's success marker on
      # the console (hack/qemu-run.sh). Fast, no HAProxy involved - a
      # regression check on the boot chain itself.
      - name: Kernel boot test (Phase 1)
        run: make qemu-boot-test

      # The default kernel track's committed config is what kbuild
      # resolves it to, and hack/upstream's list of the files it builds
      # (the kernel CVEs whose fixes touch one apply) is the build's.
      - name: The default kernel track's config and list of built files are current
        run: ./kernel/check-track.sh "$(sed -n 's/^KERNEL_DEFAULT_TRACK *:= *//p' variants.mk)"

      # Phase 2: builds the static musl+OpenSSL haproxy binary (pkgs/
      # haproxy/Dockerfile) and janusd, packages init + janusd +
      # haproxy + the bootstrap config into a second initramfs (rootfs/
      # init detects janusd's presence and supervises it instead of
      # powering off), boots that under QEMU with virtio-net + DHCP, and
      # polls a forwarded host port until HAProxy - running *inside* the
      # VM - answers over real TCP/IP (hack/qemu-network-test.sh).
      - name: HAProxy network boot test (Phase 2)
        run: make qemu-network-test

      # Phase 4: kernel/CIS hardening pass - most of what a CIS
      # benchmark's kernel-adjacent controls call out (loadable-module
      # restrictions, /dev/mem, kexec, hibernation, USB/Firewire/
      # staging drivers) was already true by construction from
      # allnoconfig; kernel/configs/janus_<track>_defconfig's own new
      # KSPP-style self-protection block (STACKPROTECTOR_STRONG,
      # SLAB_FREELIST_RANDOM/_HARDENED, HARDENED_USERCOPY,
      # FORTIFY_SOURCE, INIT_ON_ALLOC/_FREE_DEFAULT_ON, CONFIG_SECURITY
      # + SECURITY_YAMA, SYN_COOKIES) is what was left. This step proves
      # the *runtime* half - rootfs/init/main.go's hardenSysctls, which
      # writes tunable values with no Kconfig home straight to
      # /proc/sys at boot, since there's no sysctl(8)/procps on this
      # rootfs at all - actually applies every sysctl it claims to on a
      # real boot, not just that the Go code runs without panicking: a
      # real gap was caught writing this (not assumed away) -
      # net.ipv4.tcp_syncookies doesn't exist as a /proc/sys node at
      # all without CONFIG_SYN_COOKIES, and a real boot's console log
      # showed exactly that one write failing ("no such file or
      # directory") while every other sysctl, and the boot itself,
      # looked completely fine either way, since a failed sysctl write
      # here is logged but non-fatal by design. hack/
      # qemu-hardening-test.sh checks each expected console line
      # individually against a hardcoded list, and separately fails on
      # any sysctl write that logged an error at all, expected or not.
      - name: Kernel hardening sysctls take effect on a real boot (Phase 4)
        run: make qemu-hardening-test

      # Phase 2 is now fully done (see docs/architecture.md): HAProxy
      # integration, mTLS + role enforcement, Map*/ACLUpdate/Certificate*
      # including crt-list binding, restart-on-crash, chroot/uid.

      # Phase 3, first slice: builds a squashfs image of the real rootfs
      # and its dm-verity hash tree (rootfs/assemble.sh), then proves
      # verification actually works both ways - accepts the real image
      # against its own root hash, and rejects a single-byte-tampered
      # copy of it.
      - name: Rootfs squashfs + dm-verity build test (Phase 3)
        run: |
          set -euo pipefail
          # veritysetup (cryptsetup-bin) installs to /usr/sbin, which this
          # runner's non-interactive shell doesn't have on PATH by default
          # (confirmed on haproxyos-runner01: run 35817622995 failed here
          # with "command not found" right after rootfs/assemble.sh's own
          # veritysetup call succeeded, because that script now extends its
          # own PATH but this step's direct calls below did not).
          export PATH="$PATH:/usr/sbin:/sbin"
          make rootfs-build
          roothash="$(cat build/rootfs/rootfs.roothash)"
          veritysetup verify build/rootfs/rootfs.squashfs build/rootfs/rootfs.verity "$roothash"

          # Own temp files: the runner's instances share /tmp. The byte is
          # flipped, not overwritten with a constant - the squashfs differs
          # every build (janusd's version is in it), and a constant that was
          # already there tampered nothing (run 36933469653).
          tampered="$(mktemp)" check="$(mktemp)"
          trap 'rm -f "$tampered" "$check"' EXIT
          cp build/rootfs/rootfs.squashfs "$tampered"
          b="$(od -An -tu1 -j 500000 -N 1 "$tampered" | tr -d ' ')"
          printf "\\x$(printf %02x $((b ^ 0xFF)))" | dd of="$tampered" bs=1 seek=500000 count=1 conv=notrunc status=none
          if cmp -s build/rootfs/rootfs.squashfs "$tampered"; then
            echo "the tampered copy is identical to the image" >&2
            exit 1
          fi
          if veritysetup verify "$tampered" build/rootfs/rootfs.verity "$roothash" 2>"$check"; then
            echo "expected a tampered image to fail verification, it passed" >&2
            exit 1
          fi
          grep -q "Verification failed" "$check" || { echo "expected a verification-failed message, got:" >&2; cat "$check" >&2; exit 1; }

      # Phase 3, second slice: boots the kernel directly from that
      # squashfs+dm-verity image via the "dm-mod.create=" cmdline
      # parameter (CONFIG_DM_INIT) - no initramfs, no userspace verity
      # setup. Also proves the *kernel itself* (not just `veritysetup
      # verify` on the build host, above) refuses to mount a tampered
      # copy of the image. See hack/qemu-verity-boot-test.sh.
      - name: Rootfs dm-verity kernel boot test (Phase 3 cont'd)
        run: make qemu-verity-boot-test

      # Phase 4 cont'd: proves the real, hand-written SELinux policy
      # (selinux/classes.conf + selinux/policy.conf, compiled by
      # checkpolicy and loaded at boot by rootfs/init's
      # loadSELinuxPolicy) mediates a full boot to a working HTTP 200
      # with zero AVC denials - both permissively (the shipped default)
      # and with a real enforcing=1 boot, the actual proof the rule set
      # is complete rather than merely quiet. See
      # hack/qemu-selinux-test.sh and selinux/policy.conf's own header
      # for the real gaps (missing self:fd use, missing
      # filesystem:associate, missing process transition perms, missing
      # peer/packet network rules) five rounds of real boots found.
      - name: SELinux policy mediates a real boot cleanly, permissive and enforcing (Phase 4 cont'd)
        run: make qemu-selinux-test

      # Phase 3 cont'd: proves rootfs/state-image.sh's persistent STATE
      # partition survives a reboot, not just that it mounts - three
      # boots against the SAME state.img: janusd's "first boot" log
      # line appears once, not twice (PKI persists), and a config
      # written directly onto the persisted haproxy/ subdirectory
      # between boots (standing in for a real ApplyConfig RPC) is what
      # HAProxy actually starts from afterward, not the squashfs's
      # read-only bootstrap default. See hack/qemu-state-persist-test.sh
      # and rootfs/init/main.go's mountState/mountEphemeral for what's
      # ephemeral (/run, /tmp) vs persistent (/etc/janus/pki and
      # /etc/haproxy, bind-mounted from the STATE partition).
      - name: Persistent STATE partition survives a reboot (Phase 3 cont'd)
        run: make qemu-state-persist-test

      # Phase 3 cont'd: assembles a single, real GPT-partitioned disk
      # image (image/disk/assemble.sh - BOOT-A-DATA/HASH,
      # BOOT-B-DATA/HASH, STATE, all on one disk) and proves both A/B
      # slots are independently bootable - the real, single-disk shape
      # a deployed node would actually have, not just the separate-
      # virtio-blk-drives test harness the steps above use (which keeps
      # working, and still covers what it always covered). Both slots
      # hold the same content for now - no LifecycleService.Upgrade yet
      # to install something different into the inactive one. See
      # hack/qemu-ab-boot-test.sh.
      # A third boot, back on slot A, proves rootfs/init/main.go's
      # resolveStateDevice (cmdline.go) actually finds STATE (partition
      # 6 - image/disk/assemble.sh now has an ESP as partition 1 too,
      # ahead of both A/B slots) on this real single-disk layout by
      # parsing its own /proc/cmdline - janusd's "first boot" log
      # line must not reappear, since boot 1 already bootstrapped a CA
      # there. See hack/qemu-ab-boot-test.sh's own comment for why the
      # disk isn't attached read-only for this test (dm-verity's own
      # "ro" flag already protects the root mapping regardless).
      - name: A/B disk image - both slots independently boot (Phase 3 cont'd)
        run: make qemu-ab-boot-test

      # Phase 3 cont'd: assembles a real Unified Kernel Image (`ukify` -
      # kernel + exact cmdline, one PE/COFF executable) and a FAT32 ESP
      # with it at \EFI\BOOT\BOOTX64.EFI, then boots it under *real*
      # OVMF UEFI firmware - no QEMU -kernel/-append shortcut at all.
      # Needed CONFIG_ACPI in the kernel for the first time (CONFIG_EFI
      # depends on it) plus CONFIG_EFI/CONFIG_EFI_STUB - the vanilla
      # kernel's own EFI stub only reads its cmdline from EFI
      # LoadOptions (an interactive shell invocation), not a `.cmdline`
      # PE section, so `ukify`'s stub (systemd-stub) is what actually
      # reads the embedded cmdline and chain-loads into the kernel's own
      # EFI stub via the handover protocol - confirmed by reading the
      # kernel's own stub source, not assumed. Uses a standalone
      # ESP + two separate squashfs/verity drives, not
      # image/disk/assemble.sh's merged disk - see the next step for
      # that. See hack/qemu-uefi-boot-test.sh.
      - name: UKI boots under real UEFI firmware (Phase 3 cont'd)
        run: make qemu-uefi-boot-test

      # Bare-metal Machine tranche (docs/companion-site-builder-scope.md):
      # image/iso/assemble.sh's hybrid ISO/GPT installer/maintenance-mode
      # medium, booted as a raw disk under real OVMF (the realistic
      # "dd'd to USB" case - see that script's own header for why a
      # real optical/El Torito boot isn't what's tested here). See
      # hack/qemu-iso-boot-test.sh.
      - name: Hybrid installer ISO boots under real UEFI firmware (Bare-metal tranche)
        run: make qemu-iso-boot-test

      # Bare-metal Machine tranche cont'd: proves the ISO's own embedded
      # release bundle (image/iso/assemble.sh's optional
      # [release-bundle-dir] arg) is real - a node booted from it can
      # call LifecycleService.Install using only /etc/janus/release,
      # no bundle reachable from the host at all. See
      # hack/qemu-iso-install-test.sh.
      - name: Installer ISO's embedded release bundle installs a real disk (Bare-metal tranche)
        run: make qemu-iso-install-test

      # Bare-metal Machine tranche cont'd: proves only the network-
      # delivery half of PXE/iPXE boot (a real iPXE DHCPs and fetches
      # the real Janus UKI via TFTP at the correct byte size) - see
      # image/pxe/README.md for the full story, including why a full
      # boot isn't asserted here.
      - name: iPXE DHCPs and fetches the real Janus UKI via TFTP (Bare-metal tranche)
        run: make qemu-pxe-fetch-test

      # Single Board Computer tranche's own Phase-1-equivalent boot-
      # proof (see docs/companion-site-builder-scope.md): a minimal
      # aarch64/BCM2711 kernel (kernel/configs/janus_rpi4_defconfig)
      # boots rootfs/init (GOARCH=arm64) as PID 1 under QEMU's raspi4b
      # machine - console-only verification (no PCIe/Ethernet emulation
      # in raspi4b at all), the same bar Talos itself uses for real
      # Raspberry Pi hardware. Real hardware (SD/MMC, USB, Ethernet,
      # UEFI firmware) is not yet covered.
      - name: Raspberry Pi 4 (aarch64/BCM2711) console boot (Single Board Computer tranche)
        run: make qemu-raspi4-boot-test

      - name: The arm64 kernel's config and list of built files are current
        run: |
          track="$(sed -n 's/^KERNEL_DEFAULT_TRACK *:= *//p' variants.mk)"
          cmp build/rpi4/built-files.txt "kernel/built-files-$track-arm64.txt" \
            || { echo "::error::kernel/built-files-$track-arm64.txt doesn't match this build - run make kernel-built-files-$track and commit"; exit 1; }
          symbols() { grep -E '^(CONFIG_[A-Za-z0-9_]+=|# CONFIG_[A-Za-z0-9_]+ is not set$)' "$1"; }
          diff <(symbols kernel/configs/janus_rpi4_defconfig) <(symbols build/rpi4/config) \
            || { echo "::error::kernel/configs/janus_rpi4_defconfig isn't what kbuild resolves it to - run make rpi4-kernel-config-refresh, review and commit"; exit 1; }

      # Single Board Computer tranche's own Phase-2-equivalent: the
      # same init+janusd+haproxy stack qemu-network-test proves on
      # amd64, now cross-built for arm64 (static janusd via GOARCH=arm64,
      # static haproxy via pkgs/haproxy/Dockerfile under
      # --platform=linux/arm64 - see the binfmt registration step
      # above) and boot-proved under QEMU raspi4b - console-verified
      # only, not the real HTTP check qemu-network-test does, since
      # raspi4b emulates neither PCIe nor BCM GENET Ethernet at all (see
      # hack/qemu-raspi4-daemon-test.sh's own header for the full
      # reasoning). Confirms janusd's own gRPC listener actually binds
      # (PKI bootstrap succeeds) and haproxy actually starts under its
      # supervision - CONFIG_NET/INET/UNIX/PACKET all needed adding to
      # kernel/configs/janus_rpi4_defconfig for this, entirely absent
      # from the Phase-1-equivalent boot-proof above (which never
      # touched a socket at all).
      - name: Raspberry Pi 4 (aarch64/BCM2711) janusd+haproxy boot (Single Board Computer tranche)
        run: make qemu-raspi4-daemon-test

      # Single Board Computer tranche Phase-3-equivalent: the same
      # aarch64 kernel/initramfs, booted instead under QEMU's generic
      # "virt" machine (real virtio-net-pci, no Pi-specific hardware at
      # all) - closes the real-HTTP-proof gap raspi4b can never close
      # (no PCIe/Ethernet emulation there at all). See
      # hack/qemu-arm64-network-test.sh's own header.
      - name: arm64 janusd+haproxy real HTTP over virtio-net (Single Board Computer tranche)
        run: make qemu-arm64-network-test

      # Single Board Computer tranche, UEFI/UKI: the full squashfs+dm-
      # verity+UEFI/UKI chain, proven on aarch64 too - a real arm64
      # Unified Kernel Image booted under real AAVMF/edk2-aarch64
      # firmware on QEMU's generic "virt" machine, no -kernel/-append
      # shortcut at all. See hack/qemu-arm64-uefi-boot-test.sh's own
      # header for the three arch-specific gaps this closed (no aarch64
      # sd-stub on an amd64 build host, BOOTAA64.EFI vs. BOOTX64.EFI,
      # ttyAMA0 vs. ttyS0 + no SELinux support in this kernel config
      # yet).
      - name: arm64 UEFI/UKI boot under real AAVMF firmware (Single Board Computer tranche)
        run: make qemu-arm64-uefi-boot-test

  test-lifecycle:
    name: "Tests: A/B slots, rollback, upgrades, install"
    runs-on: [self-hosted, docker, janus]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/runner-setup

      # Phase 3 cont'd: the ESP now lives on image/disk/assemble.sh's
      # single GPT disk too (partition 1, ahead of both A/B slots) - the
      # real, complete, single-disk shape a deployed node would have.
      # Proves the whole thing end to end under real OVMF firmware (one
      # virtio-blk drive, no -kernel/-append), AND that
      # image/disk/activate-slot.sh's in-place ESP swap - rewriting only
      # the ESP to point at the other slot, leaving BOOT-A/BOOT-B/STATE
      # untouched - actually works: boot slot A (fresh CA onto STATE),
      # switch to slot B in place, boot again, confirm slot B is live
      # *and* STATE (the CA) survived the switch. This is the
      # build/install-time half of what the next step proves works at
      # runtime too. See hack/qemu-uefi-ab-boot-test.sh.
      - name: Single-disk UEFI A/B - slot switch survives with STATE intact (Phase 3 cont'd)
        run: make qemu-uefi-ab-boot-test

      # Phase 3 cont'd: LifecycleService.Rollback (internal/api/
      # lifecycle.go) is real - the gRPC front end for the same ESP
      # swap the step above drives directly, except this runs it on an
      # already-booted node with a real mTLS call, and the node - which
      # has no package manager, so it can never shell out to `ukify` the
      # way image/disk/activate-slot.sh does - just mounts the ESP
      # (CONFIG_VFAT_FS) and copies the other slot's pre-staged UKI
      # (\JANUS\UKI-A.EFI / UKI-B.EFI, staged there by
      # activate-slot.sh precisely so this doesn't need to build
      # anything at runtime) over \EFI\BOOT\BOOTX64.EFI, then reboots
      # for real. This test boots without -no-reboot, unlike every
      # other boot test here, specifically so the guest can actually
      # reboot itself inside the same QEMU process - and checks the
      # boot marker appears exactly twice, the cmdline on the second
      # boot references slot B's partitions, and PKI's "first boot" line
      # appears exactly once (STATE survived a real, API-driven reboot).
      # mTLS credentials for the test's own janusctl call are
      # extracted straight from disk.img's STATE partition via debugfs
      # (not the console - janusd does print all three, CA cert
      # included, once on first boot, but a script can't watch a live
      # console the way a real operator would - see
      # cmd/janusd/main.go). See hack/qemu-lifecycle-rollback-test.sh.
      - name: LifecycleService.Rollback reboots into the other slot for real (Phase 3 cont'd)
        run: make qemu-lifecycle-rollback-test

      # Phase 3 cont'd: LifecycleService.Upgrade (internal/api/
      # lifecycle.go) is real - installs a *genuinely new* rootfs onto
      # the inactive slot from a local "release bundle" directory
      # (image/release/assemble.sh: rootfs.squashfs/rootfs.verity/
      # uki-a.efi/uki-b.efi - the UKI has to be pre-built, same reason
      # Rollback's ESP swap only ever copies a pre-staged UKI, never
      # builds one: no package manager on the node, so `ukify` can
      # never run there). The test builds a second rootfs with
      # different content (different squashfs, different root hash),
      # injects its release bundle into disk.img's STATE partition via
      # debugfs *before* the first boot (janusctl and janusd
      # don't share a filesystem across this QEMU host/guest boundary,
      # unlike CLAUDE.md's normal "share a filesystem" case - and
      # writing to STATE from the host while the guest also has it
      # mounted read-write would corrupt it), then drives a real gRPC
      # Upgrade call that writes the new squashfs/verity to slot B,
      # switches the ESP, and reboots. A real bug was found writing
      # this test - not in Upgrade itself, but in the test's own first
      # assumption that a different bootstrap HAProxy config (bound to
      # a different port) would prove v2 was running: Janus's STATE
      # partition is one partition shared by both A/B slots, and
      # rootfs/init/main.go's seedPersistentHaproxyCfg deliberately
      # never overwrites an already-persisted config, so slot B keeps
      # serving whatever slot A already persisted there - correct,
      # intended behavior (an upgrade must never reset a node's
      # live-applied config). The test now proves genuinely new content
      # took effect the same way hack/qemu-uefi-ab-boot-test.sh proves a
      # slot switch did: by reading the kernel's own "Kernel command
      # line:" log line back and checking it references the new slot's
      # partitions and root hash, not by which HTTP port answers. A
      # bonus check calls Rollback afterward and confirms slot A's own
      # pre-existing staged UKI is still intact. See
      # hack/qemu-lifecycle-upgrade-test.sh.
      - name: LifecycleService.Upgrade installs a genuinely new rootfs for real (Phase 3 cont'd)
        run: make qemu-lifecycle-upgrade-test

      # Node-initiated-fetch follow-up: the same proof, but
      # Source.Reference is a real http:// URL instead of a local path -
      # proves Upgrade's new fetchBundleFile URL branch works over a
      # real network fetch (a host-side python3 http.server), one half
      # of the real remote-update design (the node fetches directly;
      # the other half, a controller-relayed push for nodes that can't
      # dial out, is right below). See
      # hack/qemu-lifecycle-upgrade-url-test.sh.
      - name: LifecycleService.Upgrade fetches a release bundle over real HTTP
        run: make qemu-lifecycle-upgrade-url-test

      # Same, over https:// against the newest real GitHub Release,
      # verified against the node's own bundled CA trust store - the
      # plain-http test above never exercised TLS verification at all,
      # which is how a hidden CA bundle shipped in v2026.09.29. See
      # hack/qemu-lifecycle-upgrade-https-test.sh.
      - name: LifecycleService.Upgrade fetches a real GitHub Release over HTTPS
        run: make qemu-lifecycle-upgrade-https-test

      # Controller-relay follow-up: the other half - a real
      # LifecycleService.UploadReleaseFile call streams the release
      # bundle to a live node over the same mTLS connection every other
      # RPC already uses, then a real Upgrade call installs it - proves
      # a node with zero outbound connectivity can still be updated.
      # See hack/qemu-lifecycle-upgrade-relay-test.sh.
      - name: LifecycleService.UploadReleaseFile relays a release bundle to a live node
        run: make qemu-lifecycle-upgrade-relay-test

      # Phase 3 cont'd: wait_for_health is real, confirmed against
      # HAProxy's own stats socket, not just janusd process
      # survival. A pending "boot pending confirmation" marker
      # (internal/bootcommit), written to STATE right before the ESP
      # switch, is what the *next* boot's cmd/janusd checks at
      # startup: in the background, it polls HAProxy's own stats socket
      # (internal/haproxy.Manager.ShowInfo) until it succeeds several
      # times in a row, then clears the marker itself
      # (internal/bootcommit.Confirm) - real, application-level health.
      # If that never happens within health_timeout_seconds, janusd
      # reverts and reboots itself directly, no RPC involved. A first
      # version of this piggybacked on Supervisor's own proactive
      # stability tracking (an OnStable hook, "the janusd *process*
      # stayed up a while") - removed once this real check landed, since
      # the two would have raced (the weaker, earlier signal could clear
      # the marker before the real health check ever got a verdict).
      # rootfs/init's Supervisor.GiveUpAfter/OnGiveUp - the *one*
      # documented exception to that package's otherwise-unconditional
      # "restart forever" policy, active only when a marker is pending -
      # stays as a *complementary* backstop for the one thing
      # janusd's own check structurally can't catch: janusd
      # crashing too fast, or too often, to ever run that check at all.
      # Both revert paths share one internal/bootrevert.To helper, built
      # on internal/espswitch (factored out of Rollback's own inline
      # ESP-swap logic once rootfs/init's local revert became a second
      # real consumer of the identical mechanism).
      # hack/qemu-lifecycle-upgrade-health-test.sh proves all three
      # outcomes against the same running node: a "good" upgrade (the
      # existing v1 rootfs, repackaged) must show janusd's own
      # "confirmed healthy" and never revert; a "broken" one (a fresh
      # rootfs with the host's own dynamically-linked /bin/false
      # standing in for janusd itself - no dynamic linker/libc in
      # this rootfs at all, so every restart attempt fails at spawn()
      # itself) must reboot into it, then autonomously give up via
      # Supervisor's own backstop and revert; and a third
      # "haproxy-broken" one (real janusd, but /bin/false standing
      # in for *haproxy* this time) must show janusd itself starting
      # fine and beginning its own confirmation attempt, then
      # autonomously reverting via its own real health check - proving
      # the two mechanisms are genuinely independent, not just one
      # dressed up as two. All three reverts land back on whichever slot
      # was actually active when that particular Upgrade was called -
      # not a hardcoded fallback.
      - name: LifecycleService.Upgrade's wait_for_health confirms or reverts automatically (Phase 3 cont'd)
        run: make qemu-lifecycle-upgrade-health-test

  test-api:
    name: "Tests: API, HAProxy, Controller, self-registration"
    runs-on: [self-hosted, docker, janus]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/runner-setup

      # Host-level check of the gRPC API surface itself (ApplyConfig/
      # ShowInfo/...) - faster than going through QEMU for this, and
      # exercises paths (ApplyConfig's seamless reload) the network boot
      # test doesn't touch. The two steps below run janusd and HAProxy
      # straight from bin/ and build/: built here, since no make target
      # in this job does it before them.
      - name: Build control-plane binaries
        run: make build haproxy-build haproxy-builds

      # The docs' haproxy.cfg examples (examples/haproxy), checked by the
      # node's own HAProxy just built, every branch - the configurations
      # the docs show and Terraform applies must be ones each accepts.
      - name: The docs' HAProxy examples
        run: |
          set -euo pipefail
          for b in $(sed -n 's/^HAPROXY_BRANCHES *:= *//p' variants.mk); do
            make examples-test HAPROXY_BRANCH="$b"
          done
          make haproxy-build

      - name: HAProxy gRPC API integration test (mTLS)
        run: |
          set -euo pipefail
          # janusd's own default paths (-haproxy-config/-pid/-stats-socket/
          # -pki-dir) ARE the real target layout - use them as-is rather than
          # workspace-relative paths, since haproxy.cfg's "stats socket" line
          # (rootfs/base/etc/haproxy/haproxy.cfg) hardcodes
          # /run/janus/haproxy-admin.sock and must match whatever
          # janusd is told to look for.
          #
          # /etc/janus/pki specifically gets wiped first, not just
          # mkdir -p'd: haproxyos-runner01 is a persistent self-hosted
          # runner, so a previous run's already-bootstrapped PKI
          # survives on disk between workflow runs (unlike a GitHub-
          # hosted ephemeral runner) - LoadOrBootstrap only regenerates
          # when the dir is empty, so stale material here silently gets
          # reused instead of this step's own "first boot" actually
          # happening. Caught for real switching internal/pki from
          # Ed25519 to ECDSA: an old Ed25519 CA left over from a prior
          # run failed to load under the new code with "CA key is not
          # ECDSA", not a missing-cleanup problem visible until the key
          # algorithm itself changed.
          sudo rm -rf /etc/janus/pki /etc/haproxy/runtime-certs
          sudo mkdir -p /run/janus /etc/haproxy /etc/janus
          sudo cp rootfs/base/etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg
          # chroot /var/empty is in that config now - the chroot() syscall
          # needs real root (CAP_SYS_CHROOT), so janusd (and therefore
          # haproxy, its child) runs under sudo here, matching how PID 1
          # (rootfs/init, itself root) actually starts it on the real
          # target OS. janusctl needs sudo too, purely to read the
          # root-owned PKI files janusd bootstraps.
          sudo mkdir -p /var/empty && sudo chmod 000 /var/empty

          sudo ./bin/janusd -addr :19505 -haproxy-binary "$PWD/build/haproxy" \
            & echo $! > /tmp/janusd.pid
          trap 'sudo kill "$(cat /tmp/janusd.pid)" 2>/dev/null || true; sudo pkill -f "$PWD/build/haproxy" 2>/dev/null || true' EXIT

          sleep 2
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)"
          if [ "$code" != "200" ]; then
            echo "expected HTTP 200 from the bootstrap health frontend, got $code" >&2
            exit 1
          fi

          # First boot generated a CA + admin client certificate at
          # /etc/janus/pki (see internal/pki) - janusctl's own
          # defaults already point there, matching a real node where ctl
          # and daemon share a filesystem.
          sudo ./bin/janusctl -endpoint 127.0.0.1:19505 haproxy show-info

          # Exercise GenerateClientConfiguration for real: issue a second
          # client certificate over the mTLS-authenticated connection and
          # confirm it authenticates on its own.
          sudo ./bin/janusctl -endpoint 127.0.0.1:19505 pki generate-client-config /tmp/ci-client
          sudo ./bin/janusctl -endpoint 127.0.0.1:19505 \
            -ca /tmp/ci-client/ca.crt -cert /tmp/ci-client/client.crt -key /tmp/ci-client/client.key \
            version

          # Role enforcement (internal/api/authz.go): an os:reader cert
          # must be able to call a read-only RPC and must be rejected
          # (PermissionDenied) on a mutating one - including trying to
          # self-escalate via GenerateClientConfiguration.
          sudo ./bin/janusctl -endpoint 127.0.0.1:19505 pki generate-client-config -role os:reader /tmp/ci-reader
          reader_flags=(-ca /tmp/ci-reader/ca.crt -cert /tmp/ci-reader/client.crt -key /tmp/ci-reader/client.key)
          sudo ./bin/janusctl -endpoint 127.0.0.1:19505 "${reader_flags[@]}" haproxy show-info

          if sudo ./bin/janusctl -endpoint 127.0.0.1:19505 "${reader_flags[@]}" haproxy apply-config rootfs/base/etc/haproxy/haproxy.cfg 2>/tmp/reader-denied.log; then
            echo "expected os:reader to be denied ApplyConfig, it succeeded" >&2
            exit 1
          fi
          grep -q PermissionDenied /tmp/reader-denied.log || { echo "expected a PermissionDenied error, got:" >&2; cat /tmp/reader-denied.log >&2; exit 1; }

      # internal/haproxy/runtime_maps.go and runtime_certs.go against a
      # real HAProxy of every branch an image can carry (variants.mk):
      # file-backed map/ACL entries, certificates uploaded and bound
      # through a crt-list with SNI, put back after a reload, show
      # info/stat parsed - hack/haproxy-runtime-test.sh, one branch after
      # the other (the real /run/janus paths and ports 8080/8443).
      - name: HAProxy runtime map/ACL/certificate test, every branch
        run: |
          set -euo pipefail
          for b in $(sed -n 's/^HAPROXY_BRANCHES *:= *//p' variants.mk); do
            ./hack/haproxy-runtime-test.sh bin/janusd bin/janusctl "build/haproxy-$b/haproxy"
          done

      # Dashboard prep, tranche 1: proves Memory/CPUInfo/LoadAvg/DiskStats
      # and Version's new active_slot/kernel_version/go_version fields
      # return real, sane values from a real boot (not a mock) - the
      # exact set of RPCs the planned management dashboard's single-node
      # view will call. See internal/api/system_stats.go and
      # hack/qemu-system-info-test.sh.
      - name: SystemService stats RPCs return real values from a real boot (dashboard prep)
        run: make qemu-system-info-test

      # Dashboard prep, tranche 2: proves dashboardd (dashboard/backend)
      # works end to end against a real running node, not a mock - the
      # whole add-node/list/per-node-mTLS-relay/delete/restart-
      # persistence flow. The add-node step genuinely calls
      # GenerateClientConfiguration against the real node with a
      # provided one-time bootstrap credential and gets back a working,
      # freshly-issued service credential; the per-node HTTPS listener's
      # mTLS gate is proven to actually reject both no client cert and a
      # cert from an unrelated CA, not just accept the right one. See
      # dashboard/backend and hack/qemu-dashboard-test.sh.
      - name: Dashboard backend add/list/relay/mTLS-gate/delete/restart against a real node (dashboard prep)
        run: make qemu-dashboard-test

      # SystemService.PacketCapture on a real enforcing node, plus the
      # janusd console banner. See hack/qemu-packet-capture-test.sh.
      - name: SystemService.PacketCapture captures real traffic
        run: make qemu-packet-capture-test

      # The node's own Prometheus exporter on a real enforcing node: real
      # values, moved through the API, persisted across a reboot. See
      # hack/qemu-metrics-test.sh and docs/metrics.md.
      - name: The Janus exporter serves the node's own metrics
        run: make qemu-metrics-test

      # Every other SystemService/HAProxyService/NetworkService method on
      # a real enforcing node, ending with janusd restart, reboot, reset
      # and shutdown. See hack/qemu-system-api-test.sh.
      - name: SystemService observability, files, services and machine control
        run: make qemu-system-api-test

      # The kernel parameters on a real enforcing node: the CIS benchmark
      # at boot, every whitelisted parameter's bounds on trial, reverts,
      # cancels, confirmations kept across a reboot, refusals, a tampered
      # saved file refused at boot. See hack/qemu-sysctl-test.sh.
      - name: Kernel parameters - CIS baseline, trials, refusals
        run: make qemu-sysctl-test

      # A node's fleet trust: its own CA always, a fleet's certificates by
      # the bundle its root signed, roles and the Controller's users. See
      # hack/qemu-fleet-trust-test.sh.
      - name: AccessService fleet trust, roles and the Controller's users
        run: make qemu-fleet-trust-test

      # A fleet without a Controller (janusctl fleet): two nodes
      # provisioned with it (NoCloud, seed), adopted on their consoles'
      # fingerprints, machines added, revoked, recovered from the kit.
      # See hack/qemu-fleetctl-test.sh.
      - name: A fleet without a Controller (janusctl fleet)
        run: make qemu-fleetctl-test

      # Point 2 suite, tranche 5: proves a node provisioned with a
      # Controller at Install time (controller_address/
      # controller_ca_cert, tranche 4) genuinely self-registers with a
      # real, running dashboardd on its own first boot - no RPC call
      # from the test drives the registration itself, only cmd/janusd's
      # own background selfRegisterIfConfigured. See hack/
      # qemu-self-register-test.sh's own header comment for the full
      # flow and the two real bugs (a missing janusd_t SELinux
      # udp_socket rule, and a dashboard TLS identity SAN gap under
      # Docker bridge networking) this test itself found.
      - name: janusd self-registers with a Controller on first boot (Point 2 suite tranche 5)
        run: make qemu-self-register-test

      # The same with the Controller's fleet set up: the node announces
      # itself with no key, polls until approved, and takes the fleet's
      # trust (protocol 2) - the test above proves the fallback.
      - name: janusd self-registers with no key, then trusts the Controller's fleet
        run: make qemu-self-register-fleet-test

      # The same, installed with an enrollment token: admitted at once,
      # labelled, no approval (internal/enroll).
      - name: janusd enrolls on a token, labelled, without approval
        run: make qemu-self-register-enroll-test

      # Phase 3 cont'd: LifecycleService.Install is real - unlike
      # Rollback/Upgrade, it has no existing partition table to build
      # on, so it can't get away with only ever moving pre-built bytes
      # into place: it lays out the *entire* disk itself (GPT + a real
      # ext4 STATE filesystem + a real FAT32 ESP with both slots' UKIs
      # written into it), in pure Go, via github.com/diskfs/go-diskfs -
      # sgdisk/mtools/mkfs.ext4 don't exist on the target OS any more
      # than they do at runtime for Rollback/Upgrade. Confirmed
      # empirically before writing any production code: a full disk
      # built this way, with real bundle content, booted successfully
      # under real OVMF on the first try after one real fix
      # verification caught - gpt.Table.ProtectiveMBR defaults to
      # false, and leaving it unset produces a disk sgdisk itself
      # reports as having a "corrupt" (in practice: entirely absent)
      # protective MBR. internal/diskimage.Compute is the pure-
      # arithmetic layout half (unit tested on its own, no disk or root
      # needed); internal/api/install.go is the actual go-diskfs calls.
      # Both A/B slots get identical content on purpose (there's no
      # "other slot" to leave untouched yet - the same starting point
      # image/disk/assemble.sh itself produces at build time), and
      # Install never builds a UKI either, just picks both slots' pre-
      # built ones from the same kind of release bundle Upgrade already
      # reads from. Refuses a disk that already looks like a Janus
      # install, and the disk this node is itself currently booted from
      # (Upgrade's territory, and repartitioning it live would be
      # catastrophic) - never reboots anything on success, since the
      # disk it wrote isn't necessarily the one this node runs from.
      # hack/lifecycle-install-test.sh is the one lifecycle test here
      # where the RPC call itself doesn't run inside a VM - janusd
      # runs natively on the runner (same pattern the "HAProxy gRPC API
      # integration test" step above already uses), since Install has no
      # A/B/STATE machinery of its own to need a VM for; only the
      # *result* is booted under real OVMF to confirm it's genuinely
      # bootable, plus a refusal check from *inside* that running
      # instance (against /dev/vda, the disk it's actually booted from -
      # the one refusal the native process has no real cmdline to test
      # against at all) and a bonus Rollback proving slot B's identical
      # copy is valid too.
      - name: LifecycleService.Install partitions a blank disk from scratch for real (Phase 3 cont'd)
        run: make lifecycle-install-test

      # The custom orchestrator example (examples/orchestrator, docs/
      # private-cloud/own-orchestrator.md) as the docs show it: three
      # nodes driven with openssl, jq, grpcurl and a Python registration
      # endpoint - no Controller, no janusctl.
      - name: A custom orchestrator drives nodes through their contracts alone
        run: make qemu-orchestrator-test

  test-network:
    name: "Tests: Network config, extensions, firewall, VRRP, BGP"
    runs-on: [self-hosted, docker, janus]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/runner-setup

      # The node's network configuration on a real enforcing node: an
      # offline-seeded config (MAC rename, static address, 802.1Q VLAN),
      # NTP over that VLAN setting a 2020 clock, trials confirmed and
      # reverted, persistence across a reboot. See
      # hack/qemu-network-config-test.sh.
      - name: Network configuration, VLAN, NTP and trial/revert
        run: make qemu-network-config-test

      # Optional extensions (node_exporter, the QEMU guest agent) built
      # into an image from a schematic: the schematic in the signed
      # cmdline, the services under janusd and SELinux enforcing, Upgrade
      # keeping the schematic, a clean power-off from the hypervisor. See
      # hack/qemu-extensions-test.sh. It leaves build/rootfs built with
      # extensions, so the next step puts the default image back.
      - name: Optional extensions and image schematics
        run: make qemu-extensions-test

      # The firewall (nftables extension) on a real enforcing node: a
      # ruleset checked, applied on trial and confirmed over a new
      # connection, filtering for real; a lockout reverted by itself; sets
      # edited live and kept across a reboot. See hack/qemu-firewall-test.sh.
      - name: Firewall - nftables ruleset on trial, live sets
        run: make qemu-firewall-test

      # VRRP (keepalived extension) with two real enforcing nodes on a
      # shared LAN: master/backup, failover when HAProxy stops answering and
      # when a node goes away, failback. See hack/qemu-vrrp-test.sh.
      - name: VRRP - keepalived failover between two nodes
        run: make qemu-vrrp-test

      # BGP (bird extension) between two real enforcing nodes: sessions
      # with TCP MD5 and BFD next to OSPF, routes into the kernel, the
      # anycast route withdrawn while HAProxy doesn't answer. See
      # hack/qemu-bgp-test.sh.
      - name: BGP - bird sessions and the HAProxy gate between two nodes
        run: make qemu-bgp-test

  test-services:
    name: "Tests: Let's Encrypt, Consul"
    runs-on: [self-hosted, docker, janus]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/runner-setup

      # Let's Encrypt (letsencrypt extension) against Pebble, the ACME test
      # CA, on a real enforcing node: stand-ins until obtained, HTTP-01
      # answered by HAProxy, a wildcard over DNS-01, a renewal swapped in
      # without a reload, kept across a reboot. See hack/qemu-acme-test.sh.
      - name: Let's Encrypt - ACME certificates from Pebble
        run: make qemu-acme-test

      # The Consul agent (consul extension) on two real enforcing nodes: a
      # server and a client with gossip encryption and TLS from the files
      # given with their configuration, HAProxy finding a service through
      # Consul's DNS, the node ID kept across a reboot. See
      # hack/qemu-consul-test.sh.
      - name: Consul - a server, a client, HAProxy service discovery
        run: make qemu-consul-test

  # Images built with each HAProxy branch and kernel track other than the
  # defaults (variants.mk): the HAProxy runtime API is tested against
  # every branch in test-api; here, a real enforcing boot of each, HAProxy
  # serving, Version reporting what the image really runs - and for each
  # other kernel track, what the default one goes through in test-boot
  # and test-api: its config and built files current, the boot chain,
  # the hardening sysctls, the firewall (nf_tables), an A/B update to
  # and from it.
  test-variants:
    name: "Tests: HAProxy branches, kernel tracks"
    runs-on: [self-hosted, docker, janus]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/runner-setup

      - name: HAProxy 3.2 - SELinux enforcing, Version
        run: make qemu-selinux-test qemu-system-info-test SCHEMATIC=hack/testdata/schematic-haproxy-3.2.json

      - name: HAProxy 3.0 - SELinux enforcing, Version
        run: make qemu-selinux-test qemu-system-info-test SCHEMATIC=hack/testdata/schematic-haproxy-3.0.json

      - name: The other kernel tracks - config, boot chain, hardening, SELinux, Version, firewall
        run: |
          set -euo pipefail
          default="$(sed -n 's/^KERNEL_DEFAULT_TRACK *:= *//p' variants.mk)"
          for t in $(sed -n 's/^KERNEL_TRACKS *:= *//p' variants.mk); do
            [ "$t" = "$default" ] && continue
            echo "::group::kernel track $t"
            make qemu-boot-test KERNEL_TRACK="$t"
            ./kernel/check-track.sh "$t"
            make qemu-hardening-test qemu-network-test KERNEL_TRACK="$t"
            printf '{"customization":{"kernel":"%s"}}' "$t" > "build/schematic-kernel-$t.json"
            make qemu-selinux-test qemu-system-info-test SCHEMATIC="build/schematic-kernel-$t.json"
            printf '{"customization":{"extensions":["nftables"],"kernel":"%s"}}' "$t" > "build/schematic-firewall-$t.json"
            make qemu-firewall-test SCHEMATIC="build/schematic-firewall-$t.json"
            echo "::endgroup::"
          done

      # An A/B update from the default kernel track to the other one and
      # back - a schematic change, so only with allow_schematic_change -
      # with the automatic revert on.
      - name: Updating a node to another kernel track and back
        run: make qemu-lifecycle-upgrade-variant-test

      # The previous release's published image, updated to this tree's
      # default image and rolled back: the update that moves the nodes
      # taking the defaults when a release changes a default variant,
      # their STATE (PKI, configuration) kept.
      - name: Updating a node of the previous release to the defaults, and back
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make qemu-lifecycle-upgrade-from-release-test

  test-hardware:
    name: "Tests: Secure Boot, bare metal, Controller self-update, hypervisors and Terraform"
    runs-on: [self-hosted, docker, janus]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/runner-setup

      # Phase 3 cont'd: Secure Boot signing/enforcement is real, proven
      # both directions - a UKI signed with a throwaway test key
      # (image/secureboot/gen-test-key.sh, generated fresh every run,
      # never committed - a real project release key needs real key
      # management, out of scope here) boots under genuinely
      # Secure-Boot-enabled UEFI firmware with that key enrolled
      # (image/secureboot/enroll-vars.sh), and an unsigned UKI on the
      # exact same enrolled vars is refused by firmware itself ("Access
      # Denied"), never even reaching the kernel. `enroll-vars.sh`'s own
      # comment explains a real bug caught along the way: `virt-fw-vars
      # --enroll-cert` (the obvious "just enroll my cert" shortcut)
      # only populates PK/KEK, never db - the one list that actually
      # authorizes *boot images* - so a correctly signed UKI still got
      # "Access Denied" until switched to explicit --set-pk/--add-kek/
      # --add-db (same cert, all three). This test also needs the
      # secboot-capable OVMF binary (OVMF_CODE_4M.secboot.fd) plus
      # `-machine q35,smm=on` specifically - the plain i440fx machine
      # type every other boot test here uses produces zero console
      # output at all with that firmware binary (found by an identical
      # command, only the machine type changed, going from a total
      # hang to a normal boot). See hack/qemu-secureboot-test.sh.
      - name: Secure Boot enforcement, both directions (Phase 3 cont'd)
        run: make qemu-secureboot-test

      # Bare metal: the images on NVMe/SATA/USB/virtio-scsi disks and
      # e1000e/igb/vmxnet3/e1000 NICs with 4 CPUs, a cloud-init CD-ROM, and
      # the ISO on a USB stick installing a disk that registers with a
      # Controller - enforcing. See hack/qemu-baremetal-test.sh.
      - name: Bare metal - real disks, NICs, CPUs and the ISO's install
        run: make qemu-baremetal-test

      # The Controller updating itself (janus-controller-updater), with
      # real Docker Compose set up the way dashboard/README.md documents
      # it - before anything is published.
      - name: Controller self-update test (Docker Compose)
        run: make controller-self-update-test

      # The Controller creating its own node on a libvirt/KVM host (a
      # privileged container with libvirtd and sshd), admitting it on its
      # registration token, its console and a reset, refusing domains it
      # didn't create, and destroying it. See
      # hack/controller-libvirt-test.sh and docs/hypervisors.md.
      - name: Controller creates, admits and destroys a node on libvirt
        run: make controller-libvirt-test

      # The Terraform provider driven by OpenTofu (pinned, checked) against
      # the same libvirt host and a real Controller: hypervisor, node,
      # in-place memory and address changes, replacement, import, destroy.
      # See hack/terraform-provider-test.sh and docs/terraform.md.
      - name: Terraform provider against a real Controller and libvirt host
        run: make terraform-provider-test

  # The docs' screenshots of the Controller (make docs-screenshots-check):
  # taken again against a real Controller and real nodes, compared with
  # the committed ones. Never in the way of a release - publish doesn't
  # need it, and a failure leaves the run green: a page that changed only
  # says its screenshots are due, the new images and a map of what
  # changed left as an artifact.
  docs-screenshots:
    name: "Docs: the Controller's screenshots"
    runs-on: [self-hosted, docker, janus]
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-setup
      - name: The screenshots, taken again and compared
        id: check
        run: make docs-screenshots-check
      - name: Keep what drifted
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-screenshots-drift-${{ github.sha }}
          path: build/screenshots-drift/
          retention-days: 14
      - name: Say so
        if: failure() && steps.check.outcome == 'failure'
        run: echo "::warning::The docs' screenshots differ from the committed ones - make docs-screenshots, look at them, commit them (the artifact docs-screenshots-drift-${{ github.sha }} shows what changed)"

  publish:
    name: Images and release
    needs: [test-boot, test-lifecycle, test-api, test-network, test-services, test-variants, test-hardware]
    # Only on runners labeled janus-publish: what this job builds is
    # published (and its release bundle signed) - never from a machine
    # that isn't trusted to build bit-exact (docs/ci-runners.md).
    runs-on: [self-hosted, docker, janus, janus-publish]
    # contents: write is only for the optional "Publish a real GitHub
    # Release" step at the very end (gated on release_version being
    # set); actions: write for dispatching site-deploy after it.
    permissions:
      contents: write
      actions: write
    steps:
      # Full history, not the default depth-1 clone: the Makefile's
      # VERSION comes from `git describe --tags`, which can only find a
      # release tag reachable through history - a shallow clone made every
      # published build report a bare commit SHA instead of its release
      # version, so the dashboard's "Latest release" check never matched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A run cutting a release only creates its tag in the final step,
      # after every binary is built - git describe alone would stamp them
      # with the *previous* release plus a -N-g<sha> suffix. Pin VERSION
      # (the Makefile's own `VERSION ?=`) to the release being cut instead.
      - name: Pin VERSION to the release being cut
        if: ${{ inputs.release_version != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$ ]]; then
            echo "release_version must look like vYYYY.MM.DD or vYYYY.MM.DD-N, got: $RELEASE_VERSION" >&2
            exit 1
          fi
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          # Every release gets hand-written notes, structured by theme -
          # checked here, before an hour of building, not at publish time.
          notes=".github/release-notes/$RELEASE_VERSION.md"
          if ! [ -s "$notes" ]; then
            echo "::error::no release notes at $notes - write them (see .github/release-notes/README.md) and commit them before cutting $RELEASE_VERSION" >&2
            exit 1
          fi

      - uses: ./.github/actions/runner-setup

      - name: Build inputs for custom schematics
        run: make schematic-inputs

      # What this release fixes since the previous one (hack/upstream,
      # docs/upstreams.md): security.json, attached to the release - the
      # Controller reads it to tell nodes missing security fixes - with
      # the SBOM. The extensions just built are compared with the previous
      # release's: a Go binary rebuilt with a newer Go fixes things with
      # no version change. Notes without a 🔒 section are refused when it
      # isn't empty: checked here, before the images are built.
      - name: Security fixes since the previous release, and the SBOM
        if: ${{ inputs.release_version != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 --match 'v20*')
          mkdir -p build/security
          go run ./hack/upstream security-notes -from "$prev" -version "$RELEASE_VERSION" \
            -extensions build/inputs -json build/security/security.json > build/security/notes.md
          cat build/security/notes.md >> "$GITHUB_STEP_SUMMARY"
          severity=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["max_severity"])' build/security/security.json)
          if [ "$severity" != none ] && ! grep -q '^## 🔒' ".github/release-notes/$RELEASE_VERSION.md"; then
            echo "::error::$RELEASE_VERSION fixes vulnerabilities since $prev (up to $severity) but its notes have no '## 🔒' section - draft it with: make upstream-security-notes FROM=$prev RELEASE=$RELEASE_VERSION"
            exit 1
          fi
          # A fix to a HAProxy branch or kernel track concerns only the
          # nodes on it: the notes must say which - the new version of
          # each fixed variant ("HAProxy 3.2.26", "Linux 7.2.10") is in
          # the 🔒 section.
          python3 - build/security/security.json ".github/release-notes/$RELEASE_VERSION.md" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          notes = open(sys.argv[2]).read()
          section = notes[notes.find("## 🔒"):] if "## 🔒" in notes else ""
          missing = [f'{u["title"]} {u["to"]}' for u in doc.get("updates") or []
                     if u.get("component") and u.get("fixes") and u["to"] not in section]
          if missing:
              print("::error::the notes' 🔒 section doesn't say which nodes these fixes concern - name their versions: " + ", ".join(missing))
              sys.exit(1)
          PY
          echo "SECURITY_SEVERITY=$severity" >> "$GITHUB_ENV"
          go run ./hack/upstream sbom -version "$RELEASE_VERSION" -out build/security/sbom.cdx.json

      # What custom schematics are built from (image/schematic/build.sh,
      # .github/workflows/schematic-build.yml): per architecture, the
      # kernel, the base rootfs tree and the extension packs, plus the
      # catalog - published with a release, kept as an artifact otherwise
      # (schematic-build's source_run input builds from it, for testing).

      - name: Upload the schematic build inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schematic-inputs
          path: build/inputs/
          retention-days: 14

      # janusctl as Debian packages (amd64, arm64 - hack/janusctl-deb.sh):
      # attached to a release and published on apt.sw-servers.net by the
      # last step. Checked here (metadata, byte-identical rebuild, install
      # in Debian/Ubuntu containers) on every run.
      - name: Build and check janusctl's Debian packages
        run: |
          rm -rf build/deb
          make janusctl-deb-test

      - name: Upload janusctl's Debian packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: janusctl-deb-${{ github.sha }}
          path: build/deb/janusctl_*.deb
          retention-days: 30

      # The Terraform provider's archives (linux/darwin, amd64/arm64 -
      # hack/terraform-provider-dist.sh) and their SHA256SUMS: attached
      # to a release (docs/terraform.md: the provider binary). Checked
      # here (checksums, contents, platforms, a byte-identical rebuild)
      # on every run.
      - name: Build and check the Terraform provider's archives
        run: |
          rm -rf build/terraform-provider
          make terraform-provider-dist-test

      - name: Upload the Terraform provider's archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-provider-janus-${{ github.sha }}
          path: build/terraform-provider/terraform-provider-janus_*
          retention-days: 30

      # First real, deployable artifact: image/disk/assemble.sh's single
      # GPT disk (ESP + both A/B slots + STATE - the exact same shape
      # every UEFI boot test above already proved works end to end,
      # including under enforcing=1) converted to qcow2, Proxmox's own
      # preferred import/storage format (image/kvm-proxmox/assemble.sh).
      # Unsigned - Proxmox's own OVMF doesn't have this project's
      # production Secure Boot cert enrolled, so Secure Boot needs to be
      # off in the VM's EFI Disk settings regardless of whether the UKI
      # itself is signed; signing this too would add nothing an alpha
      # tester could actually use yet. Uploaded as a workflow artifact -
      # not a GitHub Release (no version scheme decided yet, this is
      # still a manually-triggered alpha, not a tagged release build).
      - name: Build an alpha Proxmox VM image (qcow2)
        run: |
          make proxmox-image
          ls -lh build/janus.qcow2

      - name: Upload the alpha Proxmox VM image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: janus-alpha-amd64-proxmox-${{ github.sha }}
          path: build/janus.qcow2
          retention-days: 30

      # Same disk-image content, packaged for the other two
      # Virtualized Platform targets closest to what already exists
      # (see docs/companion-site-builder-scope.md) - generic libvirt/
      # KVM (image/kvm/assemble.sh) and VMware/ESXi
      # (image/vmware/assemble.sh, streamOptimized VMDK). Both unsigned,
      # same reasoning as the Proxmox image above.
      - name: Build an alpha generic KVM/libvirt image (qcow2)
        run: |
          make kvm-image
          ls -lh build/janus-kvm.qcow2

      - name: Upload the alpha KVM/libvirt image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: janus-alpha-amd64-kvm-${{ github.sha }}
          path: build/janus-kvm.qcow2
          retention-days: 30

      - name: Build an alpha VMware/ESXi image (VMDK)
        run: |
          make vmware-image
          ls -lh build/janus.vmdk

      - name: Upload the alpha VMware/ESXi image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: janus-alpha-amd64-vmware-${{ github.sha }}
          path: build/janus.vmdk
          retention-days: 30

      # Bare-metal Machine tranche: same disk-image content again, this
      # time as the hybrid installer/maintenance-mode ISO (image/iso/
      # assemble.sh), with a real release bundle embedded (iso-image-
      # with-bundle, not the plain boot-test-only iso-image target) so
      # it's actually usable for a real LifecycleService.Install call
      # with nothing else reachable from the host - already proven
      # above (hack/qemu-iso-install-test.sh).
      #
      # Its build/release is also the bundle the GitHub Release step
      # publishes, so this is where it's signed - see the Makefile's
      # iso-image-with-bundle comment for why a separately built bundle
      # can't be signed instead (every target reruns rootfs-build, and
      # mksquashfs isn't byte-reproducible, so another bundle's UKIs carry
      # a different dm-verity root hash). A signed bundle used to be built
      # in its own step and then discarded, while the Release published
      # this unsigned one.
      #
      # Secure Boot key management - no HSM in this project's threat
      # model (single maintainer, self-hosted CI): the private key lives
      # only as a GitHub Actions encrypted secret (SECUREBOOT_SIGNING_KEY),
      # generated once, offline, by image/secureboot/gen-production-key.sh;
      # its certificate isn't sensitive and is committed at image/
      # secureboot/production-cert.pem. Without the secret (a fork, or
      # before the key ceremony) the bundle is built unsigned, and the
      # "Require a signed release bundle" step below refuses to publish it.
      # The key is written to a step-scoped temp file removed by a trap,
      # and both UKIs are verified with sbverify against the committed
      # certificate.
      - name: Build an alpha bare-metal installer ISO (signed release bundle)
        # The `secrets` context isn't allowed directly in a step's own
        # `if:`, and isn't needed here - env: is readable from run:.
        env:
          SECUREBOOT_SIGNING_KEY: ${{ secrets.SECUREBOOT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$SECUREBOOT_SIGNING_KEY" ]; then
            KEY="$(mktemp)"
            trap 'rm -f "$KEY"' EXIT
            printf '%s' "$SECUREBOOT_SIGNING_KEY" > "$KEY"
            make iso-image-with-bundle SIGNING_KEY="$KEY" SIGNING_CERT=image/secureboot/production-cert.pem
            sbverify --cert image/secureboot/production-cert.pem build/release/uki-a.efi
            sbverify --cert image/secureboot/production-cert.pem build/release/uki-b.efi
            echo "Release bundle UKIs signed and verified against image/secureboot/production-cert.pem"
          else
            echo "::warning::SECUREBOOT_SIGNING_KEY isn't set - release bundle left unsigned (can't be published as a release)"
            make iso-image-with-bundle
          fi
          ls -lh build/janus.iso

      - name: Upload the alpha installer ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: janus-alpha-amd64-iso-${{ github.sha }}
          path: build/janus.iso
          retention-days: 30

      # Real Raspberry Pi 4/5 hardware follow-up (user-requested: "je
      # testerai sur une Pi4 et Pi5" - a real, flashable image for the
      # user's own hardware test). Only structurally verified here (see
      # hack/rpi-sdcard-image-test.sh's own header for exactly why no
      # real boot test is possible in this - or any - CI environment,
      # or even locally, without real Pi4/Pi5 hardware): a real GPT
      # partition table, a genuinely readable firmware+ESP partition
      # with every expected file present, and real squashfs/dm-verity/
      # ext4 content at each partition's own offset. image/rpi-uefi/
      # assemble.sh's own header has the full design and the real
      # Pi4-vs-Pi5 firmware/kernel-driver maturity gap this reflects -
      # the Pi5 image is expected to prove firmware/kernel boot at best,
      # not a working networked appliance (RP1's own SD/Ethernet
      # drivers don't exist in mainline Linux yet).
      - name: Build and verify the Raspberry Pi 4 SD card image
        run: |
          make pi4-sdcard-image-test
          ls -lh build/rpi-uefi/pi4-disk.img

      - name: Upload the Raspberry Pi 4 SD card image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: janus-alpha-arm64-rpi4-${{ github.sha }}
          path: build/rpi-uefi/pi4-disk.img
          retention-days: 30

      - name: Build and verify the Raspberry Pi 5 SD card image
        run: |
          make pi5-sdcard-image-test
          ls -lh build/rpi-uefi/pi5-disk.img

      - name: Upload the Raspberry Pi 5 SD card image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: janus-alpha-arm64-rpi5-${{ github.sha }}
          path: build/rpi-uefi/pi5-disk.img
          retention-days: 30

      # User-requested: publish the dashboard image to the maintainer's
      # own Docker Hub - deferred ever since the Dockerfile itself
      # landed, until the rename decision settled (see dashboard/
      # README.md's own earlier "Status" note) and now explicitly
      # asked for. The build itself needs no secret and is cheap, so it
      # runs unconditionally, every dispatch, worth catching a real
      # build break here regardless of whether a push follows; only the
      # login+push step is gated behind DOCKERHUB_TOKEN (a Docker Hub
      # access token - hub.docker.com's own Account Settings -> Security
      # -> New Access Token, then `gh secret set DOCKERHUB_TOKEN`), so a
      # fork PR or a run before that secret exists skips cleanly - same
      # `env:` indirection the Secure Boot step above needs, since
      # `secrets` isn't allowed directly in a step's own `if:`. The
      # Docker Hub *username* isn't a secret (it's public on the pushed
      # tag itself either way), so it's a plain literal here, not a
      # second secret to manage.
      - name: Build the dashboard Docker image
        run: make dashboard-image

      # User-flagged real gap (2026-09-29, alongside remote-update Phase
      # 4): only `latest`/`<git-sha>` were ever pushed - no tag on
      # Docker Hub ever corresponded to a real release version, even
      # once those started existing (the v2026.09.29 GitHub Release
      # this same run cuts below has no Docker Hub counterpart without
      # this). `docker tag`/`push` a third tag, `swenske/janus-
      # controller:${{ inputs.release_version }}`, whenever this run is
      # also cutting a real release - conditioned on the *same*
      # `release_version` input Phase 4 already added, not a new one,
      # so the two stay in lockstep by construction rather than by
      # convention.
      - name: Push the dashboard image to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # Through the environment, never interpolated into the script
          # (the workflow's inputs are a collaborator's, but a shell
          # never sees an expression here).
          RELEASE_VERSION: ${{ inputs.release_version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "$DOCKERHUB_TOKEN" | docker login -u swenske --password-stdin
          docker tag janus-controller swenske/janus-controller:latest
          docker tag janus-controller "swenske/janus-controller:$COMMIT_SHA"
          docker push swenske/janus-controller:latest
          docker push "swenske/janus-controller:$COMMIT_SHA"
          if [ -n "$RELEASE_VERSION" ]; then
            docker tag janus-controller "swenske/janus-controller:$RELEASE_VERSION"
            docker push "swenske/janus-controller:$RELEASE_VERSION"
            # The release names the exact image it ships: a Controller
            # updating itself (dashboard/updater) runs it pinned to this
            # digest, whatever later happens to the tag.
            digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "swenske/janus-controller:$RELEASE_VERSION" | sed -n 's|^swenske/janus-controller@||p' | head -1)
            image="swenske/janus-controller:$RELEASE_VERSION@$digest"
            [[ "$image" =~ ^swenske/janus-controller:v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?@sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::no digest for the pushed Controller image: $image"; exit 1; }
            mkdir -p build/release
            echo "$image" > build/release/controller-image.txt
          fi
          docker logout

      # User-requested: the repository page itself (hub.docker.com/r/
      # swenske/janus-controller) - a short description (its ~100-char
      # search-result blurb) and the full Overview (logo + how-to-run,
      # dashboard/dockerhub-overview.md - a standalone file, not the
      # full dashboard/README.md verbatim, since Docker Hub renders it
      # outside this repo and relative links/badges wouldn't resolve
      # there). Idempotent - re-uploading the same content every run is
      # a harmless no-op - so this runs alongside the image push itself
      # rather than as a separate one-off action, reusing the same
      # DOCKERHUB_TOKEN (no new secret) via peter-evans/
      # dockerhub-description, a well-established action for exactly
      # this API call.
      - name: Update the Docker Hub repository description
        # env: is required on *this* step too, not inherited from the
        # push step above - GitHub Actions' `env` context in a step's
        # own `if:` only ever sees that step's own env block (job/
        # workflow-level env would also work, but no step's env leaks
        # into a sibling step) - a real run's own "skipped" outcome
        # caught this, not assumed from how the push step above reads.
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: swenske
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: swenske/janus-controller
          short-description: "Web UI to manage Janus nodes: self-registration, live stats, HAProxy config - HTTPS-only"
          readme-filepath: dashboard/dockerhub-overview.md

      # Remote-update Phase 4: a real, permanent, tagged GitHub Release -
      # unlike every artifact uploaded above (30-day workflow-artifact
      # retention), this is what closes the actual gap Phase 4 exists
      # to close: LifecycleService.Upgrade's node-initiated http(s)://
      # fetch mode (internal/api/lifecycle.go's fetchBundleFile) needs a
      # real, permanent URL to point at, and a future controller-side
      # "is a newer version available" check (remote-update Phase 5's
      # own remaining scope - see docs/companion-site-builder-scope.md)
      # needs something real to compare against. Manual-dispatch-gated
      # (an empty release_version input just skips this step entirely -
      # every dispatch before this input existed behaves identically)
      # - never automatic, the same "a human decides when to publish"
      # discipline the Docker Hub push and Secure Boot signing steps
      # above already follow, and this whole workflow's own
      # workflow_dispatch-only trigger already enforces at a coarser
      # grain.
      #
      # Versioned CalVer-style (vYYYY.MM.DD, an optional -N suffix for a
      # same-day second release) rather than semver - nothing about
      # this project has an API-stability contract yet to reason
      # "major/minor/patch" bumps against, and CalVer sorts correctly
      # both lexicographically and via `git describe` (already this
      # project's own VERSION ldflags source, see the top-level
      # Makefile) with no extra tooling.
      #
      # amd64 only, deliberately - not every artifact built above:
      # image/release/assemble.sh's own fixed-filename output
      # (rootfs.squashfs/rootfs.verity/uki-a.efi/uki-b.efi, already
      # built above as a side effect of the ISO-with-bundle step) is
      # exactly what fetchBundleFile expects directly under a release's
      # own base download URL, so these specific filenames are never
      # renamed here. arm64/Pi's own equivalent bundle isn't published
      # yet: LifecycleService.Upgrade has never actually been proven
      # end to end on that architecture (only the Pi SD card images'
      # own *structural* checks exist so far - see image/rpi-uefi/'s
      # own bullet) - publishing an unverified arm64 upgrade path would
      # be actively worse than not having one at all. The Pi4/Pi5 disk
      # images themselves are still attached below as fresh-install
      # artifacts (like the qcow2/vmdk/iso already are) - only the
      # *release-bundle* half is amd64-only, since that's the one
      # fetchBundleFile actually reads by these exact filenames.
      # Nodes verify an Upgrade bundle's UKI signature against this same
      # certificate, so an unsigned or wrongly signed bundle must never be
      # published - fail here rather than ship one.
      - name: Require a signed release bundle
        if: ${{ inputs.release_version != '' }}
        run: |
          set -euo pipefail
          for uki in build/release/uki-a.efi build/release/uki-b.efi; do
            sbverify --cert image/secureboot/production-cert.pem "$uki" \
              || { echo "::error::$uki isn't signed with the production key - refusing to publish (is SECUREBOOT_SIGNING_KEY set, and does it match image/secureboot/production-cert.pem?)"; exit 1; }
          done

      # The alpha warning, then this version's hand-written notes; the
      # action appends GitHub's generated "Full Changelog" link.
      - name: Assemble the release notes
        if: ${{ inputs.release_version != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          {
            echo '> [!WARNING]'
            echo '> **Alpha software.** Janus is under active early development: expect breaking changes, incomplete features and rough edges. Not yet recommended for production use.'
            echo
            cat ".github/release-notes/$RELEASE_VERSION.md"
          } > build/release-notes.md

      - name: Publish a real GitHub Release
        if: ${{ inputs.release_version != '' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.release_version }}
          target_commitish: ${{ github.sha }}
          # "🔒 security update" when it fixes vulnerabilities: what the
          # Releases watch and the releases feed show (docs/upstreams.md).
          name: "Janus ${{ inputs.release_version }} (Alpha)${{ env.SECURITY_SEVERITY != '' && env.SECURITY_SEVERITY != 'none' && ' - 🔒 security update' || '' }}"
          # A full release marked as the latest, not a pre-release: a
          # pre-release is never "Latest", so the repository's home page
          # showed no release at all - only "3 tags". The alpha status is
          # stated in the name above and at the top of the notes.
          body_path: build/release-notes.md
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          files: |
            build/release/rootfs.squashfs
            build/release/rootfs.squashfs.sha256
            build/release/rootfs.verity
            build/release/uki-a.efi
            build/release/uki-b.efi
            build/release/controller-image.txt
            build/security/security.json
            build/security/sbom.cdx.json
            build/janus.qcow2
            build/janus-kvm.qcow2
            build/janus.vmdk
            build/janus.iso
            build/rpi-uefi/pi4-disk.img
            build/rpi-uefi/pi5-disk.img
            build/inputs/schematic-catalog.json
            build/inputs/kernel-*-amd64
            build/inputs/kernel-*-arm64
            build/inputs/rootfs-base-amd64.tar
            build/inputs/rootfs-base-arm64.tar
            build/inputs/haproxy-*.tar
            build/inputs/extension-*.tar
            build/deb/janusctl_*.deb
            build/terraform-provider/terraform-provider-janus_*

      # janusctl on https://apt.sw-servers.net/janus (suite "stable",
      # component "main" - README.md), after the GitHub Release so apt
      # never offers a version that has no release. Same design as
      # swenske/gotochanger: a key per janus-publish machine that never
      # leaves it (~actions-runner/.ssh/id_janus_aptly, never a GitHub
      # secret) reaches a forced-command account on apt.int.sw-servers.net
      # that only accepts "upload janusctl_<version>_<arch>.deb" (stdin) and
      # "publish" (/usr/local/sbin/janus-publish-dispatch.sh and
      # janus-aptly-publish.sh there). A rerun uploads the same bytes,
      # which aptly accepts again (the packages are reproducible).
      # The server's host key is the APT_HOST_KEY repository variable (a
      # known_hosts line), pinned like site-deploy's SITE_HOST_KEY. Until
      # the variable exists, the runner's own known_hosts (first contact
      # accepted) - with a warning on the run.
      - name: Publish janusctl on apt.sw-servers.net
        if: ${{ inputs.release_version != '' }}
        env:
          APT_HOST_KEY: ${{ vars.APT_HOST_KEY }}
        run: |
          set -euo pipefail
          key="$HOME/.ssh/id_janus_aptly"
          host="janus-publish@apt.int.sw-servers.net"
          if [ -n "$APT_HOST_KEY" ]; then
            known="$(mktemp)"
            printf '%s\n' "$APT_HOST_KEY" > "$known"
            SSH="ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known -i $key"
          else
            echo "::warning::the APT_HOST_KEY repository variable isn't set: apt.int.sw-servers.net's host key is accepted on first contact"
            SSH="ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i $key"
          fi
          for deb in build/deb/janusctl_*.deb; do
            $SSH "$host" "upload $(basename "$deb")" < "$deb"
          done
          $SSH "$host" publish

      # /docs/ on janus.sw-servers.net is the newest release's: site-deploy
      # rebuilds both docs channels and redeploys - on main, never this
      # run's commit (main may be ahead: deploying it would roll the site
      # back). A workflow GITHUB_TOKEN creates starts no workflow - but a
      # workflow_dispatch it sends does.
      - name: Deploy this release's docs
        if: ${{ inputs.release_version != '' }}
        env:
          TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/site-deploy.yml/dispatches" \
            --data '{"ref":"main"}'
          echo "site-deploy dispatched: its /docs/ will follow $RELEASE_VERSION"

      # Repository security advisories - public and citable on the Security
      # tab, GitHub notifies nobody for one (docs/upstreams.md): one per
      # vulnerability of Janus's own code the release fixes (security/
      # fixes), whatever its severity, and one for the components it
      # updates when what they fix is rated high or worse. Last, so a
      # refused token can't keep janusctl off apt. It takes
      # UPSTREAM_BOT_TOKEN with "Repository security advisories" write;
      # without it, the requests are printed to create them by hand.
      - name: Publish the security advisories
        if: ${{ inputs.release_version != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          url="https://github.com/${{ github.repository }}/releases/tag/$RELEASE_VERSION"
          go run ./hack/upstream advisory -security build/security/security.json -url "$url" > build/security/advisories.json
          count=$(python3 -c 'import json, sys; print(len(json.load(open(sys.argv[1]))))' build/security/advisories.json)
          if [ "$count" = 0 ]; then
            echo "No advisory: no fix of Janus's own code, and nothing its components fix is rated high or worse."
            exit 0
          fi
          if [ -z "$TOKEN" ]; then
            echo "::warning::$RELEASE_VERSION calls for $count security advisories, but UPSTREAM_BOT_TOKEN isn't set - create them by hand (Security > Advisories) from:"
            cat build/security/advisories.json
            exit 0
          fi
          api="https://api.github.com/repos/${{ github.repository }}/security-advisories"
          auth=(-H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json")
          resp=build/security/advisory-response.json
          for i in $(seq 0 $((count - 1))); do
            req=build/security/advisory-$i.json
            python3 -c 'import json, sys; json.dump(json.load(open(sys.argv[1]))[int(sys.argv[2])], open(sys.argv[3], "w"))' build/security/advisories.json "$i" "$req"
            curl -sS --fail-with-body "${auth[@]}" -X POST "$api" --data @"$req" -o "$resp" \
              || { echo "::error::creating advisory $i failed: $(cat "$resp")"; exit 1; }
            ghsa=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["ghsa_id"])' "$resp")
            curl -sS --fail-with-body "${auth[@]}" -X PATCH "$api/$ghsa" --data '{"state":"published"}' -o "$resp" \
              || { echo "::error::publishing advisory $ghsa failed: $(cat "$resp")"; exit 1; }
            python3 -c 'import json, sys; print("Published", json.load(open(sys.argv[1]))["html_url"])' "$resp"
          done

      # TODO(Phase 3 cont'd): a real OVA (OVF descriptor + tar) on top
      # of image/vmware's bare VMDK - once built, add build/janus.ova
      # to the release step's own files: list above.
