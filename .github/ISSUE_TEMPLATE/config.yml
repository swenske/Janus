# The forms (need-tester-*.yml, extension-request.yml) beside a blank
# issue: there's no bug report form - an ordinary issue stays open to
# everyone.
blank_issues_enabled: true
contact_links:
  - name: Report a vulnerability
    url: https://github.com/swenske/Janus/security/advisories/new
    about: Privately, never in a public issue (SECURITY.md).
  - name: Documentation
    url: https://janus.sw-servers.net/docs/
    about: Installing, running and building on Janus - guides, internals, contributing.
