# What Dependabot keeps up to date. Everything pinned in versions.mk
# (kernel, HAProxy, the extensions' upstreams...) is outside its reach:
# see docs/upstreams.md. Minor and patch updates come grouped (a base
# image's new digest in one pull request for every Dockerfile using it);
# major updates and security updates come alone.
version: 2
updates:
  # The control plane (janusd, janusctl, dashboardd, janus-acme...) and
  # the Terraform provider, its own module.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/terraform-provider-janus"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      go:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]

  # The Controller's frontend (built into the Controller's binary - its
  # built output is committed: rebuild it with make dashboard-frontend-build
  # on the pull request), the site's, the docs site's (built in Docker
  # by make docs-build - nothing committed to rebuild), and the pinned
  # browser's (hack/browser: its playwright package must move with its
  # Playwright image, below - the image's build fails otherwise).
  - package-ecosystem: "npm"
    directories:
      - "/dashboard/frontend"
      - "/site/frontend"
      - "/site/docs"
      - "/hack/browser"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      npm:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]

  # Base images, pinned as tag@digest: Debian (the CA bundle, the UKI
  # stub, cross toolchains), Alpine (the musl libc linked into HAProxy and
  # the C extensions), Go (the Controller).
  - package-ecosystem: "docker"
    directories:
      - "/ca-certificates"
      - "/dashboard"
      - "/extensions/*"
      - "/hack/browser"
      - "/hack/libvirt-host"
      - "/hack/promtool"
      - "/kernel"
      - "/local-dev"
      - "/pkgs/*"
      - "/selinux"
      - "/site/docs"
      - "/systemd-stub"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      docker:
        group-by: dependency-name
        patterns: ["*"]
    ignore:
      # The docs site builds on Node's LTS line (24, site/docs/Dockerfile
      # and .nvmrc): its patches come, a new major goes in by hand once
      # it's LTS - an even release only becomes one in October.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Pinned by commit SHA, the version in a comment - the workflows and
  # the composite action they share.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
