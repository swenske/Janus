syntax = "proto3";

package janus.v1alpha1;

import "google/protobuf/empty.proto";

option go_package = "github.com/swenske/Janus/gen/janus/v1alpha1;janusv1alpha1";

// NetworkService configures the node's network - always available - and
// its optional network extensions: BGP (bird), VRRP (keepalived), the
// firewall (nftables), Consul. An extension is chosen when the image is
// built (docs/image-factory.md): without it, its binary isn't in the
// image at all, and its calls say so (MODULE_STATE_NOT_ENABLED,
// FailedPrecondition).
service NetworkService {
  // BGP: the bird extension (docs/bgp.md). The protocols named haproxy_*
  // are kept down while this node's HAProxy doesn't answer. Without the
  // extension in the image, BGPStatus says so and the other calls answer
  // FailedPrecondition - as for VRRP, the firewall and Consul below.

  // BGPStatus reads every protocol's state over BIRD's control socket.
  rpc BGPStatus(google.protobuf.Empty) returns (BGPStatusResponse);
  // BGPGetConfig returns the saved bird.conf.
  rpc BGPGetConfig(google.protobuf.Empty) returns (BGPGetConfigResponse);
  // BGPApplyConfig has BIRD check a bird.conf, saves it, and BIRD
  // reconfigures.
  rpc BGPApplyConfig(BGPApplyConfigRequest) returns (BGPApplyConfigResponse);

  // VRRP: the keepalived extension (docs/vrrp.md).

  // VRRPStatus reads keepalived's own state of each instance.
  rpc VRRPStatus(google.protobuf.Empty) returns (VRRPStatusResponse);
  // VRRPGetConfig returns the saved keepalived.conf.
  rpc VRRPGetConfig(google.protobuf.Empty) returns (VRRPGetConfigResponse);
  // VRRPApplyConfig has keepalived check a keepalived.conf, saves it,
  // and keepalived reloads.
  rpc VRRPApplyConfig(VRRPApplyConfigRequest) returns (VRRPApplyConfigResponse);

  // Firewall: the nftables extension (docs/firewall.md). The ruleset is
  // the node's whole nftables ruleset, in nft's own syntax.

  // FirewallList reports the module and the live ruleset.
  rpc FirewallList(google.protobuf.Empty) returns (FirewallListResponse);
  // FirewallGetRuleset returns the saved ruleset.
  rpc FirewallGetRuleset(google.protobuf.Empty) returns (FirewallGetRulesetResponse);
  // FirewallApplyRuleset validates and applies a ruleset on trial: unless
  // FirewallConfirm comes within the timeout, the previous one is put
  // back. Confirmed, it's saved and applied at every boot.
  rpc FirewallApplyRuleset(FirewallApplyRulesetRequest) returns (FirewallApplyRulesetResponse);
  // FirewallConfirm keeps the ruleset on trial. It must come over a
  // connection opened after the apply - established connections are
  // kept whatever the ruleset.
  rpc FirewallConfirm(google.protobuf.Empty) returns (FirewallConfirmResponse);
  // FirewallSets lists the live ruleset's named sets and their elements.
  rpc FirewallSets(google.protobuf.Empty) returns (FirewallSetsResponse);
  // FirewallSetUpdate adds and deletes elements of a named set without
  // reloading the ruleset - elements added without a timeout are kept
  // across applies and reboots.
  rpc FirewallSetUpdate(FirewallSetUpdateRequest) returns (FirewallSetUpdateResponse);

  // Consul: the consul extension (docs/consul.md). The agent runs with
  // the operator's own configuration and the files it names (TLS
  // certificates, keys...) under /run/janus/consul/files.

  // ConsulStatus reports the agent's service and what the agent says of
  // itself.
  rpc ConsulStatus(google.protobuf.Empty) returns (ConsulStatusResponse);
  // ConsulGetConfig returns the configuration and the files' names, never
  // their content.
  rpc ConsulGetConfig(google.protobuf.Empty) returns (ConsulGetConfigResponse);
  // ConsulApplyConfig has `consul validate` check a configuration, saves
  // it with its files, and restarts the agent.
  rpc ConsulApplyConfig(ConsulApplyConfigRequest) returns (ConsulApplyConfigResponse);
  // ConsulManagedGet returns the layer a Controller manages
  // (docs/consul.md "From the Controller") - its secrets left out, has_*
  // saying whether they're set - and how the registration of the node's
  // own services stands.
  rpc ConsulManagedGet(google.protobuf.Empty) returns (ConsulManagedGetResponse);
  // ConsulManagedSet replaces the managed layer: rendered into janusd's
  // part of the agent's configuration, loaded after the operator's - its
  // keys win -, checked by `consul validate` with it, and the agent
  // restarts when what it reads changed. The node then registers its own
  // services in the agent (IDs janus:*) with the layer's token. An empty
  // layer removes it, and the services it registered.
  rpc ConsulManagedSet(ConsulManaged) returns (ConsulManagedSetResponse);

  // The node's own network configuration: hostname, interfaces (physical
  // and 802.1Q VLANs, DHCP or static), DNS and NTP. Unlike the optional
  // modules above, always available.

  // NetworkConfigGet returns the saved network configuration.
  rpc NetworkConfigGet(google.protobuf.Empty) returns (NetworkConfigGetResponse);
  // NetworkConfigApply applies a configuration on trial: the node
  // switches to it at once, but keeps it only if NetworkConfigConfirm
  // arrives within the confirm window - otherwise it reverts to the
  // previous configuration by itself. A configuration that cuts the
  // caller off therefore undoes itself. Only a confirmed configuration
  // is written to persistent storage, so a reboot during the trial also
  // comes back on the previous one. The stream ends once the
  // configuration is applied and awaiting confirmation.
  rpc NetworkConfigApply(NetworkConfigApplyRequest) returns (stream NetworkConfigApplyResponse);
  // NetworkConfigConfirm confirms the configuration on trial. Accepted
  // only over a connection that reaches the node on an address the new
  // configuration keeps - proof that it's still reachable - and refused
  // over one whose local address the trial removed.
  rpc NetworkConfigConfirm(google.protobuf.Empty) returns (NetworkConfigConfirmResponse);
  // NetworkStatus reports what's actually in effect: links, addresses,
  // DHCP leases, routes, resolvers, hostname and clock synchronization.
  rpc NetworkStatus(google.protobuf.Empty) returns (NetworkStatusResponse);
  // NeighborList reads the kernel's neighbour table - ARP for IPv4, NDP
  // for IPv6: the link-layer address each neighbour answered with, and
  // whether it still answers. An entry that stays INCOMPLETE or FAILED
  // is a neighbour that never answered at layer 2.
  rpc NeighborList(NeighborListRequest) returns (NeighborListResponse);
}

// NetworkConfig is the node's whole network configuration. It's also the
// document given at creation time (InstallRequest.network_config,
// `janusctl image seed`, NoCloud user-data), as this message's JSON form.
message NetworkConfig {
  // Empty: the hostname DHCP provides, else "janus-" followed by the
  // last three bytes of the first Ethernet interface's MAC address.
  string hostname = 1;
  // Empty: DHCP - every physical interface asks, the first to get a
  // lease keeps it, the others go down (see ADDRESSING_MODE_DHCP); nodes
  // before janusd's own client kept the kernel's boot-time lease, on the
  // interface it configured. Otherwise exactly what's listed is
  // configured; a physical interface not listed is left down, unless it's
  // the parent of a listed VLAN (then up, no address).
  repeated NetworkInterface interfaces = 2;
  NetworkDNS dns = 3;
  NetworkNTP ntp = 4;
}

enum AddressingMode {
  // A DHCPv4 lease, from janusd's own client: IPv4 address, gateway,
  // DNS, domain, NTP servers, hostname and MTU, renewed for as long as
  // the node runs. The default when unset. One physical interface at
  // most (not a VLAN). Nodes before the client existed took the kernel's
  // lease at boot instead, on its interface only, never renewed.
  ADDRESSING_MODE_DHCP = 0;
  // Only the addresses and gateways given.
  ADDRESSING_MODE_STATIC = 1;
  // Link up, no address - e.g. a VLAN parent carrying only tagged traffic.
  ADDRESSING_MODE_NONE = 2;
  // Link down.
  ADDRESSING_MODE_DISABLED = 3;
}

message NetworkInterface {
  // Kernel name: "eth0", or the name a VLAN is created with ("eth0.100").
  string name = 1;
  // Physical interfaces only: match by MAC address ("52:54:00:12:34:56")
  // instead of name - names depend on probe order, MACs don't. When
  // set, the interface is renamed to name.
  string mac = 2;
  // Set for a VLAN interface, created on top of its parent.
  NetworkVLAN vlan = 3;
  AddressingMode mode = 4;
  // Static mode: addresses in CIDR form, IPv4 or IPv6 ("192.0.2.10/24").
  repeated string addresses = 5;
  // Static mode: default gateways. Empty: no default route through this
  // interface.
  string gateway = 6;
  string gateway6 = 7;
  // 0 leaves the MTU unchanged.
  uint32 mtu = 8;
  // Metric of this interface's default routes, DHCP or static. 0:
  // automatic (1024 plus the position in interfaces), so the first
  // listed interface is preferred.
  uint32 route_metric = 9;
}

message NetworkVLAN {
  // Parent interface name, as listed in NetworkConfig.interfaces or an
  // existing physical interface.
  string parent = 1;
  uint32 id = 2; // 1-4094
}

message NetworkDNS {
  // Empty: the resolvers DHCP provided at boot.
  repeated string servers = 1;
  // Empty: the domain DHCP provides, if any.
  repeated string search = 2;
}

message NetworkNTP {
  // Up to two "host" or "host:port". Empty: the servers DHCP provided at
  // boot, else pool.ntp.org.
  repeated string servers = 1;
}

message NetworkConfigGetResponse {
  NetworkConfig config = 1;
  // True when nothing was ever configured and the defaults are in effect.
  bool is_default = 2;
}

message NetworkConfigApplyRequest {
  NetworkConfig config = 1;
  // How long the node waits for NetworkConfigConfirm. 0: 30 seconds.
  // At most 300.
  uint32 confirm_timeout_seconds = 2;
}

message NetworkConfigApplyResponse {
  // "validating", "applying", then "awaiting-confirmation" (the last
  // message).
  string stage = 1;
  string message = 2;
  // With awaiting-confirmation: the node's addresses under the new
  // configuration (CIDR), and when it reverts without a confirmation.
  repeated string addresses = 3;
  int64 revert_at_unix = 4;
}

message NetworkConfigConfirmResponse {
  // The address, of those the configuration keeps, the confirmation
  // arrived on.
  string confirmed_via = 1;
}

message NetworkStatusResponse {
  string hostname = 1;
  repeated NetworkInterfaceStatus interfaces = 2;
  repeated NetworkRoute routes = 3;
  repeated string dns_servers = 4;
  repeated string dns_search = 5;
  TimeStatus time = 6;
  // A configuration is on trial, reverting at trial_revert_at_unix
  // unless confirmed.
  bool trial_pending = 7;
  int64 trial_revert_at_unix = 8;
  // False when this janusd doesn't manage the node's network, hostname
  // and clock (it runs outside a Janus node - a development container,
  // say): everything above is then observed only, interface modes
  // aren't known, and NetworkConfigApply is refused.
  bool managed = 9;
}

message NetworkInterfaceStatus {
  string name = 1;
  string kind = 2; // "physical", "vlan", "loopback"
  string mac = 3;
  uint32 mtu = 4;
  bool up = 5;      // administratively up
  bool carrier = 6; // link detected
  repeated string addresses = 7; // CIDR
  AddressingMode mode = 8;
  DHCPLease dhcp = 9; // the DHCP lease, on the interface that holds it
  string vlan_parent = 10;
  uint32 vlan_id = 11;
}

message DHCPLease {
  string address = 1; // CIDR
  string server = 2;
  string router = 3;
  repeated string dns_servers = 4;
  repeated string ntp_servers = 5;
  string domain = 6;
  string hostname = 7;
  // When it was obtained and when it ends - 0 for a kernel's boot-time
  // lease (nodes before janusd's own client), which never ended.
  int64 obtained_unix = 8;
  int64 expires_unix = 9;
}

message NetworkRoute {
  string destination = 1; // CIDR, "default" for 0.0.0.0/0 and ::/0
  string gateway = 2;
  string interface = 3;
  uint32 metric = 4;
}

message NeighborListRequest {
  // Only this interface's neighbours; empty: every interface's.
  string interface = 1;
}

message NeighborListResponse {
  // By interface, then IPv4 before IPv6, then by address.
  repeated Neighbor neighbors = 1;
}

message Neighbor {
  string interface = 1;
  NeighborFamily family = 2;
  string address = 3;
  // Empty while the neighbour hasn't answered (INCOMPLETE, FAILED).
  string link_address = 4;
  NeighborState state = 5;
  // IPv6: the neighbour advertises itself as a router.
  bool router = 6;
  // How long ago, in milliseconds (the kernel counts hundredths of a
  // second): the neighbour's reachability was last confirmed - by an
  // ARP or NDP answer, or by traffic that proved it (a TCP ACK) - the
  // entry was last used to send, and it entered its state.
  uint64 confirmed_ms_ago = 7;
  uint64 used_ms_ago = 8;
  uint64 updated_ms_ago = 9;
}

enum NeighborFamily {
  NEIGHBOR_FAMILY_UNSPECIFIED = 0;
  NEIGHBOR_FAMILY_IPV4 = 1; // ARP
  NEIGHBOR_FAMILY_IPV6 = 2; // NDP
}

// NeighborState is the kernel's NUD state (include/uapi/linux/
// neighbour.h).
enum NeighborState {
  // None the kernel names (NUD_NONE): a new entry.
  NEIGHBOR_STATE_NONE = 0;
  // Asked, no answer yet.
  NEIGHBOR_STATE_INCOMPLETE = 1;
  // Answered recently.
  NEIGHBOR_STATE_REACHABLE = 2;
  // Known, not confirmed for a while; asked again before it's used.
  NEIGHBOR_STATE_STALE = 3;
  // Used while stale, waiting a moment for traffic to confirm it.
  NEIGHBOR_STATE_DELAY = 4;
  // Being asked again.
  NEIGHBOR_STATE_PROBE = 5;
  // Asked and never answered.
  NEIGHBOR_STATE_FAILED = 6;
  // Needs no resolution (multicast, point-to-point links).
  NEIGHBOR_STATE_NOARP = 7;
  // Set by hand, never expires.
  NEIGHBOR_STATE_PERMANENT = 8;
}

message TimeStatus {
  bool synchronized = 1;
  // Servers in use, and where they came from: "configured", "dhcp" or
  // "default".
  repeated string servers = 2;
  string source = 3;
  // Last successful exchange.
  string last_server = 4;
  int64 last_sync_unix = 5;
  // Correction measured at that sync: server time minus the node's
  // clock (positive: the node was behind).
  int64 offset_ns = 6;
  uint32 stratum = 7;
  string error = 8; // last failure, if the last attempt failed
}

// ModuleState is shared by every optional module's status response so a
// client can distinguish "not enabled on this node" from "enabled but
// currently down".
enum ModuleState {
  MODULE_STATE_NOT_ENABLED = 0;
  MODULE_STATE_RUNNING = 1;
  MODULE_STATE_STOPPED = 2;
  MODULE_STATE_ERROR = 3;
}

message BGPStatusResponse {
  ModuleState state = 1;
  reserved 2; // was peers
  bool configured = 3; // a bird.conf is saved
  string version = 4; // BIRD's
  string router_id = 5;
  // Every protocol of bird.conf: BGP sessions and the others (static,
  // kernel, device, OSPF...).
  repeated BGPProtocol protocols = 6;
  bool haproxy_healthy = 7;
  string error = 8; // why the protocols couldn't be read, if they couldn't
}

message BGPProtocol {
  string name = 1;
  string protocol = 2; // "BGP", "Static", "Kernel", "Device", "OSPF"...
  string table = 3;
  string state = 4; // "up", "down", "start" or "stop" - BIRD's own
  string since = 5; // as BIRD prints it
  string info = 6; // e.g. "Established", "Active Socket: Connection refused"
  // BGP sessions only.
  string bgp_state = 7;
  string neighbor_address = 8;
  uint32 neighbor_as = 9;
  uint32 local_as = 10;
  string last_error = 11;
  repeated BGPChannel channels = 12;
  // janusd keeps it down: its name starts with haproxy_ and HAProxy
  // doesn't answer.
  bool held_down = 13;
}

message BGPChannel {
  string name = 1; // "ipv4", "ipv6"...
  string state = 2;
  uint32 imported = 3;
  uint32 exported = 4;
  uint32 preferred = 5;
}

message BGPGetConfigResponse {
  bytes config = 1; // the saved bird.conf
  bool is_default = 2; // none saved
}

message BGPApplyConfigRequest {
  // bird.conf; empty removes it and stops BIRD.
  bytes config = 1;
  bool validate_only = 2;
}

message BGPApplyConfigResponse {
  bool accepted = 1;
  repeated string errors = 2;
}

message VRRPStatusResponse {
  ModuleState state = 1;
  repeated VRRPInstance instances = 2;
  bool configured = 3; // a keepalived.conf is saved
  // The file a keepalived.conf tracks (track_file) to give its virtual IPs
  // up when HAProxy stops answering: "0" healthy, "1" not.
  string haproxy_health_file = 4;
  bool haproxy_healthy = 5;
  string error = 6; // why the instances couldn't be read, if they couldn't
}

message VRRPInstance {
  string name = 1;
  // "MASTER", "BACKUP", "FAULT", "INIT" or "STOP" - keepalived's own.
  string role = 2;
  reserved 3; // was a single virtual_ip
  string interface = 4;
  uint32 virtual_router_id = 5;
  uint32 priority = 6; // configured
  uint32 effective_priority = 7; // after tracked scripts/files
  repeated string virtual_ips = 8; // CIDR
  int64 last_transition_unix = 9;
  uint64 became_master = 10; // times, since keepalived started
}

message VRRPGetConfigResponse {
  bytes config = 1; // the saved keepalived.conf
  bool is_default = 2; // none saved
}

message VRRPApplyConfigRequest {
  // keepalived.conf; empty removes it and stops keepalived.
  bytes config = 1;
  bool validate_only = 2;
}

message VRRPApplyConfigResponse {
  bool accepted = 1;
  repeated string errors = 2; // keepalived's
}

message ConsulStatusResponse {
  ModuleState state = 1;
  bool configured = 2; // a configuration is saved
  // The consul service's state: "running", "waiting" (for a
  // configuration), "restarting", "stopped".
  string service_state = 3;
  string service_error = 4; // its last exit, if it ended badly
  // What the agent says of itself, over its HTTP API (127.0.0.1:8500,
  // with the managed layer's token if there's one): empty if it can't be
  // asked, error says why.
  string error = 5;
  string node_name = 6;
  string node_id = 7;
  string datacenter = 8;
  bool server = 9;
  string version = 10;
  string leader = 11; // the cluster's leader, "" if there's none
  repeated ConsulMember members = 12; // the LAN gossip pool
  string files_dir = 13; // where the configuration's files are
  // A Controller manages a layer of the configuration
  // (ConsulManagedGet): its token is the one the agent is asked with.
  bool managed = 14;
  // The agent's services, its own and the operator's, with their checks'
  // state.
  repeated ConsulService services = 15;
}

message ConsulMember {
  string name = 1;
  string address = 2;
  string status = 3; // "alive", "leaving", "left", "failed"
  string role = 4; // "server", "client"
  string datacenter = 5;
}

// ConsulManaged is the part of the Consul agent's configuration a
// Controller manages: what makes the node a client of its Consul
// cluster, and which of its own services it registers there.
message ConsulManaged {
  // Who set it: "janus-controller <id> consul <hash>"; empty: none set.
  string managed_by = 1;
  string datacenter = 2;
  // The node's name in Consul.
  string node_name = 3;
  // The servers to join (host or host:port, as retry_join takes them).
  repeated string retry_join = 4;
  // The address the agent binds and advertises; empty: the node's main
  // IPv4 address.
  string advertise_addr = 5;
  // The gossip encryption key (encrypt). Write-only: never returned -
  // has_encrypt says whether one is set. Sent empty with has_encrypt
  // true, the saved one is kept.
  string encrypt = 6;
  bool has_encrypt = 7;
  // The agent's ACL token (acl.tokens.agent), also the one the node
  // registers its services with. Write-only, as encrypt.
  string agent_token = 8;
  bool has_agent_token = 9;
  // The CA of the servers' RPC certificates (PEM): the agent verifies
  // them, and gets its own certificate from them (auto_encrypt).
  string ca_pem = 10;
  // The node's metadata in the catalog.
  map<string, string> node_meta = 11;
  ConsulManagedServices services = 12;
}

// ConsulManagedServices: which of its services the node registers.
message ConsulManagedServices {
  // janus: janusd's API (:9505).
  bool janus = 1;
  // janus-exporter and, when that extension runs, node-exporter.
  bool exporters = 2;
  // haproxy-<name>: one per frontend and listen section.
  bool frontends = 3;
  // haproxy-url: one instance per URL the configuration routes - the
  // hosts in the maps a use_backend reads by the Host header (or the
  // TLS server name), and in host ACLs.
  bool urls = 4;
}

message ConsulManagedGetResponse {
  ModuleState state = 1;
  // The layer, its secrets left out; empty managed_by: none set.
  ConsulManaged managed = 2;
  // The registration of the node's services: when it last went
  // through, why not since, how many janusd keeps registered, and
  // whether they're in maintenance (the node is drained, or going
  // down).
  int64 synced_unix = 3;
  string sync_error = 4;
  int32 registered = 5;
  bool maintenance = 6;
}

message ConsulManagedSetResponse {
  bool accepted = 1;
  repeated string errors = 2; // consul validate's
  // The agent restarted (or started) to read it - not when nothing it
  // reads changed.
  bool restarted = 3;
}

// ConsulService is a service the node's agent has registered.
message ConsulService {
  string id = 1;
  string name = 2;
  string address = 3;
  uint32 port = 4;
  repeated string tags = 5;
  map<string, string> meta = 6;
  // Its checks' worst: "passing", "warning", "critical", "maintenance";
  // empty without a check.
  string status = 7;
  // Registered by janusd (IDs janus:*), not by the operator's
  // configuration.
  bool managed = 8;
}

message ConsulGetConfigResponse {
  bytes config = 1; // the saved configuration (HCL or JSON)
  bool is_default = 2; // none saved
  repeated string files = 3; // the saved files' names
}

message ConsulApplyConfigRequest {
  // The agent's configuration, HCL or JSON; empty removes it - and its
  // files - and stops the agent.
  bytes config = 1;
  bool validate_only = 2;
  // The files it names, as /run/janus/consul/files/<name>: an empty value
  // keeps the saved file of that name; a saved file not given is removed.
  map<string, bytes> files = 3;
}

message ConsulApplyConfigResponse {
  bool accepted = 1;
  repeated string errors = 2; // consul validate's
}

message FirewallListResponse {
  ModuleState state = 1;
  bytes ruleset = 2; // the live ruleset, as nft lists it
  bool configured = 3; // a ruleset is saved (otherwise the node has no firewall)
  bool trial_pending = 4;
  int64 trial_revert_at_unix = 5;
}

message FirewallGetRulesetResponse {
  bytes ruleset = 1; // the saved ruleset
  bool is_default = 2; // none saved: no firewall
}

message FirewallApplyRulesetRequest {
  // The whole ruleset, nft syntax; empty removes the firewall.
  bytes ruleset = 1;
  uint32 confirm_timeout_seconds = 2; // 0 = 30; 5-300
  bool validate_only = 3; // check it, change nothing
}

message FirewallApplyRulesetResponse {
  bool accepted = 1;
  repeated string errors = 2; // nft's, with the ruleset's own line numbers
  int64 revert_at_unix = 3; // when it reverts unless confirmed
}

message FirewallConfirmResponse {}

message FirewallSet {
  string family = 1;
  string table = 2;
  string name = 3;
  string type = 4; // "ipv4_addr", "ipv4_addr . inet_service"
  repeated string flags = 5;
  repeated FirewallSetElement elements = 6;
}

message FirewallSetElement {
  // nft syntax: "192.0.2.7", "198.51.100.0/24", "10.0.0.1-10.0.0.9",
  // "192.0.2.1 . 443".
  string value = 1;
  uint32 timeout_seconds = 2; // on add: expire after; 0 = never, and kept
  uint32 expires_seconds = 3; // time left, on list
  bool persistent = 4; // kept on the node, added back after every apply
}

message FirewallSetsResponse {
  repeated FirewallSet sets = 1;
}

message FirewallSetUpdateRequest {
  string family = 1;
  string table = 2;
  string set = 3;
  repeated FirewallSetElement add = 4;
  repeated string delete = 5;
}

message FirewallSetUpdateResponse {
  FirewallSet set = 1; // the set after the update
}
