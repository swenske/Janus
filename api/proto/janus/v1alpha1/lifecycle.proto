syntax = "proto3";

package janus.v1alpha1;

import "google/protobuf/empty.proto";
import "janus/v1alpha1/network.proto";

option go_package = "github.com/swenske/Janus/gen/janus/v1alpha1;janusv1alpha1";

// LifecycleService handles installation, upgrade and rollback: writing a
// new immutable image to the inactive A/B slot, switching the bootloader
// to it, and rolling back automatically if the new slot doesn't become
// healthy within its grace period. See docs/architecture.md for the A/B
// partition layout this is built on (Phase 3).
service LifecycleService {
  // Install writes an image to a blank disk for the first time (bare
  // metal / fresh VM) - partitioning it from scratch and writing
  // identical content to both A/B slots, since there's no "other slot"
  // yet to leave untouched. Streams progress; never reboots anything,
  // since the disk it just wrote isn't necessarily the one this node
  // itself is running from.
  rpc Install(InstallRequest) returns (stream InstallResponse);

  // Upgrade writes a new image to the currently-inactive A/B slot,
  // switches the bootloader default, and reboots. If wait_for_health is
  // true, the *next* boot has to confirm itself healthy within
  // health_timeout_seconds or the node reverts and reboots back to the
  // slot that was active before this call - autonomously, driven by the
  // node itself, not by this RPC: the stream (and the connection it
  // rides on) ends once the first reboot happens, well before any
  // confirmation or possible revert, so neither is ever visible as a
  // stream message here.
  rpc Upgrade(UpgradeRequest) returns (stream UpgradeResponse);

  // Rollback switches the bootloader default back to the other A/B slot
  // and reboots, without needing a new image.
  rpc Rollback(google.protobuf.Empty) returns (RollbackResponse);

  // UploadReleaseFile streams one release-bundle file (one of
  // "rootfs.squashfs", "rootfs.verity", "uki-a.efi", "uki-b.efi" - the
  // fixed set image/release/assemble.sh produces) to a local staging
  // area on this node, for network topologies where the node can't
  // dial out to fetch a bundle itself (see UpgradeRequest.source's own
  // doc comment for the alternative, node-initiated http(s):// fetch
  // mode). Call once per file the upcoming Upgrade call will need, then
  // call Upgrade itself with source.reference set to the returned
  // staging_dir. Never triggers an upgrade by itself - purely a file
  // transfer.
  rpc UploadReleaseFile(stream UploadReleaseFileRequest) returns (UploadReleaseFileResponse);
}

message ImageSource {
  // A local directory on this node's own filesystem (e.g. a
  // UploadReleaseFile staging_dir), or an "http://"/"https://" base URL
  // this node fetches "rootfs.squashfs"/"rootfs.verity"/
  // "uki-<slot>.efi" from itself.
  //
  // Before anything is written, every UKI taken from the bundle must
  // carry an Authenticode signature from a release signing certificate
  // built into janusd (internal/releasetrust). The UKI's command line
  // holds the rootfs's dm-verity root hash, so a verified UKI
  // authenticates the whole bundle, whatever transport or relay it came
  // through.
  string reference = 1;
  // Optional sha256 of rootfs.squashfs - an early consistency check,
  // not the authentication (see above).
  string sha256 = 2;
  // Accept a UKI that isn't signed by a trusted release certificate.
  // For development and test bundles only: without the signature
  // check, whoever can alter the bundle on its way to the node (an
  // http:// mirror, a compromised download) controls what it boots.
  bool insecure_skip_signature_check = 3;
  // Accept a bundle built from another image schematic than the node's
  // own (its UKI's janus.schematic= differs). Off, Upgrade refuses: a
  // node built with an extension must not lose it to an update built
  // without it. See docs/image-factory.md.
  bool allow_schematic_change = 4;
}

message InstallRequest {
  ImageSource source = 1;
  // Target disk, e.g. "/dev/sda" - not necessarily the disk this node
  // itself booted from (rejected if it is; that's Upgrade's territory).
  // Fails if the disk already has a Janus install (use
  // Rollback/Upgrade instead).
  string disk = 2;
  // Optional: a Controller for the freshly-installed node to
  // self-register with on first boot (see docs/architecture.md's node
  // self-registration design). Written onto the new STATE filesystem's
  // controller/ directory, read back by janusd at boot - if left
  // unset, the installed node never announces itself anywhere, same as
  // every install before this field existed. controller_ca_cert must
  // be set whenever controller_address is: the node has to already
  // know which CA to trust before it ever dials the Controller - there
  // is deliberately no trust-on-first-use fallback.
  string controller_address = 3;
  bytes controller_ca_cert = 4;
  // Optional, with controller_address: the Controller's fleet root (PEM).
  // The node then checks the Controller through its fleet - asking for
  // its fleet certificate (pki.FleetControllerName) - before falling
  // back to controller_ca_cert, and takes only that fleet's trust.
  bytes controller_fleet_root_cert = 6;
  // Optional, with controller_address: a registration token the node
  // presents when it announces itself - a Controller's enrollment token
  // admits it without the approval step, with the token's labels. Sent
  // once, then deleted from the node.
  string registration_token = 9;
  // Optional: the installed node's network configuration (hostname,
  // interfaces, VLANs, DNS, NTP), written onto the new STATE filesystem
  // and in effect from its first boot. Unset: the defaults (DHCP on
  // every Ethernet interface).
  NetworkConfig network_config = 5;
  // Optional: a fleet for the installed node to trust from its first
  // boot - its root (PEM) and a bundle that root signed (pki.SignedBundle
  // as JSON), both required together. The fleet's certificates then let
  // in without anyone copying the first boot's admin credential
  // (janusctl fleet adopt -ca-fingerprint). Checked before anything is
  // written.
  bytes fleet_root_cert = 7;
  bytes fleet_bundle = 8;
}

message InstallResponse {
  // "verifying", "partitioning", "writing-data", "formatting-state",
  // "writing-esp", "done". Install never reboots anything itself - the
  // target disk isn't necessarily the one this node runs from - so
  // "done" is this stream's own last message, not a handoff to a later
  // boot the way Upgrade's "rebooting" is.
  string stage = 1;
  double progress = 2; // 0.0-1.0 within the current stage
  string message = 3;
}

message UpgradeRequest {
  ImageSource source = 1;
  bool wait_for_health = 2;
  uint32 health_timeout_seconds = 3;
}

message UpgradeResponse {
  // e.g. "verifying", "writing-data", "writing-hash", "switching-slot",
  // "rebooting" - the last stage this stream ever sends. Confirmation
  // and any eventual revert happen on a later boot, outside this RPC
  // entirely (see Upgrade's own comment above), so no stage value for
  // either is ever streamed here.
  string stage = 1;
  double progress = 2;
  string message = 3;
}

message RollbackResponse {
  string active_slot = 1; // "A" or "B" after the switch
}

message UploadReleaseFileRequest {
  // Set on the first message of the stream only (ignored on later
  // ones) - must be one of "rootfs.squashfs", "rootfs.verity",
  // "uki-a.efi", "uki-b.efi", refused otherwise so a caller can't stage
  // an arbitrary filename onto persistent storage.
  string filename = 1;
  // Raw file bytes, in order - present on every message, including the
  // first if it also carries data. No fixed chunk size is required;
  // a few hundred KiB to a few MiB per message is reasonable.
  bytes chunk = 2;
}

message UploadReleaseFileResponse {
  // Pass this directly as a later UpgradeRequest.source.reference,
  // once every file that Upgrade call will need has been uploaded.
  string staging_dir = 1;
  uint64 bytes_written = 2;
}
