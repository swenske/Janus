syntax = "proto3";

package janus.v1alpha1;

import "google/protobuf/empty.proto";
import "janus/v1alpha1/common.proto";

option go_package = "github.com/swenske/Janus/gen/janus/v1alpha1;janusv1alpha1";

// SystemService is the reduced, non-Kubernetes equivalent of Talos's
// MachineService: the machine's power, observability, managed-service
// control, and the handful of read-only file/network RPCs that replace an
// interactive shell. See docs/api-routes.md for the full design
// rationale. Every method is implemented but ApplyConfiguration,
// MetaWrite and MetaDelete, which return codes.Unimplemented.
service SystemService {
  // Version reports what the node runs: Janus's version, its kernel, the
  // A/B slot it booted from and its image schematic.
  rpc Version(google.protobuf.Empty) returns (VersionResponse);
  // Hostname reports the node's hostname.
  rpc Hostname(google.protobuf.Empty) returns (HostnameResponse);

  // Reboot restarts the machine, after a soft stop of HAProxy:
  // connections in flight get a chance to finish. Through the firmware
  // unless mode is KEXEC (see RebootMode).
  rpc Reboot(RebootRequest) returns (RebootResponse);
  // Shutdown powers the machine off, after the same soft stop of HAProxy.
  rpc Shutdown(google.protobuf.Empty) returns (ShutdownResponse);
  // Restart restarts the janusd control-plane process in place,
  // without rebooting the machine or interrupting HAProxy itself.
  rpc Restart(google.protobuf.Empty) returns (RestartResponse);
  // Reset wipes the requested partitions (state/ephemeral) and reboots -
  // the equivalent of returning the node to its just-installed state.
  rpc Reset(ResetRequest) returns (ResetResponse);

  // ApplyConfiguration is not implemented - it answers Unimplemented: a
  // node has no declarative machine configuration, each area has its
  // own calls (HAProxyService, NetworkService...).
  rpc ApplyConfiguration(ApplyConfigurationRequest) returns (stream ApplyConfigurationResponse);

  // Events streams the machine's internal event log (config applied,
  // service state changes, upgrade progress, etc.).
  rpc Events(EventsRequest) returns (stream Event);
  // Dmesg streams the kernel ring buffer.
  rpc Dmesg(DmesgRequest) returns (stream Data);
  // Logs streams a managed service's log output.
  rpc Logs(LogsRequest) returns (stream Data);

  // Stats sums the CPU time and memory of each managed service's
  // processes - janusd, haproxy (a reload briefly leaves an old haproxy
  // process finishing its connections next to the new one).
  rpc Stats(google.protobuf.Empty) returns (StatsResponse);
  // SystemStat reports the machine's counters since boot: boot time,
  // context switches, processes created, CPU ticks (/proc/stat).
  rpc SystemStat(google.protobuf.Empty) returns (SystemStatResponse);
  // Memory reports the machine's total, available and cached memory.
  rpc Memory(google.protobuf.Empty) returns (MemoryResponse);
  // CPUInfo describes the machine's CPUs: model, frequency, sockets and
  // cores.
  rpc CPUInfo(google.protobuf.Empty) returns (CPUInfoResponse);
  // LoadAvg reports the load averages over 1, 5 and 15 minutes.
  rpc LoadAvg(google.protobuf.Empty) returns (LoadAvgResponse);
  // DiskStats reports each disk's I/O counters.
  rpc DiskStats(google.protobuf.Empty) returns (DiskStatsResponse);
  // DiskUsage reports each requested path's total size (apparent size of
  // every regular file under it, not crossing into /proc, /sys or /dev);
  // with recursive, also one entry per directory beneath it.
  rpc DiskUsage(DiskUsageRequest) returns (stream DiskUsageInfo);
  // NetworkDeviceStats reports each network interface's traffic and
  // error counters.
  rpc NetworkDeviceStats(google.protobuf.Empty) returns (NetworkDeviceStatsResponse);
  // Netstat lists the machine's TCP and UDP sockets: listening ones and
  // connections.
  rpc Netstat(google.protobuf.Empty) returns (NetstatResponse);
  // Mounts lists the mounted filesystems with their size and free space.
  rpc Mounts(google.protobuf.Empty) returns (MountsResponse);
  // Processes lists the machine's processes.
  rpc Processes(google.protobuf.Empty) returns (ProcessesResponse);

  // ServiceList reports the managed services: janusd itself, haproxy,
  // and the services of the image's optional extensions.
  rpc ServiceList(google.protobuf.Empty) returns (ServiceListResponse);
  // ServiceStart starts a managed service. NotFound for a service the
  // image doesn't have; FailedPrecondition for an extension's service its
  // settings disable.
  rpc ServiceStart(ServiceRequest) returns (ServiceResponse);
  // ServiceStop stops a managed service - haproxy after a soft stop;
  // never janusd (FailedPrecondition: Restart restarts it).
  rpc ServiceStop(ServiceRequest) returns (ServiceResponse);
  // ServiceRestart restarts a managed service.
  rpc ServiceRestart(ServiceRequest) returns (ServiceResponse);

  // List, Read, Copy and PacketCapture are the deliberate, narrow
  // replacements for an interactive shell: read-only, scoped, never
  // arbitrary command execution. None of them serves the node's secrets.

  // List walks a directory, never into /proc, /sys or /dev.
  rpc List(ListRequest) returns (stream FileInfo);
  // Read streams a file's content - never a device's.
  rpc Read(ReadRequest) returns (stream Data);
  // Copy streams a file or a directory as a tar archive - never from
  // /proc or /sys.
  rpc Copy(CopyRequest) returns (stream Data);
  // PacketCapture streams a live capture as a pcap file (classic
  // libpcap format, microsecond timestamps), split across Data
  // messages - concatenate them to get a file tcpdump/Wireshark read
  // directly. Runs for duration_seconds, or until the client cancels.
  rpc PacketCapture(PacketCaptureRequest) returns (stream Data);

  // MetaWrite is not implemented - it answers Unimplemented: a node has
  // no META partition for small key/value entries.
  rpc MetaWrite(MetaWriteRequest) returns (google.protobuf.Empty);
  // MetaDelete is not implemented - it answers Unimplemented, like
  // MetaWrite.
  rpc MetaDelete(MetaDeleteRequest) returns (google.protobuf.Empty);

  // GenerateClientConfiguration issues a client certificate signed by
  // this node's CA (see internal/pki), for the given roles, named after
  // who it's for and valid one year or less.
  rpc GenerateClientConfiguration(GenerateClientConfigurationRequest) returns (GenerateClientConfigurationResponse);

  // The node's Prometheus exporter (docs/metrics.md): Janus's own
  // metrics - certificate expiry, boot slot, HAProxy as janusd runs it,
  // extension services, time sync, SELinux - over plain HTTP, on by
  // default on port 10056, on every address unless one is set.

  // MetricsConfigGet reports the exporter's settings.
  rpc MetricsConfigGet(google.protobuf.Empty) returns (MetricsConfigResponse);
  // MetricsConfigSet changes the exporter's settings, at once and for
  // good; a port that can't be bound is refused and the exporter stays
  // as it was.
  rpc MetricsConfigSet(MetricsConfig) returns (MetricsConfigResponse);

  // The prometheus-node-exporter extension's settings (docs/metrics.md):
  // whether node_exporter runs, the address and port it listens on, and
  // its collectors, from a fixed list. FailedPrecondition when the image
  // doesn't have the extension.

  // NodeExporterConfigGet reports node_exporter's settings.
  rpc NodeExporterConfigGet(google.protobuf.Empty) returns (NodeExporterConfigResponse);
  // NodeExporterConfigSet changes node_exporter's settings: it restarts
  // with them, and they're kept.
  rpc NodeExporterConfigSet(NodeExporterConfig) returns (NodeExporterConfigResponse);

  // The node's kernel parameters (docs/guide/kernel-tuning.md): a
  // whitelist of the ones HAProxy depends on, which an operator may
  // change - on trial, kept once confirmed, back to Janus's defaults on
  // request - and the CIS benchmark's, which no call changes. Changes
  // answer FailedPrecondition unless janusd runs a Janus node.

  // SysctlList reports every parameter the node shows - its value,
  // Janus's default, the saved one, its bounds, what it does to HAProxy,
  // its risks and a value suggested for this node -, the CIS benchmark's
  // controls, what's on trial, and what the node observed for its
  // suggestions.
  rpc SysctlList(google.protobuf.Empty) returns (SysctlListResponse);
  // SysctlApply checks changes against the whitelist, each parameter's
  // bounds and the node's state, and applies them on trial: unless
  // SysctlConfirm comes within the timeout, the values from before the
  // trial come back by themselves. A trial already running grows by
  // these changes. With validate_only, it only checks them.
  rpc SysctlApply(SysctlApplyRequest) returns (SysctlApplyResponse);
  // SysctlConfirm saves the values on trial, which every boot then
  // applies. It must come over a connection opened after the latest
  // SysctlApply - proof that the node still takes new connections.
  rpc SysctlConfirm(google.protobuf.Empty) returns (SysctlTrialResponse);
  // SysctlCancel puts the values from before the trial back at once.
  rpc SysctlCancel(google.protobuf.Empty) returns (SysctlTrialResponse);
  // SysctlHistory returns the changes made to the parameters, newest
  // first: who, when, and each value before and after.
  rpc SysctlHistory(SysctlHistoryRequest) returns (SysctlHistoryResponse);
}

// Kernel parameters (internal/sysctl).

enum SysctlClass {
  SYSCTL_CLASS_UNSPECIFIED = 0;
  SYSCTL_CLASS_EDITABLE = 1; // the whitelist
  SYSCTL_CLASS_READ_ONLY = 2; // shown for diagnosis (why says why)
  SYSCTL_CLASS_FORBIDDEN = 3; // never changed, for Janus's own security
}

enum SysctlKind {
  SYSCTL_KIND_UNSPECIFIED = 0;
  SYSCTL_KIND_INT = 1;
  SYSCTL_KIND_ENUM = 2; // one of allowed
  SYSCTL_KIND_PAIR = 3; // "low high"
  SYSCTL_KIND_TRIPLE = 4; // "minimum default maximum"
  SYSCTL_KIND_PORTS = 5; // "8080,9100-9110", empty for none
  SYSCTL_KIND_TEXT = 6;
}

// When a change reaches what the parameter governs.
enum SysctlApplies {
  SYSCTL_APPLIES_UNSPECIFIED = 0;
  SYSCTL_APPLIES_IMMEDIATELY = 1;
  SYSCTL_APPLIES_NEW_CONNECTIONS = 2;
  SYSCTL_APPLIES_HAPROXY_RELOAD = 3; // HAProxy reads it when it opens its listeners
}

message SysctlBound {
  int64 min = 1;
  int64 max = 2;
}

message SysctlSource {
  string title = 1;
  string url = 2;
}

message SysctlParameter {
  string name = 1; // "net.core.somaxconn"
  SysctlClass class = 2;
  SysctlKind kind = 3;
  string unit = 4;
  string value = 5; // live, normalized: numbers separated by one space
  string missing = 6; // why there's no value - the kernel hasn't the file
  string default_value = 7; // Janus's default (editable only)
  bool default_dynamic = 8; // the default is the kernel's own value at boot
  bool saved = 9; // a value is saved - saved_value, which may be empty (no reserved port)
  string saved_value = 10;
  bool on_trial = 11;
  repeated SysctlBound bounds = 12; // one per number of the value
  repeated int64 allowed = 13; // SYSCTL_KIND_ENUM
  uint32 max_items = 14; // SYSCTL_KIND_PORTS
  SysctlApplies applies = 15;
  string requires = 16; // what it only matters with: "nftables"
  string summary = 17;
  string effect = 18; // on HAProxy
  string risk = 19;
  string why = 20; // read-only and forbidden: why it can't change
  string kernel_default = 21;
  string haproxy_value = 22; // HAProxy's recommendation, empty when none
  repeated SysctlSource sources = 23;
  repeated string warnings = 24; // about the live value
  // A value suggested for this node, from its memory and what it
  // observed, and why - never applied by itself; unset: none.
  SysctlRecommendation recommendation = 25;
}

message SysctlMeasurement {
  string name = 1;
  string value = 2;
  string window = 3; // empty for a fact about the machine
}

message SysctlRecommendation {
  string value = 1;
  string rule_id = 2;
  string rule = 3; // in words: tiers or formula
  repeated SysctlMeasurement measured = 4;
  repeated SysctlSource sources = 5;
}

message SysctlCISControl {
  repeated string ids = 1; // the benchmark's: "3.3.1.18"
  uint32 level = 2; // server profile level, 1 or 2
  string key = 3;
  string value = 4; // on the node
  repeated string want = 5; // compliant values
  bool compliant = 6;
  repeated string problems = 7;
  string interfaces = 8; // "ipv4", "ipv6": checked on every interface too
}

message SysctlCIS {
  string benchmark = 1;
  string profile = 2;
  uint32 compliant = 3; // controls
  repeated SysctlCISControl controls = 4;
}

message SysctlActor {
  string name = 1; // a certificate's name; "boot", "timeout"
  repeated string roles = 2;
  string via = 3; // the Controller acting for name
}

message SysctlChange {
  string name = 1;
  string old_value = 2;
  string new_value = 3;
  bool to_default = 4; // back to Janus's default
}

message SysctlTrial {
  int64 started_unix = 1; // the latest apply
  int64 revert_at_unix = 2;
  repeated SysctlChange changes = 3; // old_value: before the trial
  SysctlActor actor = 4; // who applied last
  bool haproxy_reloaded = 5;
}

message SysctlListResponse {
  bool managed = 1; // false: janusd doesn't run a Janus node - nothing changes
  repeated SysctlParameter parameters = 2;
  SysctlCIS cis = 3;
  SysctlTrial trial = 4; // unset: nothing on trial
  SysctlObservation observation = 5; // unset: nothing observes - not a Janus node
}

// A signal the node observes: a kernel counter summed by hour, or a gauge
// maxed by hour.
message SysctlSignal {
  string id = 1; // "accept_overflows"
  string title = 2;
  string measure = 3; // what's read, and where
  string seen = 4; // when an hour counts
  uint32 hours = 5; // the different hours it was seen in, over the window
  uint64 total = 6; // a counter's increase over the window
  string peak = 7; // its highest, in words; empty: nothing yet
  int64 last_seen_unix = 8; // the last hour it was seen in; 0: never
}

message SysctlObservation {
  int64 since_unix = 1; // the oldest hour kept
  uint32 window_hours = 2; // a signal counts over the last window_hours
  uint32 min_hours = 3; // in this many different hours at least
  repeated SysctlSignal signals = 4;
}

message SysctlChangeRequest {
  string name = 1;
  string value = 2;
  bool to_default = 3; // back to Janus's default, value ignored
}

message SysctlApplyRequest {
  repeated SysctlChangeRequest changes = 1;
  bool reset_all = 2; // every editable parameter back to its default
  uint32 confirm_timeout_seconds = 3; // 60 to 3600; 0: 600
  // Reload HAProxy, if it runs, when a parameter it reads at its
  // listeners' opening changes - and again when the trial is undone.
  bool reload_haproxy = 4;
  bool validate_only = 5;
}

message SysctlFieldError {
  string name = 1; // empty: the request as a whole
  string message = 2;
}

message SysctlApplyResponse {
  bool accepted = 1;
  repeated SysctlFieldError errors = 2;
  repeated SysctlChange changes = 3; // what changed - with validate_only, what would
  SysctlTrial trial = 4;
}

message SysctlTrialResponse {
  SysctlTrial trial = 1; // the trial confirmed or cancelled
}

message SysctlHistoryRequest {
  uint32 limit = 1; // 0: 100
}

message SysctlHistoryEntry {
  int64 time_unix = 1;
  SysctlActor actor = 2;
  string action = 3; // trial, confirm, cancel, revert, boot-refused
  repeated SysctlChange changes = 4;
  string detail = 5;
}

message SysctlHistoryResponse {
  repeated SysctlHistoryEntry entries = 1;
}

message MetricsConfig {
  bool enabled = 1;
  uint32 port = 2; // 0 = the default, 10056
  string address = 3; // to listen on - empty for every address
}

message NodeExporterConfig {
  bool enabled = 1;
  string address = 2; // to listen on - empty for every address
  uint32 port = 3; // 0 = the default, 9100
  repeated string collectors = 4; // empty = the default ones
}

message NodeExporterCollector {
  string name = 1;
  string description = 2;
  bool default = 3; // runs unless the settings say otherwise
}

message NodeExporterConfigResponse {
  NodeExporterConfig config = 1; // collectors always listed
  bool is_default = 2; // nothing was ever set
  repeated NodeExporterCollector available_collectors = 3;
  string state = 4; // the service's: "running", "disabled", "restarting"...
  string error = 5; // its last error, when it isn't running as set
}

message MetricsConfigResponse {
  MetricsConfig config = 1;
  bool is_default = 2; // nothing was ever set
  bool listening = 3;
  string error = 4; // why the exporter isn't listening as configured, if it isn't
}

message VersionResponse {
  string version = 1;
  string git_commit = 2;
  string build_date = 3;
  string go_version = 4;
  string kernel_version = 5;
  // "A" or "B" - empty if this boot isn't from a recognized A/B slot
  // (e.g. an initramfs-only test boot, see internal/bootslot).
  string active_slot = 6;
  // The image schematic this node booted (see docs/image-factory.md): the
  // ID from its signed kernel command line - the default schematic's for
  // an image without optional extensions - and the extensions the image
  // carries.
  string schematic_id = 7;
  repeated ExtensionInfo extensions = 8;
  // The node's CPU architecture, as Go names it ("amd64", "arm64") - which
  // release bundles fit it.
  string arch = 9;
  // The image's schematic in canonical JSON (schematic_id is its SHA-256):
  // the extensions, HAProxy branch and kernel track it picks - unset ones
  // follow each release's default. From the image's own
  // /usr/lib/janus/image.json; empty for an image that doesn't say.
  string schematic = 10;
  // The HAProxy the image is built with: its LTS branch and version.
  ImageComponent haproxy = 11;
  // The kernel track the image is built with, and that track's version in
  // the image (kernel_version is the running kernel's).
  ImageComponent kernel = 12;
}

// A HAProxy branch or kernel track an image is built with.
message ImageComponent {
  // The HAProxy branch ("3.2") or kernel track ("stable"); empty when the
  // image doesn't say.
  string variant = 1;
  // Its version in the image: "3.2.25", "7.2.9".
  string version = 2;
  // The image's schematic names this variant; false: the image got its
  // release's default, and moves with it from release to release.
  bool pinned = 3;
  // The variant is its release's default.
  bool release_default = 4;
}

// An optional extension built into the node's image.
message ExtensionInfo {
  string name = 1;
  string version = 2;
  string description = 3;
}

message HostnameResponse {
  string hostname = 1;
}

// RebootMode is how a node reboots. DEFAULT and POWERCYCLE go through
// the firmware (POST, the UEFI boot manager): the same full reboot.
// KEXEC loads the active slot's kernel from the ESP and jumps into it
// without the firmware - seconds instead of the minute a server's POST
// takes - under the firmware's own rule: with Secure Boot enabled, only
// a UKI signed by a Janus release certificate; refused otherwise
// (FailedPrecondition), nothing rebooted. Opt-in: a driver or a device
// left in an odd state by the running kernel is kexec's known risk,
// which a firmware reboot never has.
enum RebootMode {
  REBOOT_MODE_DEFAULT = 0;
  REBOOT_MODE_POWERCYCLE = 1;
  REBOOT_MODE_KEXEC = 2;
}

message RebootRequest {
  RebootMode mode = 1;
}

message RebootResponse {}

message ShutdownResponse {}

message RestartResponse {}

message ResetRequest {
  bool wipe_state = 1;
  bool wipe_ephemeral = 2;
}

message ResetResponse {}

message ApplyConfigurationRequest {
  bytes config_yaml = 1;

  enum Mode {
    MODE_AUTO = 0;      // reboot only if the change requires it
    MODE_NO_REBOOT = 1; // apply live, fail if a reboot would be required
    MODE_REBOOT = 2;    // always reboot after applying
    MODE_TRY = 3;       // apply, auto-rollback if the node isn't healthy within timeout
  }
  Mode mode = 2;
  // Only used with MODE_TRY.
  uint32 try_timeout_seconds = 3;
}

message ApplyConfigurationResponse {
  string message = 1;
  bool reboot_required = 2;
}

message EventsRequest {
  // Resume streaming from this point instead of the current tail.
  uint64 since_id = 1;
}

message Event {
  uint64 id = 1;
  int64 unix_time_ns = 2;
  string type = 3;
  bytes payload = 4;
}

message DmesgRequest {
  bool follow = 1;
}

message LogsRequest {
  // A managed service id (see ServiceInfo.id): "haproxy", "bird",
  // "keepalived", "janusd".
  string id = 1;
  bool follow = 2;
  int32 tail_lines = 3;
}

message StatsResponse {
  repeated ProcessStat processes = 1;
}

message ProcessStat {
  string id = 1;
  // Average over the processes' lifetime, like ps(1).
  double cpu_percent = 2;
  uint64 memory_bytes = 3;
  // Cumulative CPU time - the current rate is the difference between two
  // samples.
  double cpu_seconds = 4;
}

message SystemStatResponse {
  uint64 boot_time_unix = 1;
  uint64 context_switches = 2;
  uint64 processes_created = 3;
  // Cumulative CPU time across all CPUs, in USER_HZ ticks (/proc/stat's
  // "cpu" line) - utilization is 1 - d(idle)/d(total) between samples.
  uint64 cpu_total_ticks = 4;
  // Idle plus iowait ticks.
  uint64 cpu_idle_ticks = 5;
}

message MemoryResponse {
  uint64 total_bytes = 1;
  uint64 available_bytes = 2;
  uint64 cached_bytes = 3;
}

message CPUInfoResponse {
  repeated CPUInfo cpus = 1;
  // Physical packages and physical cores behind the logical CPUs above,
  // from sysfs topology; 0 = the kernel doesn't say.
  uint32 sockets = 2;
  uint32 cores = 3;
}

message CPUInfo {
  uint32 processor = 1;
  // /proc/cpuinfo's "model name", or on arm64 (which has none) the core
  // named from its implementer and part numbers, e.g. "ARM Cortex-A72".
  string model_name = 2;
  // Current frequency where /proc/cpuinfo has one (x86), else cpufreq's
  // maximum; 0 = unknown.
  double mhz = 3;
}

message LoadAvgResponse {
  double load1 = 1;
  double load5 = 2;
  double load15 = 3;
}

message DiskStatsResponse {
  repeated DiskStat disks = 1;
}

message DiskStat {
  string device_name = 1;
  uint64 read_completed = 2;
  uint64 write_completed = 3;
}

message DiskUsageRequest {
  repeated string paths = 1;
  bool recursive = 2;
}

message DiskUsageInfo {
  string path = 1;
  int64 size_bytes = 2;
  bool is_dir = 3;
}

message NetworkDeviceStatsResponse {
  repeated NetworkDeviceStat devices = 1;
}

message NetworkDeviceStat {
  string name = 1;
  uint64 rx_bytes = 2;
  uint64 tx_bytes = 3;
  uint64 rx_errors = 4;
  uint64 tx_errors = 5;
}

message NetstatResponse {
  repeated Connection connections = 1;
}

message Connection {
  string local_address = 1;
  string remote_address = 2;
  string state = 3;
  string protocol = 4;
}

message MountsResponse {
  repeated MountStat mounts = 1;
}

message MountStat {
  string filesystem = 1;
  string mounted_on = 2;
  uint64 size_bytes = 3;
  uint64 available_bytes = 4;
  bool read_only = 5;
}

message ProcessesResponse {
  repeated ProcessInfo processes = 1;
}

message ProcessInfo {
  int32 pid = 1;
  string command = 2;
  // Average over the process's lifetime, like ps(1).
  double cpu_percent = 3;
  uint64 memory_bytes = 4;
  // Cumulative CPU time, like ProcessStat.cpu_seconds - the current rate
  // is the difference between two samples. 0 from a node older than this
  // field.
  double cpu_seconds = 5;
}

message ServiceInfo {
  string id = 1;
  string state = 2;  // e.g. "running", "stopped", "failed"
  string health = 3; // e.g. "healthy", "unhealthy", "unknown"
  // The optional extension providing this service; empty for janusd and
  // haproxy.
  string extension = 4;
  string description = 5;
}

message ServiceListResponse {
  repeated ServiceInfo services = 1;
}

message ServiceRequest {
  string id = 1;
}

message ServiceResponse {
  ServiceInfo service = 1;
}

message ListRequest {
  string root = 1;
  bool recursive = 2;
}

message FileInfo {
  string name = 1;
  string relative_name = 2;
  int64 size = 3;
  uint32 mode = 4;
  bool is_dir = 5;
  string error = 6;
}

message ReadRequest {
  string path = 1;
}

message CopyRequest {
  // Root path to stream as a tar archive.
  string root_path = 1;
}

message PacketCaptureRequest {
  // Network interface to capture on (e.g. "eth0", "lo"). Required.
  string interface = 1;
  // tcpdump-style filter expression (e.g. "tcp port 443 and not host
  // 10.0.0.1"), compiled to classic BPF on the node and attached in the
  // kernel, so non-matching packets never leave it. Empty captures
  // everything.
  string bpf_filter = 2;
  bool promiscuous = 3;
  // Bytes kept per packet; 0 means 65535.
  uint32 snap_len = 4;
  // Stop after this many seconds, flushing every captured packet before
  // the stream ends normally. 0 means run until the client cancels (the
  // last ~200ms of packets may then be lost with the cancellation).
  uint32 duration_seconds = 5;
  // By default the node leaves out the TCP connection carrying this very
  // capture (both directions, exact endpoints) - on the interface that
  // carries it, it would otherwise be most of what gets captured. Set
  // this to capture it anyway.
  bool include_own_stream = 6;
}

message MetaWriteRequest {
  uint32 key = 1;
  bytes value = 2;
}

message MetaDeleteRequest {
  uint32 key = 1;
}

message GenerateClientConfigurationRequest {
  // Role names to embed in the issued client certificate, validated
  // against internal/pki's role set (e.g. "os:admin", "os:reader").
  repeated string roles = 1;
  // The certificate's common name: who or what it's for ("alice-laptop",
  // "monitoring"). Up to 64 letters, digits, spaces and ._@:+-, starting
  // with a letter or digit. Empty: "client".
  string name = 2;
  // How long it's valid, in seconds: 0 is the most, one year; at least
  // 60.
  uint32 ttl_seconds = 3;
}

message GenerateClientConfigurationResponse {
  bytes ca = 1;
  bytes crt = 2;
  bytes key = 3;
}
