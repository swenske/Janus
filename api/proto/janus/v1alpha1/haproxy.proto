syntax = "proto3";

package janus.v1alpha1;

import "google/protobuf/empty.proto";
import "janus/v1alpha1/network.proto";

option go_package = "github.com/swenske/Janus/gen/janus/v1alpha1;janusv1alpha1";

// HAProxyService configures and drives the node's HAProxy - what
// editing haproxy.cfg over SSH would be elsewhere: its configuration, its
// runtime state (servers, maps, ACLs, certificates) over its stats
// socket, its files, and the letsencrypt extension's certificates.
service HAProxyService {
  // GetConfig returns the applied haproxy.cfg and its SHA-256. A caller
  // who may not apply a configuration (os:reader) gets it with its
  // secrets masked - userlist and "stats auth" passwords, credential
  // headers' values, setenv values - and the SHA-256 of what it got.
  rpc GetConfig(google.protobuf.Empty) returns (GetConfigResponse);
  // ApplyConfig validates the given config via `haproxy -c` before
  // reloading - a rejected config never reaches the running process.
  // The stages stream: "validating", then "reloading" and "done"
  // (accepted), or "rejected" with HAProxy's errors. The configuration
  // is kept across reboots and updates.
  rpc ApplyConfig(ApplyConfigRequest) returns (stream ApplyConfigResponse);
  // ValidateConfig runs the same validation as ApplyConfig without
  // touching the running process (dry-run).
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);
  // ConfigHistory lists the configurations ApplyConfig accepted on this
  // node, newest first: who applied each, when, its SHA-256, and the
  // lines it added and removed against the version before it. The
  // history is kept with the configuration, across reboots and updates,
  // to the newest 50 versions and 8 MiB. A caller who may not apply a
  // configuration gets each version's figures as GetConfig would show it
  // to them: from its text with the secrets masked.
  rpc ConfigHistory(ConfigHistoryRequest) returns (ConfigHistoryResponse);
  // ConfigVersion returns one version's text, masked like GetConfig for a
  // caller who may not apply a configuration.
  rpc ConfigVersion(ConfigVersionRequest) returns (ConfigVersionResponse);
  // Reload triggers a seamless (zero-downtime) reload of the currently
  // applied config.
  rpc Reload(google.protobuf.Empty) returns (ReloadResponse);

  // Stats proxies HAProxy's own stats socket ("show stat").
  rpc Stats(google.protobuf.Empty) returns (HAProxyStatsResponse);
  // ShowInfo proxies the stats socket's "show info".
  rpc ShowInfo(google.protobuf.Empty) returns (ShowInfoResponse);

  // BackendList lists every backend with each server's address and state
  // ("up", "down", "maint", "drain"...).
  rpc BackendList(google.protobuf.Empty) returns (BackendListResponse);
  // ServerSetState enables/disables/drains a single backend server at
  // runtime (stats socket "set server ... state ...").
  rpc ServerSetState(ServerSetStateRequest) returns (google.protobuf.Empty);

  // Runtime maps and ACL lists (stats socket "show/add/del map", "add/del
  // acl"): only those haproxy.cfg loads from a file. A change is made in
  // the running HAProxy's memory - the file, and so the next reload,
  // keep the old content (FilePut changes the file).

  // MapList lists the maps the running HAProxy loaded.
  rpc MapList(google.protobuf.Empty) returns (MapListResponse);
  // MapGet returns a map's entries.
  rpc MapGet(MapGetRequest) returns (MapGetResponse);
  // MapUpdate adds, replaces or deletes one entry of a map.
  rpc MapUpdate(MapUpdateRequest) returns (google.protobuf.Empty);
  // MapLookup tells which entry of a map a value matches, the way a
  // request's value would - with the method the configuration reads the
  // map with (str, beg, dom, reg...), unlike MapGet's exact keys.
  rpc MapLookup(PatternLookupRequest) returns (PatternLookupResponse);

  // ACLUpdate adds or deletes one value of an ACL list.
  rpc ACLUpdate(ACLUpdateRequest) returns (google.protobuf.Empty);
  // ACLLookup tells which pattern of an ACL list a value matches.
  rpc ACLLookup(PatternLookupRequest) returns (PatternLookupResponse);

  // CertificateList lists the certificates the running HAProxy holds,
  // with their expiry.
  rpc CertificateList(google.protobuf.Empty) returns (CertificateListResponse);
  // CertificateUpload loads a certificate into the running HAProxy and
  // keeps it on the node (STATE): janusd puts it back - crt-list binding
  // included - into every new HAProxy process, after a reload, a restart
  // or a reboot.
  rpc CertificateUpload(CertificateUploadRequest) returns (google.protobuf.Empty);
  // CertificateDelete removes an uploaded certificate from the running
  // HAProxy and from the node, unbinding it from crt_list first.
  rpc CertificateDelete(CertificateDeleteRequest) returns (google.protobuf.Empty);

  // HAProxy's own files (docs/haproxy-files.md): what haproxy.cfg
  // references besides the letsencrypt extension's certificates - error
  // pages, maps, ACL lists, Lua, other certificates - as
  // /etc/haproxy/files/<name>, kept on the node. A file is only written or
  // removed if haproxy.cfg still loads with the change; a file holding a
  // private key is never read back.

  // FileList lists the files, with their size and SHA-256.
  rpc FileList(google.protobuf.Empty) returns (FileListResponse);
  // FileGet returns a file's content - refused for one holding a private
  // key.
  rpc FileGet(FileGetRequest) returns (FileGetResponse);
  // FilePut writes a file, and reloads HAProxy with it if asked.
  rpc FilePut(FilePutRequest) returns (FilePutResponse);
  // FileDelete removes a file - refused while haproxy.cfg needs it.
  rpc FileDelete(FileDeleteRequest) returns (FileDeleteResponse);

  // ACME: the letsencrypt extension (docs/letsencrypt.md). The node
  // obtains and renews its certificates itself, from Let's Encrypt or any
  // ACME CA, writes each to /etc/haproxy/acme/<name>.pem and swaps a
  // renewed one into the running HAProxy without a reload. Without the
  // extension in the image, ACMEStatus says so and the other calls answer
  // FailedPrecondition.

  // ACMEStatus reports each certificate's state: obtained, its expiry,
  // its next renewal, the last error.
  rpc ACMEStatus(google.protobuf.Empty) returns (ACMEStatusResponse);
  // ACMEGetConfig returns the configuration - never a secret (a DNS
  // provider's settings, the EAB key): their values come back empty.
  rpc ACMEGetConfig(google.protobuf.Empty) returns (ACMEGetConfigResponse);
  // ACMEApplyConfig replaces the configuration; an empty secret keeps the
  // saved one.
  rpc ACMEApplyConfig(ACMEApplyConfigRequest) returns (ACMEApplyConfigResponse);
  // ACMERenew obtains the named certificates (every one if none is named)
  // now, whether or not they're due, in the background: ACMEStatus says
  // how it went.
  rpc ACMERenew(ACMERenewRequest) returns (ACMERenewResponse);
  // ACMECheckPath fetches the CA's directory the way the node would reach
  // it - the given path, or the saved one - and says how it went, without
  // changing anything.
  rpc ACMECheckPath(ACMECheckPathRequest) returns (ACMECheckPathResponse);
  // ACMECertificateRequest makes a new private key and its certificate
  // signing request for one of the configured certificates, for the
  // Controller - or another orchestrator - to order it from the CA (path
  // CONTROLLER_ORDERED). The key never leaves the node; a new request
  // replaces the one waiting.
  rpc ACMECertificateRequest(ACMECertificateRequestRequest) returns (ACMECertificateRequestResponse);
  // ACMEInstallCertificate installs the certificate the CA issued for the
  // request waiting - checked against its key and the configured domains
  // - and swaps it into the running HAProxy; or keeps in the
  // certificate's status why it couldn't be obtained.
  rpc ACMEInstallCertificate(ACMEInstallCertificateRequest) returns (ACMECertificateStatus);

  // Runtime diagnostics (stats socket "show table", "show sess", "show
  // errors"): what the running HAProxy holds in its stick tables, the
  // streams it is processing, the last requests and responses it refused
  // as invalid. Read from the process, never kept.

  // TableList lists the running configuration's stick tables: each one's
  // key type, size and entries in use.
  rpc TableList(google.protobuf.Empty) returns (TableListResponse);
  // TableShow returns a stick table's entries: the one whose key is key,
  // or those whose stored data match every filter - limit at most.
  rpc TableShow(TableShowRequest) returns (TableShowResponse);
  // TableClear removes stick table entries: the one whose key is key, the
  // ones whose data match the filters, or every one when all is set - a
  // client a rate limit blocked is let through again.
  rpc TableClear(TableClearRequest) returns (google.protobuf.Empty);
  // SessionList lists the streams HAProxy is processing - requests not
  // yet answered, TCP connections being relayed - a frontend's, a
  // backend's or a client's when asked.
  rpc SessionList(SessionListRequest) returns (SessionListResponse);
  // SessionShutdown ends one of those streams: its client and server
  // connections are closed.
  rpc SessionShutdown(SessionShutdownRequest) returns (google.protobuf.Empty);
  // ErrorsShow returns the last invalid request and response HAProxy kept
  // for each proxy - what it answered 400 or 502 for - with the bytes it
  // read and the one it refused; credential headers' values are masked.
  rpc ErrorsShow(ErrorsShowRequest) returns (ErrorsShowResponse);
}

message GetConfigResponse {
  bytes config = 1;
  string sha256 = 2; // of config, as returned
  // redacted: secrets were replaced by "<redacted>" - the caller may
  // read the configuration but not apply one.
  bool redacted = 3;
}

message ApplyConfigRequest {
  bytes config = 1;
  // Apply this version of ConfigHistory instead of config, which must
  // then be empty: going back to a configuration applied before. It is
  // validated and reloaded like any other, and recorded as a new version
  // that names the one it came from.
  uint64 version = 2;
}

message ApplyConfigResponse {
  string stage = 1; // "validating", "reloading", "done"
  string message = 2;
  bool accepted = 3;
}

message ConfigHistoryRequest {
  // The newest versions only; 0: every version kept.
  uint32 limit = 1;
}

message ConfigHistoryResponse {
  repeated ConfigVersionInfo versions = 1;
  // The figures are a masked text's: the caller may not apply a
  // configuration.
  bool redacted = 2;
  // The bounds the history is kept to.
  uint32 max_versions = 3;
  uint64 max_bytes = 4;
}

message ConfigVersionInfo {
  uint64 id = 1;
  // When it was applied; 0 for the configuration found when the history
  // began.
  int64 applied_unix = 2;
  ConfigAuthor author = 3;
  string sha256 = 4;
  uint64 size = 5;
  // Against the version before it in the history; for the oldest kept,
  // against nothing.
  uint32 lines_added = 6;
  uint32 lines_removed = 7;
  // Applied again from this version: going back. 0: none.
  uint64 reverted_from = 8;
  // The configuration this node ran when it began keeping a history:
  // applied before, by someone it can't name.
  bool before_history = 9;
  // The configuration HAProxy runs now.
  bool running = 10;
}

// ConfigAuthor is who applied a version: a certificate's name and roles,
// and the Controller that acted for it.
message ConfigAuthor {
  string name = 1;
  repeated string roles = 2;
  string via = 3;
}

message ConfigVersionRequest {
  uint64 id = 1;
}

message ConfigVersionResponse {
  ConfigVersionInfo version = 1;
  bytes config = 2;
  // Secrets masked, as in GetConfig.
  bool redacted = 3;
}

message ValidateConfigRequest {
  bytes config = 1;
}

message ValidateConfigResponse {
  bool valid = 1;
  repeated string errors = 2;
}

message ReloadResponse {
  bool success = 1;
  string message = 2;
}

message HAProxyStatsResponse {
  // Raw "show stat" CSV output from the stats socket, parsed
  // structurally once a concrete consumer needs it (Phase 2).
  bytes raw_csv = 1;
}

message ShowInfoResponse {
  string version = 1;
  uint64 uptime_seconds = 2;
  uint32 current_connections = 3;
  uint32 max_connections = 4;
  // Totals since HAProxy started - rate over time is the difference
  // between two samples.
  uint64 cumulative_connections = 5;
  uint64 cumulative_requests = 6;
  // HAProxy's own per-second rates, over the last second.
  uint32 connection_rate = 7;
  uint32 session_rate = 8;
  // Share of the last second HAProxy's threads spent idle, 0-100.
  uint32 idle_percent = 9;
  // Log lines this HAProxy process dropped rather than wait: its stdout
  // (janusd) or a log server couldn't take them at once, or two of its
  // threads wrote to its stdout at the same time.
  uint64 dropped_logs = 10;
}

message Backend {
  string name = 1;
  repeated BackendServer servers = 2;
}

message BackendServer {
  string name = 1;
  string address = 2;
  string state = 3; // "up", "down", "maint", "drain"
}

message BackendListResponse {
  repeated Backend backends = 1;
}

message ServerSetStateRequest {
  string backend = 1;
  string server = 2;
  enum State {
    STATE_READY = 0;
    STATE_DRAIN = 1;
    STATE_MAINT = 2;
  }
  State state = 3;
}

message MapListResponse {
  repeated string maps = 1;
}

message MapGetRequest {
  string map = 1;
}

message MapGetResponse {
  map<string, string> entries = 1;
}

message MapUpdateRequest {
  string map = 1;
  string key = 2;
  string value = 3;
  bool delete = 4;
}

message ACLUpdateRequest {
  string acl = 1;
  string value = 2;
  bool delete = 3;
}

message CertificateListResponse {
  repeated CertificateInfo certificates = 1;
}

message CertificateInfo {
  string name = 1;
  string not_after = 2; // RFC3339
  // "Used" or "Unused" - HAProxy's own status for this cert store entry
  // (bound to a live crt-list, or not). Raw string, not an enum: it's
  // display info, nothing branches on the exact value.
  string status = 3;
}

message CertificateUploadRequest {
  string name = 1;
  bytes pem_bundle = 2; // cert + key (+ chain), PEM-concatenated

  // Optional: bind this certificate into crt_list (a `bind ... ssl
  // crt-list <path>` file already referenced by the running config) as
  // part of the same call, with an optional SNI filter. Leave crt_list
  // empty to only upload into HAProxy's certificate store without
  // binding it anywhere - matches the previous behavior.
  string crt_list = 3;
  repeated string sni = 4;
}

message CertificateDeleteRequest {
  string name = 1;
  // Optional: unbind from crt_list before deleting. HAProxy refuses to
  // delete a certificate still bound to any crt-list, so this must name
  // every crt-list the certificate was added to (CertificateUpload only
  // ever binds to one at a time, but nothing stops a caller from binding
  // the same cert into more than one crt-list out of band).
  string crt_list = 2;
}

// ACMEConfig is the letsencrypt extension's configuration - also its JSON
// form, as saved on the node.
message ACMEConfig {
  ACMEAccount account = 1;
  repeated ACMECertificate certificates = 2;
  repeated ACMEDNSProvider dns_providers = 3;
  // How the node reaches the CA (docs/letsencrypt.md, "How the node
  // reaches Let's Encrypt"). Kept apart from the rest on the node, so an
  // older janusd still reads the rest.
  ACMEPath path = 4;
}

// ACMEPathMode is how the node reaches the CA.
enum ACMEPathMode {
  ACME_PATH_MODE_UNSPECIFIED = 0; // directly
  ACME_PATH_MODE_DIRECT = 1; // the node reaches the CA, and the DNS providers' APIs, itself
  ACME_PATH_MODE_PROXY = 2; // through an HTTP(S) proxy
  // Through the Controller's relay: an https:// proxy that knows the node
  // by a certificate of the node's own CA, made for each request.
  ACME_PATH_MODE_CONTROLLER_RELAY = 3;
  // Ordered by the Controller: it orders the certificates from the
  // configured CA with its own account, through the node's requests
  // (ACMECertificateRequest, ACMEInstallCertificate); the node never
  // reaches the CA, its keys never leave it.
  ACME_PATH_MODE_CONTROLLER_ORDERED = 4;
}

message ACMEPath {
  ACMEPathMode mode = 1;
  // PROXY: the proxy's URL, http:// or https:// (no credentials in it).
  // CONTROLLER_RELAY: the relay's, https://.
  string proxy_url = 2;
  string proxy_username = 3; // PROXY, optional
  string proxy_password = 4; // PROXY: secret; empty keeps the saved one
  // PROXY: PEM, the CA of an https:// proxy's certificate (default: the
  // node's trust store). CONTROLLER_RELAY: the Controller's identity -
  // what it gives nodes to register against - required.
  string proxy_ca = 5;
  // CONTROLLER_ORDERED: the thumbprint of the account the Controller
  // orders with - what the HTTP-01 rule answers with.
  string account_thumbprint = 6;
}

message ACMECertificateRequestRequest {
  string name = 1; // a configured certificate's
}

message ACMECertificateRequestResponse {
  string name = 1;
  string csr_pem = 2;
  repeated string domains = 3; // what it asks for, as configured
  string key_type = 4;
}

message ACMEInstallCertificateRequest {
  string name = 1;
  string chain_pem = 2; // what the CA issued, the leaf first
  // Instead of chain_pem: why it couldn't be obtained, and when it will be
  // tried again - kept in the certificate's status.
  string error = 3;
  int64 next_attempt_unix = 4;
}

message ACMECheckPathRequest {
  // Empty: the saved path. A password left empty is the saved one.
  ACMEPath path = 1;
  // Empty: the saved directory (and its CA).
  string directory = 2;
  string directory_ca = 3;
}

message ACMECheckPathResponse {
  bool ok = 1;
  string directory = 2; // the URL fetched
  string via = 3; // how: "directly", "through the proxy http://..."
  string terms_url = 4; // what the directory said
  string error = 5;
  uint32 milliseconds = 6;
}

message ACMEAccount {
  // The CA's ACME directory URL, or "letsencrypt" (the default, when
  // empty) or "letsencrypt-staging".
  string directory = 1;
  // PEM: if set, the only CA trusted for the directory's HTTPS certificate
  // (a private ACME server's); otherwise the node's trust store.
  string directory_ca = 2;
  string email = 3; // optional contact address
  // Registering an account means accepting the CA's terms of service:
  // needed for a key the CA doesn't know yet.
  bool accept_terms = 4;
  // External account binding, for the CAs that require one.
  string eab_key_id = 5;
  string eab_hmac_key = 6; // secret
}

message ACMECertificate {
  // Its file is /etc/haproxy/acme/<name>.pem (letters, digits, '.', '-',
  // '_'). Until the CA's certificate is there, the file holds a
  // self-signed stand-in, so HAProxy can start with it referenced.
  string name = 1;
  // The names it covers; a wildcard ("*.example.com") needs dns-01.
  repeated string domains = 2;
  string key_type = 3; // "ec256" (default), "ec384", "rsa2048", "rsa3072", "rsa4096"
  string challenge = 4; // "http-01" (default) or "dns-01"
  string dns_provider = 5; // dns-01: the name of one of dns_providers
  string profile = 6; // the CA's certificate profile, if it has several
}

message ACMEDNSProvider {
  string name = 1; // what certificates refer to it by
  // gandiv5, ovh, cloudflare, route53... (docs/letsencrypt.md)
  string type = 2;
  // The provider's settings, under lego's own variable names
  // (GANDIV5_PERSONAL_ACCESS_TOKEN...). Secret.
  map<string, string> settings = 3;
  // Resolvers for the propagation check (host[:port]); default: the
  // node's. With split-horizon DNS, give public ones.
  repeated string resolvers = 4;
  // If set, wait this long after creating the record instead of checking
  // that it's visible - for networks where the check can't see it.
  uint32 propagation_wait_seconds = 5;
}

message ACMEGetConfigResponse {
  ACMEConfig config = 1;
  bool is_default = 2; // none saved
}

message ACMEApplyConfigRequest {
  ACMEConfig config = 1;
  bool validate_only = 2;
  // Optional: an account private key (PEM, EC or RSA) to use from now on -
  // an existing account's, to keep its thumbprint. Empty keeps the node's
  // (generated the first time it's needed).
  string account_key = 3;
}

message ACMEApplyConfigResponse {
  bool accepted = 1;
  repeated string errors = 2;
}

message ACMERenewRequest {
  repeated string names = 1;
}

message ACMERenewResponse {
  repeated string names = 1; // the certificates being obtained
}

message ACMEStatusResponse {
  ModuleState state = 1;
  bool configured = 2; // a configuration is saved
  // The account key's thumbprint (RFC 7638). An HTTP-01 challenge's
  // answer is "<token>.<thumbprint>"; HAProxy has it in its environment
  // as JANUS_ACME_THUMBPRINT.
  string account_thumbprint = 3;
  string account_uri = 4; // once the CA knows the account
  string account_error = 5;
  string directory = 6; // the URL in use
  string terms_url = 7;
  // An http-request rule answering HTTP-01 challenges, for the frontends
  // that receive them (port 80).
  string http01_rule = 8;
  string certificates_dir = 9;
  repeated ACMECertificateStatus certificates = 10;
  ACMEPathMode path_mode = 11; // how the node reaches the CA
  string proxy_url = 12; // PROXY
  // A cluster member another member orders for (ClusterSetRequest.
  // acme_orderer): that member's name. This node orders nothing; it
  // serves the certificates its cluster pulls, and answers HTTP-01 with
  // the orderer's thumbprint - account_thumbprint above.
  string ordered_by = 13;
}

message ACMECertificateStatus {
  string name = 1;
  repeated string domains = 2; // configured
  string path = 3;
  // "pending": not obtained yet, the stand-in is there; "valid"; "due": to
  // renew; "expired".
  string state = 4;
  repeated string served_domains = 5; // what the file's certificate covers
  string issuer = 6;
  int64 not_before_unix = 7;
  int64 not_after_unix = 8;
  string serial = 9;
  int64 renew_at_unix = 10; // when it becomes due
  bool in_progress = 11;
  int64 last_attempt_unix = 12;
  int64 last_success_unix = 13;
  string last_error = 14; // the last attempt's, if it failed
  uint32 failures = 15; // consecutive
  int64 next_attempt_unix = 16; // after a failure
}

message HAProxyFile {
  string name = 1; // relative to the files directory: "errors/503.http"
  string path = 2; // what haproxy.cfg references
  uint64 size = 3;
  string sha256 = 4;
  int64 modified_unix = 5;
  bool secret = 6; // holds a private key: never read back
}

message FileListResponse {
  repeated HAProxyFile files = 1;
  string dir = 2; // /etc/haproxy/files
}

message FileGetRequest {
  string name = 1;
}

message FileGetResponse {
  bytes content = 1;
}

message FilePutRequest {
  // Letters, digits, '.', '-', '_', and at most one subdirectory
  // ("certs/admin.pem"). Up to 1 MiB.
  string name = 1;
  bytes content = 2;
  // Reload HAProxy afterwards, for the running process to use it.
  bool reload = 3;
}

message FilePutResponse {
  bool accepted = 1;
  repeated string errors = 2; // HAProxy's, when haproxy.cfg doesn't load with it
}

message FileDeleteRequest {
  string name = 1;
  bool reload = 2;
}

message FileDeleteResponse {
  bool accepted = 1;
  repeated string errors = 2; // HAProxy's, when haproxy.cfg needs it
}

message PatternLookupRequest {
  string name = 1; // the map or ACL list, as MapList names it
  string value = 2;
}

message PatternLookupResponse {
  bool found = 1;
  string method = 2; // how the configuration matches it: str, beg, dom, reg, ip...
  bool case_insensitive = 3;
  string pattern = 4; // the key or pattern value matched
  string value = 5; // a map's value for it
}

message StickTable {
  string name = 1;
  string type = 2; // the key's: ip, ipv6, integer, string, binary
  uint64 size = 3;
  uint64 used = 4;
}

message TableListResponse {
  repeated StickTable tables = 1;
}

// TableFilter keeps the entries whose stored data compares to value with
// op - HAProxy's "data.<type> <op> <value>".
message TableFilter {
  string data = 1; // a data type the table stores: "http_req_rate", "gpc0", "conn_cur"...
  string op = 2; // eq, ne, lt, le, gt, ge
  int64 value = 3;
}

message TableShowRequest {
  string table = 1;
  string key = 2; // that entry only
  repeated TableFilter filters = 3; // at most 4; not with a key
  uint32 limit = 4; // entries returned: 500 when 0, 5000 at most
}

message TableEntry {
  string key = 1;
  uint64 use = 2; // streams tracking it now
  int64 expires_ms = 3; // until it expires
  // data: what the table stores for it, by HAProxy's names - a rate with
  // its period in milliseconds ("http_req_rate(10000)").
  repeated TableData data = 4;
}

message TableData {
  string name = 1;
  string value = 2;
}

message TableShowResponse {
  StickTable table = 1;
  repeated TableEntry entries = 2;
  bool truncated = 3; // more entries matched than limit
}

message TableClearRequest {
  string table = 1;
  string key = 2;
  repeated TableFilter filters = 3; // at most 4; not with a key
  bool all = 4; // every entry - neither key nor filters
}

message SessionListRequest {
  string frontend = 1;
  string backend = 2;
  string source = 3; // a client's address, with or without its port
  uint32 limit = 4; // streams returned: 500 when 0, 5000 at most
}

message Session {
  string id = 1; // what SessionShutdown takes
  string proto = 2; // tcpv4, tcpv6...
  string source = 3; // the client's address and port
  string frontend = 4;
  string backend = 5; // empty until one is chosen
  string server = 6;
  string age = 7; // as HAProxy writes it: "1m30s"
  uint64 age_seconds = 8;
  uint64 calls = 9;
  string expires = 10; // the next timeout, as HAProxy writes it
  string raw = 11; // HAProxy's whole line: its internal state
}

message SessionListResponse {
  repeated Session sessions = 1;
  bool truncated = 2; // more streams matched than limit
}

message SessionShutdownRequest {
  string id = 1;
}

message ErrorsShowRequest {
  string proxy = 1; // a frontend or backend; every one when empty
  string direction = 2; // "request" or "response"; both when empty
}

message CapturedError {
  string when = 1; // as HAProxy writes it: "18/Oct/2026:07:38:35.666"
  int64 when_unix_ms = 2;
  string proxy_kind = 3; // frontend, backend
  string proxy = 4;
  string direction = 5; // request, response
  string frontend = 6;
  string backend = 7;
  string server = 8;
  string source = 9; // the client's address
  uint64 event = 10; // HAProxy's count of captured errors when it happened
  int32 position = 11; // of the refused byte in the buffer
  repeated string details = 12; // HAProxy's lines on its buffer and parser state
  repeated ErrorLine lines = 13;
}

// ErrorLine is one line of the buffer HAProxy captured, its bytes
// escaped as HAProxy writes them ("\r\n", "\xHH").
message ErrorLine {
  int32 offset = 1;
  bool continued = 2; // goes on the line above, cut for length
  string text = 3;
  int32 error_at = 4; // where in text the refused byte is; -1 when elsewhere
}

message ErrorsShowResponse {
  uint64 total = 1; // errors captured since HAProxy started
  repeated CapturedError errors = 2;
}
